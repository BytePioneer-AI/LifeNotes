- date: "2025-08-20"
  title: ⭐ DeepSeek V3.1
  text: |-
    **摘要：** DeepSeek V3.1 是一款备受瞩目的混合推理（Hybrid Reasoning）MoE模型，以极高的性价比在编程和推理任务上展现出强大实力。然而，社区评测显示其表现“偏科”，在取得优异基准成绩的同时，也在物理模拟、视觉创意等特定领域暴露明显短板。其采用的 `UE8M0 FP8` 精度格式，被视为推动国产AI芯片软硬协同的关键一步，引发了市场广泛关注。

    **模型规格与架构：**
    - **参数量：** 采用专家混合（MoE）架构，总参数量671B，激活参数量37B。
    - **架构/范式：** 混合推理模型，整合了“思考”（类似 `R1`）与“非思考”（类似 `V3`）两种模式。新增了用于原生搜索的 `<｜search begin｜>` 和显式思维链的 `<think>` 等特殊Token。
    - **上下文：** 128K。
    - **精度格式：** 采用了 `UE8M0 FP8 Scale` 参数精度，该格式能大幅节省内存带宽，旨在深度适配和优化国产AI芯片的性能。

    **性能与实测表现：**
    - **基准：** 在 `Aider` 编程基准上得分71.6%，超越了 `Claude 3 Opus`，且成本仅为其1/68。
    - **实测（综合社区评测）：**
      - **优势领域：** 在常规编程（如网页开发）、逻辑推理（表现不输于 `Gemini 2.5 Pro`）和工具调用（稳定性提升）方面表现出色。`非思考`模式在小说开篇等任务上甚至优于`思考`模式。
      - **劣势领域：** 表现两极分化。在需要精确物理模拟（如p5.js小球弹跳）或特定审美（如网页设计）的编程任务中惨败。
      - **稳定性：** 长文本生成时，网页端出现过突然中断、内容清空并“失忆”的Bug。`思考`模式在小说续写中也出现了前后矛盾。

    **优势：**
    - **极高性价比：** 在其擅长的领域，提供了顶级的性能和极低的成本，对开发者极具吸引力。
    - **软硬协同：** 率先采用 `UE8M0 FP8` 格式，主动适配国产芯片硬件，为国产AI生态建设提供了范例。

    **劣势：**
    - **能力偏科严重：** 模型能力不均衡，是一个“偏科生”，在某些领域表现极佳，在另一些领域则完全不可用。
    - **审美与物理理解欠缺：** 代码能力似乎停留在“知其然，不知其所以然”的层面，缺乏对物理规律和视觉美学的深入理解。
    - **长上下文稳定性存疑：** 在长文本任务中暴露出稳定性问题，可能与Web端审查或缓存机制有关。
  modelSize: 671B (激活 37B)
