- date: "2025-11-03"
  title: "美团 LongCat-Flash-Omni"
  text: |-
    **摘要：**
    美团 `LongCat` 团队于 2025年11月3日 发布并开源的旗舰级**全模态（Omni-modal）大模型**。该模型的核心突破在于，它在拥有 `5600亿`（560B）庞大总参数规模的同时，凭借高效的 **MoE 架构**（激活参数仅 `27B`），首次在开源模型中实现了**毫秒级的实时音视频交互**，解决了大模型多模态应用的延迟痛点。

    **模型规格与架构：**
    - **LLM 主干：** 基于 `LongCat-Flash` 的 **Shortcut-Connected MoE** (`ScMoE`) 架构，包含 `512` 个标准专家和 `256` 个“**零计算专家**”（Zero-Computation Experts），这是其实现低延迟的核心。
    - **多模态组件：**
      - 视觉编码器：`LongCat-ViT`，支持原生分辨率输入。
      - 音频编解码器：`LongCat-Audio-Codec`，支持流式解码。
    - **上下文：** 支持 `128K` tokens，可处理超 8 分钟的音视频交互。
    - **训练策略：** 采用“**渐进式早期多模融合**”策略（共6个阶段），确保了“**全模态不降智**”，即在增强多模态能力的同时，单模态（尤其是文本）能力不下降。

    **性能与实测表现：**
    - **基准性能：** 在 `OmniBench`、`WorldSense` 等全模态基准上达到开源 SOTA，性能可对标 `Gemini-2.5-Pro` 和 `GPT-4o`。
    - **单模态：** 在音频（ASR）、视频理解方面表现突出，文本能力也与顶尖纯文本 MoE 模型持平。
    - **实时交互：** 真人评测中，其交互的自然度和流畅度显著优于 `Qwen3-Omni`。

    **优势 / 劣势（社区实测）：**
    - 优势：实时音视频理解（如街景识别）能力强；报告分析、识图等能力优秀；速度极快。
    - 劣势：表格处理能力较弱（如转HTML失败、计算易出错）；空间逻辑能力有待提升（如色盲测试失败）。
  modelSize: "560B (总计 560B, 激活 27B)"
  modelType: "多模态"
  openSource: true
  contextWindow: "128K"
  officialDoc: "https://github.com/meituan-longcat/LongCat-Flash-Omni"

- date: "2025-10-27"
  title: ⭐MiniMax M2
  text: |-
    **摘要：**
    MiniMax（上海稀宇科技有限公司）于2025年10月27日发布并**开源**（MIT 许可）的大型语言模型，专为 `Agent`（智能体）与**代码生成**而优化。其核心特点是采用了**稀疏混合专家**（`MoE`）架构，实现了极高的性价比。

    **模型规格与架构：**
    * **架构：** 稀疏混合专家（`MoE`）。
    * **参数量：** 总参数量 `230B`（2300亿），但单次推理**激活参数量仅 `10B`**（100亿）。
    * **Transformer 细节：** 62层网络，48个注意力头，采用 `GQA`（分组查询注意力，KV头为8），激活函数为 `SiLU`。
    * **思维模式：** 采用 `"interleaved thinking"`（交错思维）模式，模型输出会包含 `<think>...</think>` 标签来展示其内部推理过程，调用 API 时需保留此标签内容。

    **性能、价格与实测：**
    * **基准性能：** 官方数据显示，在 `SWE-bench`（代码修复）、`FinSearchComp-global`（金融检索）、`IFBench`（指令遵循）等基准上表现优异，部分指标（如 `Terminal-Bench`）超过 `Claude Sonnet 4.5`。
    * **价格与速度：** API 定价极具竞争力（输入 `¥2.1/百万 tokens`，输出 `¥8.4/百万 tokens`），宣称仅为 `Claude Sonnet` 价格的 **8%**，速度快 **2 倍**。
    * **API：** 原生兼容 `OpenAI` 与 `Anthropic` 风格 API，并提供限时免费试用（截至 `2025-11-07`）。
    * **社区实测：**
        * **优点：** 在简单 Agent 任务（如创意动画）和部分 `three.js` 编程测试中表现“惊艳”、“审美在线”，速度快。
        * **缺点：** 复杂 Agent 任务（Pro 模式）被指“非常非常慢”；且有用户反馈在特定编程任务上不如 `GLM-4.6` 或 `KimiV2`，存在稳定性问题（如中断或卡住）。
  modelSize: 230B (激活 10B)
  modelType: 代码, 语言
  openSource: true
  contextWindow: ""
  officialDoc: https://platform.minimaxi.com/docs/guides/text-ai-coding-tools
  evaluation: |-
    还是很强的，有些博主认为他的编程能力是强于Claude4的。sonnet 4.5 > MiniMax M2 ≈ Claude Opus 4.1 > Claude Sonnet 4.0

- date: "2025-10-20"
  title: "⭐DeepSeek-OCR"
  text: |-
    **摘要：** DeepSeek-AI 开源的 3B 级视觉语言模型（VLM），核心创新是 **上下文光学压缩**（Contexts Optical Compression）。它不只是做传统 OCR，而是探索将长篇幅的文本文档高效压缩为极少量的视觉 Token，再由 MoE 解码器高精度地重建文本，为解决 LLM 的长上下文难题提供了新思路。

    **模型规格与架构：**
    - **总参数量：** `3B`
    - **解码器：** `DeepSeek3B-MoE-A570M`，一个 3B 参数的 MoE 模型，激活参数量为 `570M`（激活 6/64 专家 + 2 个共享专家）。
    - **编码器（DeepEncoder）：** 核心特色，参数量 `380M`。
      - 结构：由 `SAM-base`（80M，窗口注意力感知局部特征）和 `CLIP-large`（300M，密集全局注意力提取语义）串联构成。
      - 压缩：在两者之间使用 2 层卷积模块进行 `16x` 的 Token 下采样（例如将 `4096` 个 patch Token 压缩为 `256` 个）。

    **性能与实测表现：**
    - **压缩能力：** 在 10 倍压缩比（文本Token/视觉Token）下，解码精度高达 `97%`；在 20 倍压缩比下，仍保持约 `60%` 的准确率。
  modelSize: "3.38B (解码器 3B MoE, 激活 570M; 编码器 380M)"
  modelType: "文档解析模型, 多模态"
  openSource: true
  officialDoc: "https://github.com/deepseek-ai/DeepSeek-OCR"

- date: "2025-10-16"
  title: "⭐PaddleOCR-VL"
  text: |-
    **摘要：** 飞桨（PaddlePaddle）于 2025-10-16 发布全新文档智能解析模型 **PaddleOCR-VL**，以轻量架构实现高精度与高效率并存，标志文档理解迈入“多元素、多语言、一体化”新时代。

    **模型规格与架构：**
    - 参数量仅 `0.9B`，采用 **NaViT 风格动态高分辨率视觉编码器** 与 `ERNIE-4.5-0.3B` 语言模型深度融合。
    - 异构设计摒弃单纯堆叠参数规模的路径，实现小模型大能力。
    - 动态视觉模块可自适应不同尺寸与质量的文档图像，兼顾精度与计算效率。

    **性能与实测表现：**
    - 在多项权威基准（如 OmniDocBench、OmniBenchDoc v1.5）中取得 **SOTA（业界领先）** 结果。
    - 在全页版面分析与细粒度元素识别（文本、表格、公式、图表、手写体）任务中表现优异。
    - 支持 **109 种语言**，覆盖中、英、日、韩及多语种文档场景。
    - 推理速度显著提升，资源消耗降低，可在中低端 GPU 上高效运行。

    **优势：**
    - 轻量级、可部署：仅 0.9B 参数，推理速度快、成本低。
    - 通用性强：多元素、多语言统一解析。
    - 产业化友好：适配金融、教育、法律、物流等多场景智能文档处理。

    **劣势：**
    - 目前尚不支持 CPU/Arm 平台；仍需 GPU 环境。
    - 对极端分辨率或严重噪声图像可能仍需前处理优化。

    **适用场景 / 备注：**
    - 文档结构化解析（PDF/扫描件转 JSON/Markdown）
    - 表格与公式抽取、票据与合同智能识别
    - 多语言文档自动化理解与归档
  modelSize: "0.9B (视觉-语言一体模型)"
  modelType: "文档解析模型、多模态"
  openSource: true
  contextWindow: ""
  officialDoc: "https://opencsg.com/models/d8638d6a/PaddleOCR-VL"

- date: "2025-10-15"
  title: "Qwen3-VL"
  text: |-
    **摘要：** 阿里巴巴通义千问团队于 2025 年 10 月正式推出 `Qwen3-VL` 系列多模态模型，覆盖从轻量到旗舰的全尺寸梯度：`4B`、`8B`、`30B-A3B` 与 `235B-A22B`。该系列延续 Qwen3 架构的多模态融合能力，重点强化了图像、视频与文本的联合理解与生成，旨在提供兼具性能与可部署性的视觉语言模型。

    **模型规格与架构：**
    - 架构类型：`Dense` 与 `MoE` 并行发展；`4B`、`8B` 为密集架构，`A3B`、`A22B` 为 **稀疏混合专家 (MoE)** 架构。
    - 模态支持：支持图像、视频、文本三模态输入；具备端到端的视觉特征编码器与语言解码器协同优化机制。
    - 上下文长度：原生支持 `256K`，可扩展至百万级。
    - 推理范式：提供 `Instruct`（指令优化）与 `Thinking`（推理强化）两类版本，面向不同应用场景。
    - 参数规模：`4B`（40 亿）、`8B`（80 亿）、`A3B`（300 亿）、`A22B`（2350 亿）。

    **核心能力与性能表现：**
    - **多模态理解：** 显著提升了对图像和视频的时空信息整合能力，采用多层级视觉特征融合（DeepStack）结构，能处理复杂场景、OCR、表格与图表信息。
    - **文本生成与推理：** 在语言任务中延续 Qwen3 系列的逻辑一致性与长程记忆能力，结合视觉信息生成描述、摘要、结构化内容。
    - **代码与视觉生成：** `VL` 模型可实现视觉→代码生成（如网页克隆），在还原度与逻辑结构上表现优异，尤其 `A22B` 在实测中几乎可重建原网页。
    - **文档与视觉问答 (DocVQA)：** `8B` 在多模态问答上表现突出，超过早期 `A3B` 文本模型与 `Qwen2.5-VL 72B`。
    - **数学与逻辑推理：** `4B` 在数学计算与符号逻辑任务中出现“轻量反超”现象，推测因模型结构更稳定、梯度分布更集中。
    - **视觉稳健性：** `A22B` 具备最强 OCR 准确率与最完整视觉层级识别；`4B／8B` 在复杂 OCR 下可能出现重复输出。

    **实测与社区反馈（Kate 横评）：**
    - 在 `LM Studio` 环境中，`4B` 与 `8B` 可轻松本地运行（6-bit 量化）；`A3B` 速度最快，输出结构化、条理性强。
    - `A22B` 在 OCR、视觉识别与代码生成三项任务中领先所有版本。
    - 文档问答与图像理解中，`8B` 性价比最高；`4B` 在资源受限设备上依旧具备实用价值。
    
    **性能与实测表现：**
    - 综合表现：`A22B` 在 **OCR**、**视觉识别**、**视觉→代码生成** 上显著领先，网页克隆还原度最高。
    - 文档问答 `DocVQA`：`8B > 4B > A3B`，轻量多模态在该项上优势明显。
    - 数学题：出现 `4B > 8B` 的反直觉结果，提示小尺度模型在特定子任务上可能更稳。
    - 图像→结构化 `JSON`：`8B` 识别较完整；`A3B` 存误识别；`4B` 有漏检。
    - 复杂 `OCR` 稳定性：`4B／8B／A3B` 均出现重复输出循环的问题，提示小模型在鲁棒性上需加强。
    - 视觉→代码（页面克隆）：`A22B` 还原度最高，`8B` 次之，`A3B` 与原页面差距较大。
    - 图像理解（如 “Cope” 海报）：`A22B` 与同场对比的大模型表现理解更完整、更贴题；`8B` 偶有“过度阐释”。

    **优势／劣势：**
    - **优势：**
      - 多模态集成度高，图像与文本信息交互自然。
      - 长上下文支持与视觉推理性能兼具。
      - 覆盖端侧到云端的全参数带宽，部署灵活。
    - **劣势：**
      - 小模型在复杂视觉任务中仍不稳定。
      - 大模型推理成本高，对显存与算力要求极高。

    **适用场景／备注：**
    - 云端与科研：`A22B` 提供最高精度与稳健性。
    - 本地与快速应用：`A3B` 或 `8B` 是理想选择。
    - 边缘部署或轻量推理：`4B` 模型可用于多模态交互、教育、轻量智能体。
    - 整体而言，`Qwen3-VL` 实现了从端侧 AI 到大规模推理的闭环生态。

  modelSize: "4B, 8B, 30B (A3B), 235B (A22B)"
  modelType: "多模态、语言、代码"
  openSource: true
  contextWindow: "256K (可扩展至1M)"
  officialDoc: "https://huggingface.co/collections/Qwen/qwen3-vl-68d2a7c1b8a8afce4ebd2dbe"
  evaluation: |-
    大的更稳，小的更快。选型就像点菜——别贪心，按预算和口味来；A22B 顶饱，A3B 解馋，8B/4B 下饭😄。

- date: "2025-10-09"
  title: "Ling-1T"
  text: |-
    **摘要：** Ling-1T 是 Ling 2.0 系列的首款旗舰非思考模型，定位于高效思考与精确推理的平衡；在有限输出长度下冲击复杂推理基准，并强调代码与前端可视化的美学生成能力。

    **模型规格与架构：**
    - 参数量：`1T` 总参，`≈50B` 激活；`1/32` MoE 稀疏激活，含 `MTP` 层。
    - 上下文：`128K`。
    - 预训练：`20T+` 高质量与高推理浓度语料（推理相关占比大于`40%`）。
    - 训练范式：`Pre-train → Mid-train → Post-train`；`Mid-train` 注入高质量 CoT 进行推理预激活；`Post-train` 采用演进式思维链 `Evo-CoT`。
    - 强化学习：提出句子粒度策略优化 `LPO`，较 `GRPO/GSPO` 在稳定性与泛化上更优。
    - 数值与工程：全程 `FP8` 混合精度（与 `BF16` 的 Loss 偏差约`0.1%`）；路由均衡采用 `aux-loss-free` 与 `sigmoid scoring`；`QK Normalization`；异构细粒度 pipeline 带来端到端`40%+`加速；基于 `Ling Scaling Laws` 进行面向 `1e25–1e26 FLOPs` 的可扩展设计。
    - 其他：注意力 `GQA`，激活函数 `SwiGLU`。

    **性能与实测表现：**
    - 相比 `DeepSeek‑V3.1‑Terminus`、`Kimi‑K2‑Instruct‑0905`、`gpt‑5‑main`、`Gemini‑2.5‑Pro` 等旗舰模型，在代码生成、软件工程、竞赛与专业数学、逻辑推理等多项高难基准上展现领先或全面优势。
    - 在 `AIME25` 上拓展准确率与平均推理长度的帕累托前沿，体现高效思考与精准推理的平衡。
    - 在 `ArtifactsBench` 前端能力基准上位居开源榜首，具备高质量可视化与前端动效生成能力。

    **优势：**
    - 高效推理：在较短输出下保持高精度。
    - 工程优化：`FP8` 与异构 pipeline 等系统优化带来训练与推理加速。
    - 代码与前端：跨语义到界面的生成质量高，具备美学感知。

    **劣势：**
    - 仍基于 `GQA`，超长上下文与复杂推理的成本偏高；计划引入混合注意力以降算。
    - 智能体能力与指令一致性仍需持续强化。

    **适用场景／备注：**
    - 复杂推理、代码生成、前端可视化、教学演示、智能体工具调用等。
    - 开源与体验渠道包括 HuggingFace、ModelScope、GitHub；国内可用 Ling chat，海外可用 ZenMux。
  modelSize: "1T, 50B（激活）"
  modelType: "语言"
  openSource: true
  contextWindow: "128K"
  officialDoc: "https://github.com/inclusionAI/Ling-V2"


- date: "2025-10-09"
  title: "Seed-1.6-vision"
  text: |-
    **摘要：** 字节跳动豆包团队推出的多模态视觉大模型，主打“看得懂、能动手”。作为 Seed 系列的 1.6 版，它首次引入图像操作工具，让模型在视觉理解与推理上更接近人类思维。

    **模型规格与架构：**
    - 参数量：230B 总参数，约 23B 活跃参数。
    - 架构：多模态 Transformer，支持文字、图像及界面操作输入。
    - 模块：内置 `POINT`、`GROUNDING`、`ZOOM`、`ROTATE` 四类视觉工具。

    **性能与实测表现：**
    - 社区实测中，模型能精确识别车牌、放大局部、旋转与框选目标，识别准确率显著高于 GPT-5-Thinking。
    - 在几何绘图、图像逻辑推理中展现出多步思考能力，能生成十余张中间推理图。
    - 默认开启工具调用，提示语成本大幅降低。

    **优势：**
    - 图像理解结合交互式操作，具备“可视化思维链”。
    - 支持长上下文（256K），适合复杂视觉任务。
    - 成本较前代下降约 50%。

  modelType: "多模态、视觉"
  openSource: false
  contextWindow: "256K"
  officialDoc: "https://seed.bytedance.com/zh/seed1_6"


- date: "2025-09-30"
  title: "⭐智谱 GLM-4.6"
  text: |-
    **摘要：** 智谱 AI 在 2025 年国庆前夕发布新一代旗舰大模型 **GLM-4.6**，以开源姿态再度刷新国产模型上限，被视为全球开源 AI 领域的新 SOTA。

    **模型规格与架构：**
    - 参数量约 `355B`（激活参数 32B）。
    - 基于自研 Transformer 架构，优化长上下文与工具调用。
    - 上下文窗口由 128K 扩展至 **200K**，支持复杂智能体与代码任务。
    - 采用 **FP8+Int4 混合量化** 部署，兼容寒武纪与摩尔线程国产芯片。

    **性能与实测表现：**
    - 在 `AIME25`、`LCB v6`、`SWE-Bench Verified` 等八大权威基准上全面提升。
    - 代码生成对齐 `Claude Sonnet 4`，在 Claude Code 测试中实现“零修改运行”。
    - 平均 token 消耗比 GLM-4.5 降低 30%，API 成本为 Claude 的 1/7。
    - 展示出从游戏开发到 3D 物理仿真、自动化脚本与深度调研写作的全能能力。

    **优势：**
    - **代码实力爆表**、执行速度快、理解复杂任务思路清晰。
    - 与国产芯片深度适配，显著降低推理成本。
    - 开源、性价比高，是国产 AI 自主化的重要里程碑。

    **适用场景／备注：**
    - 适用于编程开发、科研分析、智能体任务、文案生成与全栈项目构建。
    - 可通过 z.ai、Hugging Face、ModelScope 等平台体验。

  modelSize: "355B (激活参数 32B)"
  modelType: "语言、代码、多模态"
  openSource: true
  contextWindow: "200K"
  officialDoc: "https://z.ai/blog/glm-4.6"
  evaluation: |-
    密集使用CC+GLM 4.6开发了一周，可以确定性能+价格+效果绝对是目前国产模型的最佳选择。
    在中国被Anthropic封锁的情况下，希望GLM 4.6成为中国版Claude的。


- date: "2025-09-29"
  title: "⭐DeepSeek-V3.2-Exp"
  text: |-
    **摘要：** DeepSeek-V3.2-Exp 是基于 V3.1-Terminus 的增量版本，推出了创新的 **DeepSeek 稀疏注意力机制（DSA）**，显著提升了长文本处理效率并降低了推理成本。

    **模型规格与架构：**
    - 参数量：未公开
    - 架构：Transformer，采用 DSA 技术，支持高达 128K 上下文。

    **性能与实测表现：**
    - 在 AIME 2025 基准测试中，得分提升至 89.3，较 V3.1 提高 0.9 分。
    - 在 Codeforces 2046 任务中，得分提升至 2121，较 V3.1 提高 75 分。

    **价格更新：**
    - **输入成本：**
      - 缓存命中：$0.07/百万 tokens
      - 缓存未命中：$0.56/百万 tokens
    - **输出成本：**
      - 缓存命中：$0.16/百万 tokens
      - 缓存未命中：$0.42/百万 tokens
    - 通过高缓存命中率的优化，整体推理成本可减少 75%。

    **优势：**
    - **计算效率高**，稀疏注意力机制显著降低计算复杂度。
    - **成本大幅降低**，输出价格降低 75%。

    **适用场景／备注：**
    - 适用于长文本处理、智能助手、编程辅助等多个领域。
    - 支持 TileLang 和 CUDA，加速框架优化。

  modelSize: ""
  modelType: "语言"
  openSource: true
  contextWindow: "128K"
  officialDoc: "https://huggingface.co/deepseek-ai/DeepSeek-V3.2-Exp"



- date: "2025-09-28"
  title: "⭐MinerU 2.5"
  text: |-
    **摘要：** 上海人工智能实验室发布新一代文档解析大模型 **MinerU 2.5**，以十亿级参数实现千亿级性能，在复杂文档解析领域媲美人类专家。

    **模型规格与架构：**
    - 参数量：1.2B
    - 架构：基于 `QwenVL2` 的多模态 Transformer，采用 675M 视觉编码器与 0.5B 语言解码器的解耦结构。
    - 双阶段解析流程：低分辨率布局分析 + 高分辨率内容识别。
    - 解析速度：在 RTX4090 上达 1.7 页/秒。

    **性能与实测表现：**
    - 在 `OmniDocBench`、`olmOCR-bench`、`Ocean-OCR` 等评测中全面超越 `Gemini 2.5 Pro`、`GPT-4o`、`Qwen 2.5 VL-72B` 等大模型。
    - 在文本、表格、公式及阅读顺序解析任务上均居首。
    - 精度媲美人工标注员，幻觉率极低。

    **优势：**
    - 小模型高性能，兼具高精度与高效率。
    - 支持复杂排版、旋转表格、无线表格及嵌套结构解析。
    - 可导出结构化 JSON/Markdown，便于二次处理。

    **适用场景／备注：**
    - 适用于 RAG 知识库构建、科研文献解析、财报与试卷抽取。
    - 已开源并适配国产算力平台，生态覆盖 HuggingFace、ModelScope、GitHub 与 MinerU 在线版。

  modelSize: "1.2B"
  modelType: "多模态、文档解析"
  openSource: true
  contextWindow: ""
  officialDoc: "https://arxiv.org/abs/2509.22186"
  evaluation: |-
    本人之前有幸负责MinerU（非模型版）的昇腾NPU适配工作，推动开源NPU版的发布。
    这次的模型实测下来比上一代的VL版本提升明显。


- date: "2025-09-24"
  title: "⭐通义千问 Qwen3-VL"
  text: |-
    ### 摘要
    阿里巴巴于2025年9月24日云栖大会期间发布的**开源旗舰视觉语言模型**。该模型以其卓越的视觉Agent能力、多模态推理和超长上下文处理能力著称，刷新了多项开源模型基准测试记录，并提供 `Instruct` 和 `Thinking` 两个版本以适应不同任务需求。

    ### 模型规格与架构
    * **开源型号**：`Qwen3-VL-235B-A22B`。
    * **架构范式**：基于 **稀疏混合专家**（`MoE`）架构，总参数量 `235B`，激活参数量 `22B`。
    * **关键技术更新**：
        * `Vision Encoder`：`patch_size` 从14扩大至16。
        * `Projector`：引入 `DeepStack` 技术，将视觉编码器 `8`、`16`、`24` 三个中间层的特征深度融合到语言模型中，增强细节捕捉。
        * `LLM Decoder`：采用 `Qwen3` 语言模型，并使用 `MRoPE-Interleave` 位置编码，优化长视频理解能力。

    ### 性能与实测表现
    * **基准性能**：
        * `Instruct` 版在多项视觉基准中超越 `Gemini 2.5 Pro`，尤其在 `Agent` (`OSWorld`) 和 `Coding` (`Design2Code`) 任务上表现出压倒性优势。
        * `Thinking` 版在多模态推理任务上达到 **SOTA** 水平，特别是在数学推理（如 `MathVision`）上得分显著高于 `Gemini 2.5 Pro`。
    * **社区实测（优势）**：
        * **表格与OCR**：表格识别能力依旧顶尖，能精准还原为HTML；手写体OCR识别准确。
        * **数据推理计算**：从图表中提取数据并进行计算的能力非常强大，优于多数开源模型。
        * **色彩与逻辑**：色彩识别（色盲图测试）能力大幅提升；图片事件逻辑排序能力强。
        * **数学解题**：成功解答复杂高考数学题，表现甚至优于纯文本模型。
        * **视觉Agent**：具备优秀的`Grounding`（定位）能力，使其能够胜任GUI操作等视觉代理任务。
    * **社区实测（劣势）**：
        * **网页复刻**：将截图还原为网页代码的效果较差，与榜单上的高分表现有出入。
        * **精细识别与计数**：在复杂场景下的目标对比、精确定位（如在网格中找特定对象）和计数任务上容易出错。
        * **世界知识**：存在知识盲点或偏差，如会将上海金茂大厦误认为上海中心大厦。
        * **复杂空间变换**：处理复杂的立体图形展开图等任务时能力不足。

    ### 适用场景 / 备注
    * `Instruct` 版本适用于需要直接、高效完成的视觉任务。
    * `Thinking` 版本适用于需要深度思考和逐步推理的复杂多模态问题，但社区实测发现有时会“过度思考”导致错误。
  modelSize: "235B (总计 235B, 激活 22B)"
  modelType: "多模态, 文档解析模型, 代码"
  openSource: true
  contextWindow: "256K (可扩展至1M)"
  officialDoc: "https://huggingface.co/collections/Qwen/qwen3-vl-68d2a7c1b8a8afce4ebd2dbe"
  evaluation: |-
    新晋开源VL模型之王！
    

- date: "2025-09-24"
  title: "通义千问 Qwen3Guard"
  text: |-
    **摘要：**
    通义千问团队推出的多语言AI**安全审核模型** `Qwen3Guard`，旨在为大模型应用提供强大的安全护栏，能够对用户输入和模型输出进行精准的安全风险检测与分类。

    **模型规格与架构：**
    - **基础模型：** 基于 `Qwen3` 模型构建，继承了其强大的语言理解能力。
    - **训练数据：** 在一个包含119万条安全标注的数据集上进行训练。
    - **模型规模：** 提供 `0.6B`、`4B`、`8B` 三种参数规模，以适应不同部署需求。
    - **核心变体：**
      - `Qwen3Guard-Gen`：生成式变体，用于对用户输入和模型输出进行**完整分类**，适合离线评估和数据集过滤。
      - `Qwen3Guard-Stream`：流式变体，可在模型生成过程中进行**Token级的实时安全检测**，延迟极低。

    **性能与实测表现：**
    - **多语言能力：** 支持 `119` 种语言和方言，确保了其在全球化应用中的稳健性。
    - **业界领先：** 在多项主流安全基准测试中表现出色，无论是在静态分类还是流式检测任务上均达到SOTA水平。
    - **分类体系：** 将内容分为**安全**、**具争议**、**不安全**三个严重等级，便于开发者根据场景制定不同的审核策略。

    **优势：**
    - **实时性强：** `Qwen3Guard-Stream` 实现了Token级的流式检测，能够在不影响生成效率的前提下提供即时保护。
    - **全面防护：** 同时覆盖用户输入和模型输出，形成端到端的安全闭环。
    - **部署灵活：** 提供多种模型大小和两种检测模式，满足多样化的业务场景需求。

    **适用场景 / 备注：**
    - 适用于需要内容审核的各类AI应用，如智能对话系统、内容生成平台等，以确保交互内容的合规性与安全性。
  modelSize: "0.6B, 4B, 8B"
  modelType: "其他, 安全审核"
  openSource: true
  contextWindow: ""



- date: "2025-09-24"
  title: "⭐通义千问 Qwen3-Max"
  text: |-
    **摘要：**
    阿里巴巴于2025年云栖大会发布的通义千问系列新一代旗舰模型，参数规模超过万亿，旨在与全球顶尖模型竞争。该模型分为`Instruct`（指令）和`Thinking`（推理）两大版本，在编码、数学推理和Agent能力上表现卓越。
    ![111](https://qianwen-res.oss-accelerate-overseas.aliyuncs.com/qwen3max-banner.png)
    **模型规格与架构：**
    - **参数规模**：总参数超过**万亿**（`>1T`）。
    - **预训练数据**：使用了高达`36T tokens`的数据量进行预训练。
    - **模型架构**：基于Qwen3系列的**混合专家**（`MoE`）架构，并通过`PAI-FlashMoE`提升了训练效率。
    - **上下文长度**：通过`ChunkFlow`策略，支持百万级（`1M`）上下文长度的高效训练。

    **性能与实测表现：**
    - **`Qwen3-Max-Instruct`（指令版）：**
      - **代码能力**：在`SWE-Bench Verified`测试中获得`69.6`分，位列全球第一梯队，展示了强大的真实世界问题解决能力。
      - **Agent能力**：在`Tau2 Bench`测试中得分`74.8`，超越了`Claude Opus4`和`DeepSeek V3.1`。
      - **综合表现**：其预览版在`Chatbot Arena`（大模型竞技场）中已位列全球第三。
    - **`Qwen3-Max-Thinking`（推理版）：**
      - **数学推理**：在`AIME 2025`和`HMMT`等国际权威数学评测中均斩获**满分**（`100`分），是国内首个取得此成就的模型。
