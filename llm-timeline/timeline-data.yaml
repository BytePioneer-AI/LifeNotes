- date: "2025-08-08"
  title: ⭐OpenAI GPT-5
  text: |-
    OpenAI于2025年8月8日正式发布其下一代旗舰模型GPT-5。该模型被定义为一个统一的集成系统，而非单一模型。

    **核心架构与模型系列：**
    GPT-5系统整合并重命名了多个先前的模型，形成了一个统一的家族。其核心是“快思考”的`main`系列和“慢思考”的`thinking`系列，由一个智能路由器根据任务需求自动调用。详细的模型继承关系如下：
    * `GPT-4o` -> `gpt-5-main`
    * `GPT-4o-mini` -> `gpt-5-main-mini`
    * `OpenAI o3` -> `gpt-5-thinking`
    * `OpenAI o4-mini` -> `gpt-5-thinking-mini`
    * `GPT-4.1-nano` -> `gpt-5-thinking-nano`
    * `OpenAI o3 Pro` -> `gpt-5-thinking-pro`

    此对应关系明确显示，`main`系列是GPT-4o的直接延续，而`thinking`系列则整合了之前独立的、推理能力更强的o3、o4等实验性模型分支。

    **性能与实测表现：**
    * **基准测试**: 在数学、编程、多模态等多个基准测试中全面领先，成为大模型盲测竞技场的新榜首。同时，模型效率也得到提升，在完成复杂任务时输出的Token减少了50-80%。
    * **减少幻觉与谄媚**: 大幅降低了事实性错误的发生率（`gpt-5-thinking`比o3少五倍以上），并减少了不必要的迎合，对话体验更像与真人交流。
    * **编程能力 (高度好评)**: 被评为“一骑绝尘”，尤其在前端UI/UX设计、生产级代码的精准修改和高上下文精度方面表现惊人。实测中能从一句话生成复杂的可视化效果、可玩游戏，并完成了其他顶级模型失败的编码任务。
    * **写作能力 (评价分裂)**: 受到部分用户，特别是重度写作者的批评，认为其文笔相较于已被移除的GPT-4.5有明显退步，风格变得蹩脚，指令遵循能力一般。

    **定价与API：**
    * **价格**: API定价极具竞争力，输入为$1.25/百万token，输出为$10/百万token，低于主要竞争对手。
    * **API升级**: API迎来了多项对开发者友好的新特性。
  modelSize: ""
  modelType: 多模态
  openSource: false
  contextWindow: 400K
  officialDoc: https://openai.com/gpt-5/
  evaluation: ""
- date: "2025-08-07"
  title: MinerU2
  text: |-
    上海人工智能实验室发布了全新架构的智能文档解析引擎MinerU2，基于 **“通专融合”** 技术路线，旨在将复杂文档（特别是科学文献）精准转化为高质量的“AI-Ready”数据。

    ### 模型规格与性能
    * **模型**: 端到端多模态文档解析大模型
    * **参数量**: **0.9B**
    * **性能**: 解析准确率较前代提升 **22%**，速度提升 **6倍**。性能比肩72B大模型，可在消费级显卡上运行。在同级别开源模型综合评分中位列第一。
    * **核心能力**: 除了高精度解析文本、布局、表格、公式外，新增了对化学分子式和化学反应的解析能力。

    ### 主要功能更新 (客户端/网页端)
    * **化学解析 (MinerU.Chem)**: 新增化学论文解析能力，可提取化合物结构和化学反应，并支持交互式预览和导出。
    * **多模式翻译**: 上线全文和划词翻译功能，支持GPT-4o-mini、DeepL、Google等多种翻译引擎。
    * **知识管理**: 新增收藏、批注、反馈功能，提升用户交互和知识沉淀效率。
    * **工作流集成**: 支持一键导出到Notion和Dify，并可为超长文档设置按页码范围解析。

    ### 生态与部署
    * 项目已在GitHub开源，并提供了桌面客户端、网页端、API及企业级服务等多种使用形态。
  modelSize: 0.9B
  modelType: 文档解析模型
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/opendatalab/MinerU
  evaluation:
    - 实测下来不及预期，在医疗检验单场景下测试，发现以下主要问题：
      - **版面理解能力不足**：出现将文本标题错误识别为图片的情况。
      - **表格解析准确率低**：表格内的数据提取错误率偏高。
- date: "2025-08-07"
  title: OpenAI GPT-OSS
  text: |-
    OpenAI于2025年8月初发布了其自GPT-2以来的首个“开放权重”(open-weight)模型系列——GPT-OSS，包含gpt-oss-120b和gpt-oss-20b两个模型，采用Apache 2.0许可。这意味着模型权重公开，但训练代码和数据集不公开。

    **模型规格与架构:**
    - **gpt-oss-120b**: 拥有117B总参数，采用混合专家（MoE）架构，每个token激活5.1B参数。官方称其性能接近闭源的o4-mini，可在单张80GB GPU上运行。
    - **gpt-oss-20b**: 拥有21B总参数，激活3.6B参数。性能接近o3-mini，可在16GB内存的消费级设备（笔记本、手机）上运行。
    两个模型均采用Transformer架构，支持128k上下文窗口，使用了类似GPT-3的交替稀疏注意力模式、分组多查询注意力（GQA），并开源了其o200k_harmony分词器。后训练流程（SFT、RL）与o4-mini相似，并支持高、中、低三种推理级别。

    **性能表现:**
    官方基准测试显示，GPT-OSS在工具调用（搜索、代码执行）、思维链推理和特定基准（如HealthBench）上表现强劲，部分指标甚至超越了GPT-4o和o1。
    然而，多方独立实测揭示了其优势与短板：
    - **优势**: 在结构化的数学和逻辑推理任务上表现非常出色，能够清晰地解决复杂的数学题。
    - **劣势**: 在更泛化的任务上表现不佳。尤其在代码生成方面，无法完成稍复杂的项目，表现“一言难尽”，远不如Qwen3等竞品；在需要整合多条信息的复杂推理题（如七个小矮人）上会出错或卡死；在创意性写作和角色扮演方面也同样逊色。
  modelSize: 120B (总计 117B, 激活 5.1B), 20B (总计 21B,激活 3.6B)
  modelType: 语言大模型
  openSource: true
  contextWindow: 128k
  officialDoc: https://huggingface.co/collections/openai/gpt-oss-68911959590a1634ba11c7a4
  evaluation: 官方数据惊艳，实测表现拉垮。擅长数学推理，但在编程和复杂通用任务上远不及预期，综合能力不如同级别的国产开源模型。
- date: "2024-08-06"
  title: 小红书 dots.vlm1
  text: |-
    **摘要：** 小红书发布的首个开源多模态大模型，核心是自研的1.2B `NaViT`视觉编码器和`DeepSeek V3`语言模型，在处理图表、文档等结构化图像方面表现出色。

    **模型规格与架构：**
    - **核心组件：**
      - **视觉编码器：** 自研 `NaViT` (1.2B参数)，从零开始训练，支持动态分辨率。
      - **语言模型：** `DeepSeek V3 MoE`
      - **连接器：** `MLP` 适配器
    - **上下文窗口：** `4K` (4096 tokens)

    **性能与实测表现：**
    - **基准评测：** 在 `MMMU`、`MathVision`、`OCR Reasoning` 等多个国际权威多模态评测集上表现优异，整体性能接近 `Gemini 1.5 Pro` 和 `Seed-VL 1.5` 等顶尖闭源模型。
    - **核心能力：** 特别擅长处理复杂的图表推理、STEM数学问题和长尾特定场景识别。

    **优势：**
    - **创新视觉编码器：** `NaViT` 编码器专为结构化图像优化，提升了模型对表格、图表、公式的理解能力。
    - **强大的推理能力：** 结合 `DeepSeek V3`，在多模态综合推理任务上展现出强大实力。
    - **完全开源：** 采用 `MIT` 许可证，对学术界和产业界友好，可商用。

    **适用场景：**
    - 通用视觉问答与对话
    - 复杂图表与文档内容理解
    - OCR与版面分析
    - STEM领域的多模态辅助
