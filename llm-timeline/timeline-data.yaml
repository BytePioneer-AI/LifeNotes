  officialDoc: "https://longcat.ai/"
  evaluation: |-
    期待LongCat持续更新

- date: "2025-09-22"
  title: "⭐DeepSeek-V3.1-Terminus"
  text: |-
    **摘要：** DeepSeek-V3.1-Terminus 是 DeepSeek-V3.1 的升级版本，于 2025 年 9 月 22 日发布，主要针对用户反馈优化语言一致性和 Agent 能力，保持原有模型实力同时提升输出稳定性。
    - 语言一致性：缓解了中英文混杂、偶发异常字符等情况；
    - Agent 能力：进一步优化了 Code Agent 与 Search Agent 的表现。![](img/image.png)
    **模型规格与架构：**
    - 参数量：405B（继承 V3.1 架构）
    - 架构/范式：混合推理模型，支持思考模式与非思考模式，FP8 训练优化
    - 上下文：128K
