  officialDoc: "https://ai.google.dev/"

- date: "2026-03-02"
  title: "通义千问 Qwen3.5 Dense"
  text: |-
    **摘要：** `Qwen3.5 Dense` 是通义千问 `Qwen3.5` 开放权重家族中的稠密模型梯度，覆盖从端侧到高性能单机部署的多个尺寸。该分支主打 **部署简单**、**全参数激活** 与 **多模态理解**，适合不想处理 `MoE` 路由复杂度的本地和企业场景。

    **模型规格与架构：**
    - 尺寸梯度：`0.8B`、`2B`、`4B`、`9B`、`27B`。
    - 架构类型：**稠密模型**（`Dense`），每次推理均激活全部参数，部署路径比 `MoE` 更直接。
    - 模态能力：官方模型集合标注为 `Image-Text-to-Text`，支持文本、图像等多模态输入理解。
    - 上下文长度：公开资料普遍标注为原生约 `262K` tokens，可通过 `YaRN` 扩展至约 `1M`。
    - 授权：官方 `Hugging Face` 集合提供开放权重，模型卡使用 `Apache-2.0` 授权口径。

    **性能与实测表现：**
    - `0.8B`、`2B`、`4B`、`9B` 主要面向端侧、轻量服务和低成本批处理；`27B` 则是稠密路线中的性能主力。
    - 与 `MoE` 分支相比，Dense 模型牺牲部分计算效率，换来更简单的推理栈、更稳定的硬件兼容性和更低的工程接入门槛。

    **优势：**
    - 尺寸梯度完整，覆盖手机、笔记本、单卡服务器和小型集群等不同部署形态。
    - 没有专家路由和多专家加载问题，量化、微调、推理服务化都更容易落地。

    **劣势 / 备注：**
    - 同等总参数下推理成本通常高于高稀疏 `MoE` 模型。
    - 如果目标是高并发低成本服务，`35B-A3B` 等 `MoE` 版本可能更划算。
  modelSize: "0.8B, 2B, 4B, 9B, 27B"
  modelType: "大语言模型 (LLM)、多模态、代码生成 (含 Vibe Coding 等)"
  openSource: true
  contextWindow: "262K (可扩展至1M)"
  officialDoc: "https://huggingface.co/collections/Qwen/qwen35"

- date: "2026-02-16"
  title: "⭐ 通义千问 Qwen3.5 MoE"
  text: |-
    **摘要：** `Qwen3.5 MoE` 是通义千问 `Qwen3.5` 家族中的高稀疏专家模型分支，覆盖 `35B-A3B`、`122B-A10B` 与旗舰 `397B-A17B`。这一分支强调 **稀疏混合专家**、**低激活参数** 与 **高性能长上下文**，面向更重的推理、编码和智能体任务。

    **模型规格与架构：**
    - `Qwen3.5-35B-A3B`：总参数 `35B`，单次激活约 `3B`。
    - `Qwen3.5-122B-A10B`：总参数 `122B`，单次激活约 `10B`。
    - `Qwen3.5-397B-A17B`：总参数 `397B`，单次激活约 `17B`，是该系列开放权重旗舰。
    - 架构类型：**稀疏混合专家**（`MoE`），通过只激活部分专家降低每 token 计算成本。
    - 上下文长度：原生约 `262K` tokens，可通过 `YaRN` 扩展至约 `1M`。

    **性能与实测表现：**
    - `35B-A3B` 是效率优先版本，适合在较低激活成本下获得强于小型稠密模型的综合能力。
    - `122B-A10B` 面向企业自部署和高质量推理服务，在成本和能力之间更均衡。
    - `397B-A17B` 作为旗舰版本，承担复杂推理、代码生成、长上下文理解和智能体任务的性能上限。

    **优势：**
    - 以较低激活参数获得大模型容量，适合高吞吐、长上下文和复杂任务服务。
    - `FP8` 权重降低了部署门槛，便于在现代推理框架中做显存和吞吐优化。

    **劣势 / 备注：**
    - `MoE` 需要加载总参数，显存占用不能只按激活参数估算。
    - 部署侧对推理框架、专家路由、量化格式和并行策略更挑剔，工程复杂度明显高于 Dense 分支。
  modelSize: "35B (总计 35B, 激活 3B), 122B (总计 122B, 激活 10B), 397B (总计 397B, 激活 17B)"
  modelType: "大语言模型 (LLM)、多模态、代码生成 (含 Vibe Coding 等)、智能体 (AI Agent)、稀疏混合专家 (MoE)"
  openSource: true
  contextWindow: "262K (可扩展至1M)"
  officialDoc: "https://huggingface.co/collections/Qwen/qwen35"

- date: "2026-02-19"
  title: "⭐ Google Gemini 3.1 Pro"
  text: |-
    **摘要：** Google 于 2026-02-19 发布了**Gemini 3.1 Pro**，该模型在推理能力、指令遵循以及计算能力上都有显著提升。

    **模型规格与架构：**
    - 参数量：120B, 20B
    - 架构：基于混合专家架构（MoE）
    - 支持多模态输入，处理高达 100 万 token 的数据

    **性能与实测表现：**
    - **推理能力**：在**ARC-AGI-2**测试中，Gemini 3.1 Pro以77.1%的得分超过了前代模型和竞争对手，特别是在抽象推理和归纳推理任务上展现了强大的能力。
    - **指令遵循**：相比于上一代，3.1 Pro在复杂指令的执行上更稳定，特别是在处理规则类题目时，比GPT-5.2更为出色。
    - **计算能力**：可以处理更复杂的数学和逻辑任务，达到三位小数的精度，弥补了此前计算能力的短板。

    **优势：**
    - 推理能力和指令遵循的稳定性大幅提升。
    - 计算能力达到了中学考试的精度标准，适合复杂任务。
    - 支持大规模多模态输入，适用于广泛的应用场景。

    **劣势：**
    - 在处理长链推理时，尽管Token消耗增加，性能提升并不显著，且稳定性稍有下降。
    - **幻觉问题**虽然有所改善，但仍存在较高的发生率，尤其在信息抽取和数据总结任务中。

    **适用场景 / 备注：**
    - 适用于需要强大推理能力和复杂计算的任务，如逻辑推理、数据分析、编程等。
  modelSize: "120B, 20B"
  modelType: "大语言模型 (LLM), 多模态"
  openSource: false
  contextWindow: "100K"
  officialDoc: ""
  evaluation: |-
    推理能力很强，但幻觉依旧高频出现。整体来说，适合复杂任务，但需要注意稳定性和成本。



- date: "2026-02-14"
  title: "字节 Seed-2.0-Code"
  text: |-
    **摘要：** Seed-2.0-Code 是字节跳动推出的专为编程任务优化的大型语言模型，基于 Seed 2.0 系列，主要提升了代码生成与开发工具的集成能力，特别适合前端开发、全栈工程师及复杂编程任务。

    **模型规格与架构：**
    - 参数量：120B, 20B
    - 专为编程优化，增强了长上下文和多模态任务处理能力。

    **性能与实测表现：**
    - 在多轮交互与 IDE 重启模拟的编程工程测试中，Seed-2.0-Code 显示出较强的自我修正能力，能够处理复杂的前端工程任务，如简化版剪映网页版的开发。
    - 在视频编辑和UI设计生成方面表现突出，能够根据设计稿生成高精度页面。

    **优势：**
    - 高度优化的代码生成与调试能力，适合工程开发工作流。
    - 良好的自我修正能力和逐步改进的 Bug 处理，使其在多轮开发任务中能够维持较低的错误率。

    **劣势：**
    - 在一些冷门技术栈（如 OpenGL）和后端开发中仍有短板，可能需要更多的交互和修正。
    - UI 审美和细节设计较为简洁，未必符合每个项目的需求。

    **适用场景 / 备注：**
    - 适用于前端工程、全栈开发以及视频编辑应用开发等。
    - 通过与 TRAE 工具链的集成，能够提升开发效率，减少手动编写代码的负担。

  modelSize: "120B, 20B"
  modelType: "大语言模型 (LLM), 代码生成"
  openSource: false
  contextWindow: "128K"
  officialDoc: ""

- date: "2026-02-13"
  title: "⭐字节 Doubao-Seed-2.0-pro"
  text: |-
    **摘要：** 字节跳动发布的 **Doubao-Seed-2.0-pro** 模型是一款旗舰级多模态大模型，拥有极强的推理和空间智能能力，并在复杂推理、长链任务等方面表现优异。它在国内外 AI 大模型竞争中占据了领先地位。

    **模型规格与架构：**
    - 参数量：120B
    - 支持多模态理解：文本、图像、视频等
    - 优化推理稳定性：在长时间推理任务中稳定工作

    **性能与实测表现：**
    - 在多个标准推理任务中，表现不逊色于 **Gemini 3 Pro** 等国际大牌模型。
    - 强化了 **空间智能**，解决了如地形迷宫、拼图等复杂问题。
    - **推理稳定性**：可在复杂任务中稳定工作，尤其是长链推理时的表现更为突出。
    - **多轮任务**：在多轮工况下，能稳定跟踪目标，虽然在后期稍有不及顶级竞品的地方。

    **优势：**
    - **空间推理能力**强大，解决复杂问题如迷宫、拼图等。
    - 在长时间的推理任务中具有极高的稳定性。
    - 支持多模态任务，能够处理复杂的文本、图像、视频等内容。

    **劣势：**
    - **上下文幻觉**问题仍未完全解决，长文本时容易丢失重要信息。
    - 在非推理模式下的稳定性和准确性相较于推理模式较差。

    **适用场景 / 备注：**
    - 适用于复杂推理、多模态任务处理和长时间推理的应用场景。
    - 在国内外顶级 AI 模型竞争中展现出较强的竞争力。

  modelSize: "120B"
  modelType: "大语言模型 (LLM), 多模态, 智能体 (AI Agent)"
  openSource: false
  contextWindow: "256K"
  officialDoc: ""

- date: "2026-02-12"
  title: "⭐智谱 GLM-5"
  text: |-
    **摘要：**  
    智谱在 2026 年 2 月 12 日发布的 GLM-5 代表了其在大语言模型领域的又一次突破。与 GLM-4.7 相比，GLM-5 在推理能力、编程能力和上下文处理上有显著提升，尽管其算力资源紧张和定价较高，仍在推动国产模型朝世界顶尖水平迈进。

    **模型规格与架构：**
    - 参数量：744B‑745B
    - 激活参数：40B‑44B（基于 MoE 架构）
    - 架构类型：混合专家模型（Mixture of Experts, MoE）
    - 上下文窗口：最大支持 200K tokens
    - 训练数据量：28.5T tokens
    - 训练硬件：华为昇腾芯片 + MindSpore

    **性能与实测表现：**
    - **推理能力：** GLM-5 在长文本处理和多信息提取方面有显著进步，尤其在面对复杂推理问题时，展现出比前代更高的得分率，尽管与全球顶尖模型仍有差距。
    - **编程能力：** 编程能力显著提升，特别是在复杂算法问题上，GLM-5 展现了接近世界第一梯队的表现，能够完成复杂任务的一遍过，并保证代码编译通过。
    - **字符处理：** 在字符处理能力上，GLM-5 对相对简单问题能稳定给出满分答案，但在复杂问题上仍表现出一定的差距，部分幻觉问题导致输出错误。

    **优势：**
    - **编程能力：** GLM-5 在编程领域的进步显著，能够更稳定地输出通过编译的代码，尤其在复杂问题的处理上接近顶尖水平。
    - **推理能力：** GLM-5 在长文本和复杂推理问题中展现了较好的能力，尤其在多步骤推理任务中，能够以较少的 Pass 解决问题。

    **劣势：**
    - **冗余输出：** 与 GLM-4.7 相比，GLM-5 在推理过程中有更多冗余输出，平均 Token 消耗较高，尤其是在输出阶段浪费大量 Token。
    - **过度思考：** 在某些复杂问题上，GLM-5 易陷入过度思考的模式，导致过于细碎的步骤拆解和过多的中间过程，浪费计算资源。

    **适用场景 / 备注：**
    - GLM-5 适用于高复杂度的编程任务和多步骤推理任务，尤其在工程级问题中表现突出。尽管资源紧张，但其在国内市场的表现足以与国际一流模型竞争。
  modelSize: "744B"
  modelType: "大语言模型 (LLM), 代码生成"
  openSource: true
  contextWindow: "200K"
  officialDoc: ""

- date: "2026-02-12"
  title: "⭐MiniMax M2.5"
  text: |-
    **摘要：**  
    稀宇于 2026 年 2 月 12 日发布的 MiniMax M2.5 是该系列的最新版本，相比 M2，M2.5 在多个技术层面取得了重要进展，特别是在编程能力和推理稳定性方面。M2.5 进一步优化了长链推理和解决了 M2.1 中的技术问题。

    **模型规格与架构：**
    - 参数量：230B (总计 230B, 激活 10B)
    - 架构：基于深度强化学习的多层神经网络，优化了长链推理与工具调用能力。

    **性能与实测表现：**
    - 编程任务：在 C 工程测试中，M2.5 成为第一个突破第 8 轮的国模，展现了强大的编程能力，尽管在一些复杂任务上仍需多轮推理。
    - 推理能力：推理链长，能有效维持上下文细节，但相比北美顶级模型，稳定性略逊一筹。

    **优势：**
    - 改进后的编程能力和稳定推理为日常任务提供了可靠支持。
    - 相较前代，算力优化显著，成本控制良好，日常使用中足够应对复杂场景。

    **劣势：**
    - 指令遵循的提升不大，偶尔出现丢失或篡改指令的情况，且在某些编程任务中依然无法满足所有需求。
    - 幻觉问题未得到显著改善，尤其是在数字计算和上下文理解中。

    **适用场景 / 备注：**
    - 适合开发者与技术团队在编程、自动化任务和生产力工具中应用。
    - 作为国模的代表之一，M2.5 仍在逐步填补与全球顶级模型的差距。

  modelSize: "230B"
  modelType: "大语言模型 (LLM), 代码生成"
  openSource: true
  contextWindow: "256K"
  officialDoc: ""
  evaluation: |-
    虽然与Sonnet等顶级模型仍有差距，但在日常开发任务中，M2.5已经表现得相当稳定，值得信赖。 还是得看具体场景！ 😅

- date: "2026-02-10"
  title: "Qwen-Image-2.0"
  text: |-
    **摘要：** Qwen-Image-2.0 是千问团队推出的图像生成模型，突出的特点是**强大的文字渲染能力**，支持中英文海报、幻灯片、复杂的艺术作品及古文渲染。

    **模型规格与架构：**
    - 参数量：7B
    - 支持 1K token 输入，图像输出高达 2K 分辨率
    - 更轻量化设计，提高生成效率

    **性能与实测表现：**
    - **文字渲染：** 在生成现代杂志内页、PPT信息图、菜谱等图像时，能够准确渲染文本，尤其在复杂排版和古文渲染方面表现优异。
    - **对比测试：** 与 Seedream 5.0 Preview 的对比中，Qwen-Image-2.0 在文字精确度和渲染效果上明显优于 Seedream，几乎无错别字和涂改痕迹。

    **优势：**
    - **文字渲染精度高**，能够在复杂场景中无误地渲染中文和英文文字。
    - 支持生成信息图、海报、漫画等场景，免费开放，适合日常创作。

    **劣势：**
    - 在某些场景下，生成的细节可能与提示词存在微小差距，尤其是在涉及特定样式时。

    **适用场景 / 备注：**
    - 非常适合需要高保真文字渲染的创作场景，如海报、幻灯片、漫画等。
  modelSize: "7B"
  modelType: "图像生成, 文本生成, 多模态"
  openSource: false
  contextWindow: ""
  officialDoc: "https://chat.qwen.ai/"

- date: "2026-02-05"
  title: "⭐ Claude Opus 4.6"
  text: |-
    **摘要：**  
    2026年2月5日，Anthropic发布了**Claude Opus 4.6**，进一步提升了大语言模型的能力，特别在编码、数据分析及多任务处理方面。此版本改进了复杂推理、字符处理及长上下文处理，进一步缩小与**GPT-5.2**之间的差距，并在Agent协作能力上表现出色。

    **模型规格与架构：**
    - 参数量：120B
    - 架构：多模态大语言模型，支持长上下文处理和多代理协作。

    **性能与实测表现：**
    - **字符处理能力：** 领先其他模型，在复杂文本解析和错误修正上表现突出。
    - **计算能力：** 改进了计算精度，尤其在复杂数值计算方面表现稳定。
    - **复杂推理：** 在解题效率上有显著提升，特别是在数独和类似问题上，已经能够稳定满分。
    - **数据洞察：** 在数据分析任务中，Claude Opus 4.6与GPT-5.2持平，但在Token消耗上较高。

    **优势：**
    - 长上下文支持，能够处理更大规模的数据。
    - 在编程与代码生成方面具有领先表现，适合技术开发团队。
    - Agent协作模式在复杂任务中具有较高效率。

    **劣势：**
    - 幻觉问题较为严重，特别是在长文本处理时容易出现疏漏。
    - 在需要多步骤推理的任务中，稳定性较低，容易失分。

    **适用场景 / 备注：**
    - 适用于编程、数据分析、长文档处理等任务。
    - 虽然在Token消耗上相对较高，但其在任务复杂性和Agent协作上的优势弥补了这一点。
  modelSize: "120B"
  modelType: "大语言模型 (LLM)、代码生成 (含 Vibe Coding 等)、智能体 (AI Agent)"
  openSource: false
  contextWindow: "1M"
  officialDoc: ""

- date: "2026-02-05"
  title: "⭐ OpenAI GPT‑5.3‑Codex"
  text: |-
    **摘要：**  
    2026年2月5日，OpenAI 正式发布了 **GPT‑5.3‑Codex**，这是一款深度融合 **通用推理能力** 与 **智能体编程能力（agentic coding）** 的旗舰级编程大语言模型。与前代相比，它不仅能生成高质量代码，还能执行复杂任务、保持长上下文连贯性，并支持实时交互与协作调试。 :contentReference[oaicite:0]{index=0}

    **模型规格与架构：**  
    - 参数量：120B（官方未公开具体参数细节，但继承 GPT‑5 系列主架构）。  
    - 架构/定位：结合 **GPT‑5.2‑Codex** 的前沿编码能力与 **GPT‑5.2** 的推理/专业知识能力，定位为 **智能体式编程大模型**。  
    - 上下文窗口：约 **400K Tokens**，支持处理超大规模代码库和复杂工作流。 :contentReference[oaicite:1]{index=1}

    **性能与实测表现：**  
    - 在 **Terminal‑Bench 2.0** 上达到约 **77.3%**，显著高于前代与竞争对手。  
    - 在 **OSWorld‑Verified**、**SWE‑Bench Pro** 等业界基准测试中表现优异，体现了其在终端操作、真实软件工程任务与跨语言编码任务上的卓越实力。  
    - 与前代相比，推理与执行速度提升约 **25%**，并能够在任务执行中实时交互和修正方向。 :contentReference[oaicite:2]{index=2}

    **优势：**  
    - 不仅是“代码生成器”，更像能执行端到端开发任务的 **Agent 智能体**，支持测试、调试、部署等多环节协同。  
    - 较大的上下文记忆与实时交互能力，使其在复杂项目管理和长流程任务中表现突出。  
    - Token 消耗更优化，使大型任务更具成本效益。 :contentReference[oaicite:3]{index=3}

    **劣势 / 风险：**  
    - 与通用 LLM 相比，更专注于编程与工程任务，对部分非工程通用场景效率提升有限。  
    - 尽管基准成绩优异，实际工程落地仍需考虑权限、安全策略和集成治理。 :contentReference[oaicite:4]{index=4}

    **适用场景 / 备注：**  
    - 软件工程全生命周期支持：自动化编码、审查、测试、调试与部署。  
    - 适合集成至 IDE、CLI、DevOps 工具链及自动化工作流中。  
    - 可用于实时协作开发、复杂业务逻辑实现以及大型项目管理。  
  modelSize: "120B"
  modelType: "大语言模型 (LLM)、代码生成 (含 Vibe Coding 等)、智能体 (AI Agent)"
  openSource: false
  contextWindow: "400K"
  officialDoc: "https://openai.com/zh-Hans-CN/index/introducing-gpt-5-3-codex/"

- date: "2026-02-04"
  title: "Qwen3-Coder-Next"
  text: |-
    **摘要：** 阿里巴巴 Qwen 团队于 2026 年 2 月发布的面向 **智能体 (Agentic Coding)** 优化的开源代码大模型。该模型基于 `Qwen3-80B-A3B` 底座，通过极高稀疏度的架构设计，在保持极低推理成本的同时，实现了可媲美顶级闭源模型的工程化编码能力。

    **模型规格与架构：**
    - **架构范式：** 采用高度稀疏的 **混合专家模型 (MoE)** 架构，结合了 **Gated DeltaNet** (线性注意力变体) 与 **Gated Attention** 的混合注意力机制，显著优化了长上下文处理效率。
    - **参数规模：** 总参数量 `80B`，但每个 Token 仅激活 `3B` 参数，这使得其推理速度相比传统同体量模型提升了近 10 倍。
    - **上下文支持：** 原生支持 `256K` tokens，通过技术手段最高可扩展至 `1M`，具备处理整个代码仓库 (Repo-level) 的能力。

    **性能与实测表现：**
    - **基准测试：** 在 `SWE-bench Verified` 上取得 `70.6%` 的高分。支持编程语言数量从前代的 92 种大幅提升至 `370` 种。
    - **实测体验：** 在 `Cline` 等智能体框架下表现稳健，其逻辑修复与 **自我修复 (Self-healing)** 能力优异，能够自主解决跨文件 Bug 或 `CORS` 跨域等工程问题。

    **优势：**
    - **推理效率极高：** `3B` 的激活参数量使其在本地部署时具备极高的响应速度，首字延迟极低。
    - **工程化适配：** 针对函数调用和 JSON 格式进行了深度优化，能够稳定驱动各类 AI 编程插件。

    **劣势：**
    - **显存门槛：** 尽管激活参数小，但由于总参数量达 `80B`，完全加载仍需约 `60GB` 以上的显存或统一内存。
    - **安全风险：** 较强的 Agent 自主权限在执行“文件清理”等敏感任务时，若无人工确认，可能存在误删风险。

    **适用场景 / 备注：**
    - 推荐作为本地 AI 编程助手的旗舰级替代方案。部署建议使用 `LM Studio` 或 `vLLM`，量化版本首选 `MLX 6bit`。
  modelSize: "80B (总计 80B, 激活 3B)"
  modelType: "代码生成 (含 Vibe Coding 等)、智能体 (AI Agent)"
  openSource: true
  contextWindow: "256K (可扩展至 1M)"
  officialDoc: "https://qwen.ai/blog?id=qwen3-coder-next"


- date: "2026-02-03"
  title: "MiniCPM-o 4.5"
  text: |-
    **摘要：** 面壁于 2026-03-02 发布了开源的 MiniCPM-o 4.5 模型，采用全双工全模态技术，主打端侧设备，支持视频、音频、文本流的实时处理。

    **模型规格与架构：**
    - 参数量：9B
    - 架构：全双工全模态
    - 支持视频、图像、语音、文本输入与文本、语音输出

    **性能与实测表现：**
    - 模型在视频理解、语音识别、文档解析等领域表现稳定，且在多个实际场景下无需等待用户明确指令即可主动交互。
    - 在同等硬件上，9B 模型的解码速度可达到 200 tokens/s，首响时间为 0.6 秒，显存占用仅 11GB。

    **优势：**
    - 较小的 9B 参数量实现全双工多模态流式处理，适合在端侧设备上运行。
    - 支持主动交互，在无需明确指令的情况下进行实时提醒与反馈。

    **适用场景 / 备注：**
    - 适合嵌入到智能手机、智能眼镜等端侧设备中，提供流畅的实时对话与提醒功能。

  modelSize: "9B"
  modelType: "全双工多模态模型、多模态智能体"
  openSource: true
  contextWindow: ""
  officialDoc: "https://huggingface.co/openbmb/MiniCPM-o-4_5"

- date: "2026-02-03"
  title: "智谱 AI GLM-OCR"
  text: |-
    **摘要：** 智谱 AI（Z.ai）于 2026 年 2 月初发布的轻量级、专业级开源 **文档解析模型**。该模型以仅 `0.9B` 的参数规模，在复杂文档理解、高精度公式识别及结构化表格提取方面展现了卓越性能。

    **模型规格与架构：**
    - 架构：基于 `GLM-V` 编码器-解码器架构构建，融合了 `CogViT` 视觉编码器与 `GLM-0.5B` 语言解码器。
    - 关键技术：引入 **多Token预测 (MTP)** 损失函数；版面分析环节集成了 `PP-DocLayout-V3` 技术。
    - 部署：支持 `vLLM`、`SGLang` 及 `Ollama`，可在 **消费级显卡** 甚至 **CPU** 上实现高并发运行。

    **性能与实测表现：**
    - 基准：在 `OmniDocBench V1.5` 文档解析基准测试中以 `94.62` 分登顶。
    - 实测：**长公式识别**（支持 `LaTeX`）与 **拍照复杂表格** 还原能力出色；在形近字识别上表现稳定。

    **优势：**
    - 极致轻量化，处理速度约 `1.86页/秒`，推理成本仅为传统方案的 1/10。
    - 极强的 **结构化输出** 能力，是 `RAG` 场景下数据清洗的理想工具。

    **劣势：**
    - 抗畸变能力较弱，处理 **严重扭曲** 或 **大幅度倾斜** 的文档时容易产生幻觉。
    - 面对极端生僻字时，识别准确率仍有提升空间。
  modelSize: "0.9B"
  modelType: "文档解析模型"
  openSource: true
  contextWindow: ""
  officialDoc: "https://huggingface.co/zai-org/GLM-OCR"


- date: "2026-02-02"
  title: "Step 3.5 Flash"
  text: |-
    **摘要：** Step 3.5 Flash 是由阶跃星辰（StepFun）于 2026-02-02 发布的大型语言模型，采用 **稀疏混合专家（MoE）架构**，并重点优化了 **智能体**（AI Agent）推理能力。模型支持超长上下文（最多 256K tokens）和高效的推理能力，适合在自动化任务和长链推理中使用。

    **模型规格与架构：**
    - 参数量：1960B（激活 110B）
    - 架构：稀疏混合专家（MoE），支持滑动窗口注意力与全注意力混合
    - 上下文长度：256K（支持超长上下文）

    **性能与实测表现：**
    - 推理速度：峰值约 350 tokens/s，常规约 100–300 tokens/s
    - 智能体任务表现：在多步骤推理、逻辑推理及工具调用等智能体任务上表现优秀

    **优势：**
    - **高效推理**：MoE 架构使得推理速度显著提高，适合高效处理长文本。
    - **长上下文支持**：支持最大 256K tokens 的超长上下文输入。
    - **智能体任务优化**：专为智能体任务设计，强化推理与规划能力。

    **适用场景 / 备注：**
    - 适合于长文本推理、自动化任务、智能体驱动的工作流。
    - 开源，支持本地部署。

  modelSize: "1960B (激活 110B)"
  modelType: "大语言模型 (LLM)"
  openSource: true
  contextWindow: "256K"
  officialDoc: ""

- date: "2026-01-31"
  title: "Qwen3-ASR"
  text: |-
    **摘要：** 阿里云通义千问团队于 2026 年 1 月底正式开源的新一代语音识别（ASR）模型家族，依托 `Qwen3-Omni` 底座强大的音频理解能力，在多语种、复杂声学环境及推理效率上表现极为出色。

    **模型规格与架构：**
    * **开源矩阵**：提供旗舰级 `Qwen3-ASR-1.7B`、主打极致效率的 `Qwen3-ASR-0.6B`，以及创新的非自回归（NAR）强制对齐模型 `Qwen3-ForcedAligner-0.6B`。
    * **全能多语种**：单模型实现 **All-in-one**，支持 52 种语言和方言的自动识别与转写（含 30 种语言、22 种汉语方言及多种英语口音）。

    **性能与实测表现：**
    * **SOTA 精度**：`1.7B` 旗舰版在开源 ASR 模型中达到 **SOTA**，准确率媲美最强闭源商业 API；时间戳精度超越主流端到端强制对齐模型。
    * **极致吞吐**：`0.6B` 版本在 128 并发下，吞吐量高达 `2000倍`（1秒处理2000秒音频），平均首字延迟（TTFT）低至 `92ms`。

    **优势：**
    * **架构统一**：单一模型同时满足 **流式 (Streaming)** 与 **离线 (Offline)** 推理需求，原生支持超长音频。
    * **高阶特性**：支持以 **上下文 Prompt** 引导输出定制化专有名词，并在极具挑战的 **歌声识别** 任务中表现优异。
    * **工程友好**：官方推理框架与 `vLLM` 深度集成，完美支持高效批量推理与异步部署。

    **适用场景 / 备注：**
    * 广泛适用于语音输入、实时字幕、长会议记录、客服质检及视频本地化。
    * 商业 API（千问3-ASR-Flash-Filetrans）额外支持最高 12 小时长音频及 **情绪识别与分析** 能力。开源版基于 Apache 2.0 协议发布。
  modelSize: "1.7B, 0.6B"
  modelType: "语音识别 (ASR), 音频理解, 多模态"
  openSource: true
  contextWindow: "最高支持12小时音频 (云端API)"
  officialDoc: ""

- date: "2026-01-29"
  title: "⭐百度 PaddleOCR-VL 1.5"
  text: |-
    **摘要：** 百度飞桨发布 `PaddleOCR-VL-1.5`，是一款专门针对复杂真实场景优化的 **多模态文档解析模型**。该版本凭借极小的参数量，在多个权威榜单中超越了巨量参数的闭源模型，被业界誉为 OCR 领域的“实战神机”。

    **模型规格与架构：**
    - 采用经典的三段式结构：**NaViT** 图像编码器 + **MLP** 映射器 + **ERNIE 4.5-0.3B** 文本解码器。
    - 参数量仅为 `0.9B`，极具端侧部署与推理成本优势。

    **性能与实测表现：**
    - **榜单数据：** 在 `OmniDocBench v1.5` 评测中以 `94.5%` 的精度位列全球第一，领先 `Gemini 3 Pro` 约 3 个百分点。
    - **复杂场景：** 针对扫描、倾斜、弯折、暗光、屏幕拍照五大挑战场景进行了深度专项优化，实测表现远超 `DeepSeek-OCR-2`。
    - **新增能力：** 支持 **多边形异型框定位**（解决曲面文档识别痛点）、**印章识别**、**跨页表格自动合并** 以及藏语、孟加拉语等多语种解析。

    **优势：**
    - 极高性价比：以不到 `1B` 的参数量实现 `SOTA` 级别的文档理解能力。
    - 工业级落地：完美适配手写体、复杂长公式、下划线/复选框等长尾业务场景。
    - 部署丝滑：支持 `FastDeploy` 加速，在 `A100` 上处理速度达 `1.43页/秒`。

    **适用场景 / 备注：**
    - 适用于大模型预训练数据的清洗与构造、企业级 RAG 系统中的复杂文档解析以及教育/政务自动化办公。
  modelSize: "0.9B"
  modelType: "文档解析模型, 多模态"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/PaddlePaddle/PaddleOCR"
  evaluation: |-
    0.9B 的参数量打出了 90B 的既视感！官方自称“小钢炮”真没吹牛，这让那些体量巨大的 VLM 脸往哪儿搁？只能说百度在 OCR 这一块的护城河还是稳得一批。

- date: "2026-01-29"
  title: "蚂蚁集团 LingBot-World"
  text: |-
    **摘要：** 蚂蚁集团旗下具身智能公司灵波科技深夜突袭开源的可交互 **世界模型** `LingBot-World`，支持实时演算与探索，被业界视为开源版的 `Genie 3`。

    **模型规格与架构：**
    * 参数量：约 `28B`（推理约 `14B`）。
    * 训练数据：融合真实视频、游戏录像与 `UE` 合成场景，实现了类似机器人领域的 **域随机化**，极大提升了非写实画风的泛化能力。
    * 家族版本：包含 `Base (Cam)`（相机位姿控制，已开源）、`Base (Act)`（动作指令控制，待开源）和 `Fast`（低延迟流式交互，待开源）三个版本。

    **性能与实测表现：**
    * **长时稳定：** 具备极其强悍的 **长时记忆**，支持长达 `10分钟` 的第一人称连续探索，建筑结构与遮挡关系保持稳定，彻底告别“鬼打墙”。
    * **实时交互：** `Fast` 版本交互延迟低于 `1s`，生成吞吐量可达 `16FPS`，支持通过 `WASD` 键盘指令实时控制生成世界的走向。
    * **动作代理：** 具备 **连续意图** 推演能力（按键自动补齐步伐与视差），内置 `AI` 玩家甚至能实现空间内的自主运动与避障（如遇到沙发自主掉头）。

    **优势：**
    * 从“预渲染视频生成”跨越到了“实时交互模拟器”，真正做到了“言出法随，指哪打哪”。
    * 极致的开源策略，直接将前沿的世界模型技术赋能给整个社区。

    **适用场景 / 备注：**
    * 为 **具身智能** 提供低成本、高保真的虚拟试错训练场。
    * 影视、游戏及下一代无边界互动娱乐的底层引擎。
  modelSize: "28B (推理 14B)"
  modelType: "视频生成, 世界模型"
  openSource: true
  contextWindow: "10分钟连续视频流"
  officialDoc: "https://technology.robbyant.com/lingbot-world"

- date: "2026-01-27"
  title: "⭐月之暗面 Kimi K2.5"
  text: |-
    **摘要：** 月之暗面于 2026年1月27日 正式发布并开源了新一代大模型 `Kimi K2.5`。这是一个集成了视觉理解、代码生成、逻辑推理和智能体调度的“All-in-one”全能型模型。

    **模型规格与架构：**
    * 参数规模：**1万亿（1 Trillion）** 参数的 **稀疏混合专家（MoE）** 基础模型。
    * 模态支持：原生支持 **多模态**，具备强大的视觉理解能力，能够直接解析最大 `100M` 的视频文件。
    * 架构创新：引入 **并行智能体强化学习 (PARL)** 训练出的 **智能体集群（Agent Swarm）** 功能，无需预定义即可现场调度最多 `100` 个 Agent 分身并行工作。

    **性能与实测表现：**
    * 基准测试：在极具挑战的 `HLE`（拿到 `50.2%`）和 `SWE-bench Verified`（拿到 `76.8%`）上取得当前开源最佳表现（`SOTA`），核心成绩比肩 `GPT-5.2 XHigh` 和 `Gemini 3.0 Pro` 等最强闭源模型。
    * 代码与视觉融合：具备“看图/看视频写代码”能力。能直接理解 UI 截图或操作录屏的动态效果，一键复刻前端代码，甚至通过 `Kimi Agent` 在云端虚拟机自动生成所需图片素材。
    * 推理与泛化：深度推理智力全面赶上 `GPT-5 Mini`；非推理模式下的直出代码可用性极高，且逐字符处理能力成为首个比肩海外顶级模型的国产代表。

    **优势：**
    * **降维打击的性价比**：在多项评测优于或持平顶级闭源模型的同时，运行成本仅为前者的几分之一。
    * **极致的工程化落地**：配套发布的开源编程助手 `Kimi Code` 可无缝集成至 `VSCode`、`Cursor` 等主流 IDE，实操性极强。

    **劣势：**
    * **幻觉控制有待提升**：在高标准的信息提取任务中稳定性不足，幻觉水平在世界头部梯队中处于中下。
    * **复杂项目逻辑天花板**：在处理庞大且复杂的项目 Bug（如核心底层逻辑修复）时，仍与海外最顶级模型存在一定差距。

    **适用场景 / 备注：**
    * 非常适合前端 UI 快速复刻、中小型项目开发、高密度办公文档自动化处理及构建复杂的端到端 Agent 应用。
  modelSize: "1T"
  modelType: "多模态, 代码, 语言"
  openSource: true
  contextWindow: ""
  officialDoc: "https://www.kimi.com/code"

- date: "2026-01-27"
  title: "DeepSeek-OCR 2"
  text: |-
    **摘要：** DeepSeek 发布的新一代开源 OCR 模型，核心在于将 **视觉编码器** 从传统的 `ViT` 架构进化为类 `LLM` 架构，通过引入 **因果流查询** 实现了视觉 Token 的语义重排。

    **模型规格与架构：**
    - **架构革新：** 引入 `DeepEncoder V2`，将原有的 `CLIP` 编码器替换为基于 `Qwen2-500M` 改造的 **Prefix LM** 结构。
    - **双流注意力机制：** 视觉 Token 采用双向注意力（全局建模），而可学习的查询 Token 采用 **因果注意力**。这种设计允许模型根据图像语义动态调整阅读顺序，打破了传统的栅格化扫描限制。
    - **解码器：** 沿用参数量为 `3B` 的 **MoE（混合专家模型）** 结构，推理时仅需激活约 `500M` 参数。

    **性能与实测表现：**
    - **高效压缩：** 仅需 `256` 到 `1120` 个视觉 Token 即可表征复杂页面，大幅降低了下游 `LLM` 的计算负担。
    - **基准测试：** 在 `OmniDocBench v1.5` 中综合得分达 `91.09%`；在实际生产中，在线识别和 PDF 处理的重复率分别降至 `4.17%` 和 `2.88%`。
    - **实测细节：** 在生僻字识别、竖版文字和机打文档上表现卓越，但在处理极度复杂的 **连笔手写体** 或 **表格物理结构提取** 时仍有提升空间。

    **优势 / 劣势：**
    - **优势：** 架构实现了视觉与语言的深度统一；对复杂排版（多栏、图文混排）的逻辑还原能力极强。
    - **劣势：** 视觉 Token 上限较低，处理报纸等超高密度文档时可能丢失细节。

    **适用场景：**
    - 自动化文档数字化流水线、高精度科研论文解析、作为全模态模型的前端视觉感知模块。
  modelSize: "3.5B (总计 3.5B, 激活 1B)"
  modelType: "文档解析模型, 多模态"
  openSource: true
  contextWindow: "8K"
  officialDoc: "https://github.com/deepseek-ai/DeepSeek-OCR-2"
  evaluation: |-
    实测下来还是没有之前的小红书got.ocr效果好。DeepSeek-OCR 2 创新性地使用小型语言模型（Qwen2-0.5B）作为视觉编码器，使其能像人一样理解文档结构并智能排序内容，再由大型语言模型生成结构化文本。但其激进的视觉 Token 压缩（256-1120 个 vs 传统 6000+）和智能排序机制可能导致小字体、边缘区域、页眉页脚等内容被遗漏或误判为次要信息而跳过。

- date: "2026-01-23"
  title: "Qwen3-Max-Thinking"
  text: |-
    **摘要：** 阿里巴巴发布的 Qwen3 系列旗舰级深度推理模型，标志着千问模型进入 **1T 参数** 时代，核心亮点在于全新的 **结构化思考** 模式与 **自适应工具调用** 机制。

    **模型规格与架构：**
    - 参数规模：总参数量超过 `1T`，预训练数据量突破 `36T Tokens`。
    - 推理机制：引入 **测试时扩展（Test-Time Scaling）** 技术，具备 **经验提取机制**，能从过往推理轮次中提炼洞见。
    - 交互创新：集成 **自适应工具调用**，模型在 `<think>` 过程中可自主决定是否触发 `联网搜索`、`记忆模块` 或 `Python解释器`。

    **性能与实测表现：**
    - 逻辑推理：在 **文本逻辑**（如老鹰飞翔悖论）和 **中文语境理解**（如坦克300、丁真梗）上表现极强。
    - 数学计算：得益于内置 `Python解释器`，大数运算与复杂几何题（如二面角余弦值）准确度极高。
    - 视觉理解：支持多模态输入，但在 `VL` 推理过程中部分计算步骤被隐藏，表现出“隐形计算”黑科技特性。

    **优势：**
    - 思考过程高度 **结构化**，逻辑链路比前代更清晰且简洁。
    - 强大的 **Agent能力**，支持 `Claude Code` 调用，适配 `Anthropic` 协议。

    **劣势：**
    - **代码生成** 仍有提升空间，在 `SVG` 绘图定位、`PPT` 布局排版等可视化任务中存在小瑕疵。

    **适用场景 / 备注：**
    - 适用于高难度数学证明、科研方案设计、复杂逻辑分析及自动化编程任务。
  modelSize: "1T+"
  modelType: "语言、代码、多模态、深度推理"
  openSource: false
  contextWindow: "256K (API版 82K)"
  officialDoc: "https://chat.qwen.ai"

- date: "2026-01-15"
  title: "⭐Alibaba Qwen3-TTS"
  text: |-
    **摘要：** 阿里巴巴通义千问团队推出的下一代开源语音合成模型系列。该模型在保持高保真音质的同时，实现了极低的端到端延迟，并引入了基于自然语言指令的音色设计与精细控制能力，被社区誉为“开源 TTS 天花板”。

    **模型规格与架构：**
    - 家族成员：包含 `1.7B` 和 `0.6B` 两种参数规格，共 5 个子模型（`Base`、`CustomVoice`、`VoiceDesign`）。
    - 核心技术：采用自研的 `Qwen3-TTS-Tokenizer-12Hz` 分词器与离散多码本 `LM` 架构。
    - 生成范式：基于创新的 **Dual-Track 混合流式生成架构**，支持单个字符输入后的首包即时输出。

    **性能与实测表现：**
    - 延迟指标：官方数据显示端到端合成延迟低至 `97ms`。
    - 语音质量：`UTMOS` 评分达到 `4.16`（满分 5），说话人相似度指标高达 `0.95`。
    - 多语言能力：支持中、英、日、韩、德、法等 **10 种语言**。

    **优势：**
    - **高度可控性**：支持通过自然语言描述（如“温暖、略带沙哑的年轻女声”）直接设计音色。
    - **极简克隆**：仅需 **3秒** 参考音频即可实现高质量音色克隆，且支持跨语种迁移。
    - **生态兼容**：提供 `vLLM` 的 Day-0 支持，兼容 `OpenAI API` 协议。

    **适用场景 / 备注：**
    - 适用于 AI 实时助手、角色扮演、播客配音及长文本阅读。
  modelSize: "1.7B, 0.6B"
  modelType: "语音合成、音频生成、TTS"
  openSource: true
  contextWindow: ""
  officialDoc: "https://qwen.ai/blog?id=qwen3tts-0115"
  evaluation: |-
    阿里这波是把“调教”语音的门槛直接踩碎了。3 秒钟就能复刻初恋的声音？别说了，我的 CPU 已经开始发烫了！🔥

- date: "2026-01-22"
  title: "⭐Microsoft VibeVoice-ASR"
  text: |-
    **摘要：** 微软推出的统一语音转文本模型，旨在通过单一前向传播完成转录、说话人分离与时间戳标注三大任务。该模型解决了传统 ASR 在处理超长音频时常见的语境断裂与说话人一致性丢失问题。

    **模型规格与架构：**
    - 基座模型：基于 `Qwen2.5-7B` 构建，总参数量约为 `9B`。
    - 音频处理：采用 `7.5Hz` 低帧率连续语音分词器，支持最高 `64K` token 的上下文窗口。
    - 部署支持：原生适配 `vLLM` 推理加速，支持 `MPS`（Metal Performance Shaders）加速。

    **性能与实测表现：**
    - 长音频能力：可直接输入并处理长达 `60分钟` 的连续音频，无需切片。
    - 识别精度：在 `LibriSpeech`、`WenetSpeech` 等权威数据集上表现优异，尤其在处理中英混合（Code-switching）及专业术语（如 `MoE`、`DeepSeek-OCR`）时准确率极高。
    - 功能特性：支持 **Prompt-based Context Injection**（热词功能），可通过输入特定专有名词引导识别过程。

    **优势：**
    - 能够完美保持长对话中的说话人一致性（Speaker Tracking）。
    - 开源协议友好（MIT），支持本地私有化部署以保障数据隐私。

    **适用场景：**
    - 会议记录整理、长篇播客转录、中英混合技术演讲识别。
  modelSize: "9B"
  modelType: "语音转文本、ASR"
  openSource: true
  contextWindow: "64K (约 60分钟音频)"
  officialDoc: "https://github.com/microsoft/VibeVoice"
  evaluation: |-
    转录、分角色、打时间戳“三合一”一把梭。

- date: "2026-01-20"
  title: "智谱 AI GLM-4.7-Flash"
  text: |-
    **摘要：** 智谱 AI 推出的最新一代轻量化旗舰模型，作为 `GLM-4` 系列的性能甜点位，旨在通过 **MoE 架构** 实现高速度与高智能的平衡，并向全行业开放 **免费 API** 调用。

    **模型规格与架构：**
    - **架构类型：** 稀疏混合专家模型（`MoE`）。
    - **参数细节：** 总参数量约为 `30B`，推理时每 token 仅激活 `3B` 参数，显著降低了计算开销。
    - **核心特性：** 引入了 **混合思考模型（Thinking Mode）**，支持在输出前进行隐式推理。

    **性能与实测表现：**
    - **编程能力：** 在 `SWE-bench Verified` 中表现出色，支持 **Agentic Coding**，能自主完成多文件协作与环境调试。
    - **数学逻辑：** `AIME 25` 得分达 `91.6`，在复杂理科问题上具备极强的竞争力。
    - **视觉生成：** 显著提升了从视觉稿到代码的转化精度，UI 代码生成的“即用率”高达 `91%`。

    **优势：**
    - 推理速度极快，在常规消费级显卡上可达 `60-100 tokens/s`。
    - API 完全免费，极大降低了开发者构建智能体（`AI Agent`）的门槛。

    **适用场景：**
    - 自动化编程辅助、复杂逻辑推理、实时对话系统以及高频次的工具调用（`Function Call`）场景。
  modelSize: "30B (激活 3B)"
  modelType: "语言、代码、多模态"
  openSource: true
  contextWindow: "128K (API支持扩展至 200K)"
  officialDoc: "https://bigmodel.cn/"

- date: "2026-01-15"
  title: "美团 LongCat-Flash-Thinking-2601"
  text: |-
    **摘要：**
    美团开源的 `LongCat-Flash-Thinking-2601` 是一款专注于深度推理与复杂智能体任务的大规模模型。它主打**重思考模式**（Heavy Thinking Mode），通过在推理阶段的并行算力扩展（Inference Time Scaling），极大提升了复杂任务的准确性与逻辑严密性。

    **模型规格与架构：**
    - **参数量**：总参数量 `560B`，推理时平均每 token 激活约 `27B`。
    - **架构设计**：基于**稀疏混合专家**（`MoE`）架构构建，并在结构中创新性地引入了**零计算专家**（Zero Computation Experts）。
    - **训练策略**：采用多领域并行强化学习（`RL`）再融合的策略，有效缓解了混合训练时不同领域数据的干扰。

    **核心亮点与实测表现：**
    - **重思考模式**：开启该模式后，模型会同时启动 `8` 个 `Thinker` 进行并行推理探索（广度扩展），随后在总结阶段进行交叉验证和迭代循环，以得出唯一可靠解。有效避免了单步思考陷入局部最优的问题。
    - **顶级 Agent 能力**：在智能体工具调用（Agentic Tool Use）和交互推理测试中刷新开源纪录。面对包含 `60` 多种工具的复杂依赖图谱时，能清晰梳理调用逻辑。
    - **抗噪鲁棒性**：在强化学习阶段采用**课程学习**，主动注入各种真实世界的“环境噪声”，大幅提升了模型在非理想条件下的稳健性。

    **优势：**
    - 逻辑严密，原生支持 `MCP` 复杂流，能无缝接入并平替 `Claude Code` 进行开发；通过多路径交叉验证极大降低了“幻觉”。

    **劣势：**
    - 多个 `Thinker` 并行导致整体输出节奏受最慢节点影响，响应变长，且极其消耗 `Token` 和算力。

    **备注：**
    - 官方预告了基于 `LongCat ZigZag Attention` 机制的分支版本，未来有望支持高达 `1M` 的超长上下文。
  modelSize: "560B (总计 560B, 激活 27B)"
  modelType: "语言, 代码"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/meituan-longcat/LongCat-Flash-Thinking-2601"

- date: "2026-01-14"
  title: "智谱 AI GLM-Image"
  text: |-
    **摘要：** 智谱 AI 于 2026-01-14 正式发布并开源的旗舰级图像生成模型。该模型是业内首个完全基于国产算力（华为昇腾 910）底座完成从数据预处理到大规模训练全流程的 SOTA 级多模态模型。

    **模型规格与架构：**
    - **架构范式：** 创新性地采用 `Autoregressive`（自回归）+ `Diffusion Decoder`（扩散解码器）的混合架构。
    - **参数规模：** 总体规模为 `16B`，其中包含一个基于 `GLM-4-9B` 的自回归生成器（负责理解指令与全局布局）和一个 `7B` 的 `DiT` 扩散解码器（负责像素级细节与文字渲染）。
    - **关键模块：** 引入 `Glyph Encoder` 专用文字编码器，解决图像生成中“字符崩坏”的长久难题。

    **性能与实测表现：**
    - **文字精度：** 在 `CVTG-2K` 测试中词准确率达到 `0.9116`，显著超越同期开源模型。
    - **长文本渲染：** 在 `LongText-Bench` 中文、英文测试中分别取得 `0.979` 和 `0.952` 的高分。
    - **认知布局：** 具备极强的空间感，能精准执行“在左侧放置...在右侧书写...”等复杂空间逻辑指令。

    **优势与备注：**
    - **优势：** 极高的中文文字书写准确率，构图具有“逻辑性”而非随机拼凑。
    - **技术意义：** 验证了在脱离 CUDA 环境下，利用国产 `MindSpore` 框架与昇腾芯片训练顶级多模态模型的可行性。
  modelSize: "16B (9B 自回归 + 7B 扩散)"
  modelType: "图像生成、多模态"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/THUDM/GLM-Image"

- date: "2026-01-14"
  title: "阶跃星辰 Step-Audio-R1.1（Realtime）"
  text: |-
    **摘要：** `Step-Audio-R1.1` 是阶跃星辰（`stepfun-ai`）开源的**原生音频推理**模型实时版本，主打**低延迟语音对话**与**强推理**并存，实现“**边说边想**”的交互体验。（官方仓库：https://github.com/stepfun-ai/Step-Audio-R1/）

    **模型规格与架构：**
    - 定位：`Realtime` 交互式口语对话（Interactive spoken dialogue），强调**实时响应**与**推理能力**的平衡。
    - 架构要点：基于**双脑架构**（`Dual-Brain Architecture`），拆分为：
      - **Formulation Brain：**负责高层推理与规划；
      - **Articulation Brain：**负责语音生成与输出；
      以此支持**Chain-of-Thought在发声期间进行**，降低首包与交互延迟。（官方仓库说明：https://github.com/stepfun-ai/Step-Audio-R1/）
    - 关键方法：强调**声学接地推理**（Acoustic-Grounded Reasoning），避免只基于转写文本进行“替身推理”，通过**迭代式自蒸馏**把推理锚定在音频表征上。（官方仓库说明：https://github.com/stepfun-ai/Step-Audio-R1/；技术报告：https://arxiv.org/abs/2511.15848）

    **性能与实测表现：**
    - 第三方榜单：在 `Artificial Analysis Speech Reasoning` 更新中，`Step-Audio-R1.1` 以`96.4%`准确率登顶（报道汇总： https://finance.sina.com.cn/tech/digi/2026-01-15/doc-inhhkmpr7632358.shtml ； https://news.qq.com/rain/a/20260115A067LQ00 ）。
    - 说明：该榜单关注**原生语音模型**在“直接处理音频并完成复杂逻辑推理”的能力（含准确率、首包延迟等维度），因此更贴近端到端音频推理场景。（同上报道）

    **优势：**
    - **实时性与智能度兼顾：**以**双脑架构**实现“低延迟不降智”。
    - **音频接地推理：**强调推理链与声学特征对齐，减少“只看文本”的偏差。

    **适用场景 / 备注： ** 
    - 适合：实时语音助手、语音Agent、语音问答与复杂音频理解（对话、环境声、音乐相关推理等）。
    - 开源节点：官方在`2026-01-14`宣布发布`Step-Audio-R1.1`的推理代码与模型权重（含 `HuggingFace`、`ModelScope` 分发入口）。（官方仓库 News 区：https://github.com/stepfun-ai/Step-Audio-R1/）
  modelSize: ""
  modelType: "语音、语音、多模态"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/stepfun-ai/Step-Audio-R1/"


- date: "2026-01-08"
  title: "Qwen3-VL-Embedding & Qwen3-VL-Reranker"
  text: |-
    **摘要：** `Qwen3-VL-Embedding` 与 `Qwen3-VL-Reranker` 是基于 `Qwen3-VL` 的**多模态检索**组件，面向**跨模态召回+精排**的两阶段检索流程：Embedding 负责高效召回，Reranker 负责高精度重排序。

    **模型规格与架构：**
    - 参数规模：`2B`、`8B`。
    - 输入模态：文本、图像、**文档截图/视觉文档**、视频、混合模态输入。
    - `Embedding`：**双塔架构**，将不同模态映射到统一向量空间，用于**相似度检索/召回**。
    - `Reranker`：**交叉编码（Cross-Encoder）**，对 query–doc 进行细粒度相关性建模，用于精排。
    - 训练特性：支持 **Matryoshka Representation Learning（俄罗斯套娃/可变维度嵌入）**；支持较长上下文输入。

    **性能与实测表现：**
    - 在多模态 Embedding 榜单（如 `MMEB-V2`）上取得**第一梯队/SOTA**表现。
    - 在**纯文本**基准上，相比同规模纯文本 `Qwen3-Embedding` 略有差距，但整体仍具备可用性。

    **优势：**
    - 原生多模态向量化，避免“图/视频→描述文本→Embedding”的**信息损失**。
    - 提供完整检索链路：`Embedding`（快）+`Reranker`（准），工程友好。

    **劣势：**
    - 最小规模为`2B`，推理与部署成本高于小参数纯文本向量模型。

    **适用场景 / 备注：**
    - 多模态 RAG、图文/视频跨模态搜索、UI/文档截图检索、召回后精排。
    - 实践建议：**纯文本用纯文本 Embedding，多模态用 VL Embedding，多路召回效果最佳**。
  modelSize: "2B, 8B"
  modelType: "多模态"
  openSource: true
  contextWindow: "32K"
  officialDoc: "https://github.com/QwenLM/Qwen3-VL-Embedding"


- date: "2025-12-30"
  title: "Tencent HY-MT1.5（腾讯混元翻译模型）"
  text: |-
    **摘要：** 腾讯混元开源的**机器翻译（MT）大模型**家族，提供 `HY-MT1.5-1.8B` 与 `HY-MT1.5-7B` 两个版本，覆盖**33语种互译**与**5种民汉/方言互译**，强调端侧离线与术语可控翻译能力，并延续混元翻译模型开源谱系（如 `Hunyuan-MT-7B`、`Hunyuan-MT-Chimera-7B`）。

    **模型规格与架构：**
    - 版本：`1.8B`（端侧/轻量）、`7B`（更高质量）。
    - 语言覆盖：**33语种互译**、**5种民汉/方言互译**。
    - 工程支持：提供多种推理/量化格式（如 `FP8`、`GPTQ-Int4`、`GGUF`）。

    **训练与方法（技术报告）：**
    - **预训练** + **SFT** + **On-policy蒸馏** + **RL** 的翻译优化训练流程。

    **性能与特性（官方口径）：**
    - 基准：`Flores200`、`WMT25` 等多语翻译评测。
    - 效果表现：
      - `HY-MT1.5-7B`：官方称为此前 **WMT25 多语翻译冠军模型**的升级版，在多语言方向上保持高分位，并针对“夹杂语言/解释性翻译”等问题做稳定性优化。
      - `HY-MT1.5-1.8B`：官方称在多组常用中外互译、英外互译方向上，能以小参数量取得接近更大模型的翻译质量，并在部分方向上超过一些同类开源模型与主流商用翻译API（具体以复现实验为准）。
    - 可用性能力：
      - **术语干预：** 支持指定术语/译法以提升行业一致性（如产品名、法律条款、医疗术语）。
      - **上下文翻译：** 支持更长上下文输入，降低长文翻译中指代/一致性错误。
      - **格式化翻译：** 更好保留表格、列表、代码块等结构，减少排版破坏。
    - 部署表现：`1.8B` 官方称量化后约 `1GB` 内存即可运行，面向手机等端侧设备支持**离线实时翻译**。

    **历史模型（开源谱系）：**
    - `Hunyuan-MT-7B`：混元早期开源的翻译主模型，面向多语翻译任务；官方称在 `WMT25` 多语方向表现领先。
    - `Hunyuan-MT-Chimera-7B`：面向更高质量输出的 **ensemble/融合** 翻译模型（推理成本更高），本次 `HY-MT1.5` 未见公开对应的 `Chimera` 新版本。

  modelSize: "1.8B, 7B"
  modelType: "语言"
  openSource: true
  contextWindow: ""
  officialDoc: "https://hunyuan.tencent.com/llm/zh"



- date: "2025-12-23"
  title: "⭐GLM-4.7"
  text: |-
    **摘要：** 智谱AI在港股IPO前夕发布的旗舰级开源模型，专注于 **编程（Coding）** 与 **长程任务规划**。该模型在多项基准测试中刷新了开源SOTA记录，号称在编程能力上超越了当时的闭源顶流（如 `GPT-5.1` 和 `Claude Sonnet 4.5`），并引入了独特的“思考”机制以增强推理稳定性。

    **模型规格与架构：**
    - 架构：基于 **稀疏混合专家（MoE）** 架构，保证了在庞大参数下的推理效率。
    - 参数量：总参数约 `358B`，推理激活参数约 `32B`。
    - 上下文：支持 `200K` 上下文输入，最大输出长度达 `128K`。

    **核心技术亮点：**
    - **思考模型升级：** 引入了 `Interleaved Thinking`（交错思考）、`Preserved Thinking`（保留思考）和 `Turn-level Thinking`（轮次级思考），允许模型在多轮对话中保留推理缓存，并按需控制思考深度。
    - **Vibe Coding：** 大幅提升了前端代码生成的审美能力，生成的网页、PPT和海报代码在布局与视觉上更加美观且结构清晰。
    - **Agent适配：** 针对 `Claude Code`、`Cline` 等主流AI编程工具进行了专门优化。

    **性能与实测表现：**
    - **编程能力：** 在 `SWE-bench Verified` 中得分 **73.8%**（创开源新高）；在 `AIME 25` 和 `HLE` 等基准中分数超越 `GPT-5.1`。
    - **工具调用：** 在 `τ²-Bench` 等工具调用评测中刷新开源记录，展现出强大的工具链管理能力。

    **优势：**
    - **性价比极高：** 开源免费可商用，API价格低廉（约$3/月订阅），且推理速度快（50+ tokens/s）。
    - **长程任务优化：** 独特的“保留思考”机制使其在处理复杂、多步骤的编程任务时不易丢失上下文。

    **适用场景：**
    - 辅助编程（IDE插件后端）、自动化运维脚本生成、复杂的前端UI原型设计、长程Agent任务规划。
  modelSize: "358B (激活 32B)"
  modelType: "代码、语言、多模态"
  openSource: true
  contextWindow: "200K (输出 128K)"
  officialDoc: "https://z.ai/blog/glm-4.7"
  evaluation: |-
      上市前的“秀肌肉”之作，国产双王之一

- date: "2025-12-23"
  title: ⭐MiniMax M2.1
  text: |-
    **摘要：** **MiniMax** 发布的新一代旗舰级 **Coding & Agent** 模型，核心定位是“为真实世界复杂任务而生”。该模型通过 **Interleaved Thinking**（交替思考）机制和对 **Vibe Coding**（氛围编程）的强化，旨在解决以往编程模型偏科 Python/前端的问题，大幅提升了后端架构、移动端原生开发及复杂指令遵循能力。

    **模型规格与架构：**
    - 参数量：230B (激活 10B)
    - 架构：基于 **MoE**（混合专家）架构，具备极高的推理效率（推理速度约 `GPT-4o` 的 2 倍）。
    - 核心机制：首个系统性引入 **Interleaved Thinking** 的开源系列，能在工具调用前后进行深度思考，处理复合指令约束。

    **性能与实测表现：**
    - **Multi-SWE-bench**：以 `10B` 激活参数获得 `49.4%` 的成绩，超越 `Claude Sonnet 4.5`，拿下全球 SOTA。
    - **VIBE Benchmark**：在 MiniMax 自研的覆盖 Web、仿真、移动端及后端的基准测试中得分 `88.6`，逼近 `Claude Opus 4.5`。
    - **SWE-bench Verified**：得分 `74%`，位列国产模型第一。

    **优势：**
    - **全栈覆盖**：显著增强了 `Rust`、`Java`、`C++`、`Golang` 等后端语言及原生 `Android` / `iOS` 开发能力。
    - **工具适配**：深度适配 `Cursor`（推荐 Plan 模式）、`Claude Code`、`Cline` 等 IDE 工具，支持 `Markdown` 文档驱动开发的模式。
    - **性价比**：价格仅为同级别模型的约 10%。

    **适用场景 / 备注：**
    - 适合用于全栈应用开发、存量代码库的重构（Refactor）与修复（Fix）、以及作为 Agent 数字员工处理办公流。
  modelSize: 230B (激活 10B)
  modelType: 代码, Agent, 语言
  openSource: true
  contextWindow: ""
  officialDoc: https://www.minimaxi.com/news/minimax-m21
  evaluation: |-
    上市前的“秀肌肉”之作，国产双王之一

- date: "2025-12"
  title: StepFun GELab-Zero-4B
  text: |-
    **摘要：** **阶跃星辰 (StepFun)** 于 2025 年 12 月推出的轻量级高性能 **GUI Agent** 模型。该模型基于 `Qwen3-VL-4B-Instruct` 微调，专为 **Android 设备** 的端侧自动化操作设计，旨在实现完全本地运行的智能手机操作助手。

    **模型规格与架构：**
    - **基础底座：** `Qwen3-VL-4B-Instruct`，具备极强的多模态视觉理解能力。
    - **核心机制：** **纯视觉操作 (Vision-based)**，像人类一样通过识别屏幕截图操作，无需应用提供专门 API 或 XML 视图树。
    - **部署方式：** 支持 **本地化部署**，适配消费级显卡及高端手机，兼顾低延迟与隐私安全。

    **性能与实测表现：**
    - **基准测试：** 在 `AndroidDaily` 静态基准测试中准确率达 `73.4%`，超越 `UI-TARS-1.5` (`47.0%`) 和 `GPT-4o` (`19.6%`)；在 `AndroidWorld` 端到端任务中成功率达 `75.86%`。
    - **能力：** 具备 **零样本泛化** 能力，可跨应用执行复杂长链路任务（如跨 APP 点咖啡、发消息）。

    **优势：**
    - **小而强：** `4B` 参数量在特定 GUI 场景下表现优异，意图理解与 UI 元素定位精准。
    - **隐私保护：** 数据不出本地，适合处理敏感信息。

    **劣势：**
    - **工程落地门槛：** 存在 **死循环** 风险（无法感知操作失败），环境配置复杂（Python 依赖地狱）。
    - **稳定性：** 面对动态界面或弹窗干扰时容易卡死。

    **适用场景 / 备注：**
    - 适用于 **RPA 自动化测试**、无障碍辅助及极客玩家的设备控制实验；提供了包含 ADB 管理、任务录制的工具集。
  modelSize: "4B"
  modelType: "多模态, Agent"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/stepfun-ai/gelab-zero"


- date: "2025-12-16"
  title: 通义万相 2.6 (Wanxiang 2.6)
  text: |-
    **摘要：** 阿里云于 2025-12-16 推出的旗舰级视频生成模型，核心定位转向 **专业影视制作**，被称为国内首个支持 **角色扮演** (`Role-Playing`) 的视频模型，功能丰富度对标甚至超越 `Sora 2`。

    **模型规格与架构：**
    - 生成能力：单次生成时长上限提升至 `15秒`，支持最高 `1080P` 分辨率与 `24fps` 帧率，画面质感接近电影级别。
    - 全能矩阵：涵盖 `文生视频`、`图生视频`、`人声生成视频`、`图像编辑` 及 `动作生成`。
    - 技术原理：集成了多模态联合建模，通过参考视频提取 **时序情绪**、**姿态** 及 **声学特征** (音色/语速)，实现全感官迁移。

    **性能与实测表现：**
    - **角色扮演**：用户上传参考视频后，模型能保持角色形象（Identity）高度一致，并复刻原角色的 **音色** 和 **语速**，实现“演你所想”。
    - **智能分镜**：首创 **导演级** 运镜控制，能将单段提示词转化为包含特写、全景切换的 **多镜头连贯叙事** 视频，解决了传统模型镜头单一的问题。
    - **音画同步**：支持声音驱动生成，确保人物口型、动作与声音精准匹配。

    **优势：**
    - **多镜头叙事** (`Smart Storyboarding`) 和 **角色/声音一致性** 直击 AI 短剧和广告制作的痛点。
    - 相比竞品，在指令遵循和复杂场景的光影逻辑（如赛博朋克霓虹反射）上表现出色。

    **劣势：**
    - 与前代 `Wan 2.1` 不同，本作目前为 **闭源** (`Closed Source`) 状态，仅支持网页端体验和 `阿里云百炼` API 调用。

    **适用场景 / 备注：**
    - 极适合 `影视分镜预览`、`低成本AI短剧`、`广告制作` 及 `虚拟人IP` 运营。
  modelSize: ""
  modelType: 视频生成
  openSource: false
  contextWindow: ""
  officialDoc: "https://wan.video"

- date: "2025-12-15"
  title: ⭐Google Gemini 2.5 TTS Series
  text: |-
    **摘要：** Google 在 Vertex AI 和 AI Studio 上推出了全新的 **Gemini 2.5** 文本转语音 (TTS) 模型系列预览版，包含追求极致拟真的 `Pro` 版本和主打性价比与低延迟的 `Flash` 版本，显著提升了语音合成的自然度和可控性。

    **模型规格与架构：**
    - **型号分级：**
      - `gemini-2.5-pro-preview-tts`：定位 **High Quality**，专为有声读物、播客等高保真场景设计，通过优化的 `DeepMind` 架构实现极致的拟真感。
      - `gemini-2.5-flash-preview-tts`：定位 **Low-Latency**，针对实时交互和大规模生成优化，平衡了价格与性能。
    - **核心特性：** 引入了 **多说话人 (Multi-Speaker)** 支持，并具备 **上下文感知配速 (Context-Aware Pacing)** 能力，模型能理解文本语境（如笑话或动作戏）自动调整停顿和语速。
    - **可控性：** 增强了 **风格控制 (Steerability)**，允许开发者通过自然语言 Prompt 精确指导语音的情感色彩（如“悲伤”、“讽刺”）和语调变化。

    **适用场景 / 备注：**
    - 适用于需要高度情感表达的长文本朗读（Pro）或需要即时响应的语音助手与游戏内语音（Flash）。
    - 支持超过 20 种语言，并解决了传统 TTS 机械朗读的痛点。
  modelSize: ""
  modelType: 语音, 多模态
  openSource: false
  contextWindow: "32K"
  officialDoc: "https://cloud.google.com/vertex-ai"

- date: "2025-12-14"
  title: Agentar-Scale-SQL
  text: |-
    **摘要：** 蚂蚁数科（Ant Digital）正式开源了霸榜全球权威 `BIRD-Bench` 榜单超两个月的 **Text-to-SQL** 技术框架，该系列模型通过系统化工程方法，在执行准确率和效率上均超越了 Google 与 Amazon 等国际巨头。

    **模型规格与架构：**
    - **核心模型**：`Agentar-Scale-SQL-Generation-32B`，基于 `32B` 参数量构建。
    - **技术架构**：采用 **编排式测试时扩展**（Orchestrated Test-Time Scaling）策略，包含三个核心维度：
      - **内部扩展**：利用 **强化学习 (RL)** 增强模型的内在推理能力。
      - **时序扩展**：模型具备 **自我反思** 能力，可对生成的 SQL 进行迭代修正。
      - **并行扩展**：通过 **锦标赛机制** 从多样化生成的 SQL 中筛选最优解。

    **性能与实测表现：**
    - **基准测试**：在 `BIRD-Bench` 上取得双料第一，执行准确率达 `81.67%`，执行效率达 `77%`。
    - **产业落地**：已在金融（宁波银行、上海银行）、交通（南京公交“小蓝鲸”智能体）、能源等领域深度应用；某头部城商行实测查询准确率超 `92%`，较传统方案提升超 3 倍。

    **适用场景 / 备注：**
    - 专为解决 `NL2SQL` 落地难题设计（模糊口语、行业知识注入、复杂库表结构），配套开源了 `Light Schema Engine` 和离线数据处理流水线。
  modelSize: "32B"
  modelType: Text-to-SQL
  openSource: true
  contextWindow: ""
  officialDoc: ""

- date: "2025-12-12"
  title: OpenAI GPT-5.2 Series
  text: |-
    **摘要：** OpenAI 在其十周年纪念日之际发布的重磅旗舰系列，包含 `Instant`、`Thinking` 和 `Pro` 三个版本。该系列在数学、代码及专业知识工作上全面刷新 SOTA，宣称是首个在 **GDPval** 指标上达到“人类专家水平”的模型。

    **模型规格与架构：**
    - **矩阵细分**：
      - `GPT-5.2 Instant`：低延迟、高吞吐，定位日常快速问答与翻译。
      - `GPT-5.2 Thinking`：支持 `xhigh` (Level 5) 推理强度，专攻复杂规划与长文档分析（`256K` 上下文）。
      - `GPT-5.2 Pro`：科研级攻坚模型，算力成本极高，专为解决最困难的数学与逻辑问题设计。
    - **知识库**：截止至 `2025年8月`。

    **性能与实测表现：**
    - **逻辑屠榜**：在 `AIME 2025` 数学竞赛中取得 **100%** 满分（对比 `Gemini 3 Pro` 的 95%）；`ARC-AGI-2` 抽象推理达到 `54.2%`。
    - **生产力落地**：`GDPval` 得分 `74.1%`，意味着在 70% 的专业任务中胜过或打平人类专家。
    - **办公自动化**：大幅增强了 **Excel** 数据建模与 **PPT** 自动生成排版能力。
    - **工程能力**：`SWE-bench Pro` 得分 `55.6%`，在 `Cursor` 等 IDE 中表现出极强的长链路规划能力（Plan Mode）。

    **优势：**
    - 纯逻辑、数学与硬核代码能力目前无出其右。
    - 幻觉率相比前代降低 `30%` 以上。
    - `Agent` 能力显著提升，在 `Tau2-bench` 上达到 `98.7%`。

    **劣势：**
    - `Pro` 版本 API 价格极其昂贵（输出端达 `$168/1M tokens`）。
    - 部分实测反馈其 **UI/前端审美** 虽有提升，但相比 `Claude Opus 4.5` 仍显“工业感”过重，缺乏艺术灵性。

    **适用场景 / 备注：**
    - 适合高难度算法竞赛、科研辅助、复杂代码重构及自动化办公流；对审美有极致要求的创意工作可考虑竞品。
  modelSize: ""
  modelType: 多模态, 语言, 代码, Agent
  openSource: false
  contextWindow: 256K
  officialDoc: https://openai.com/index/introducing-gpt-5-2/
    
- date: "2025-12-09"
  title: LLM360 K2-V2-Instruct
  text: |-
    **摘要：** 由 **LLM360** 团队发布的 **全流程开源（360-Open）** 旗舰模型。与仅公开权重的模型不同，K2-V2 完整公开了从 **训练代码**、**数据配比** 到 **中间检查点** 的所有细节，旨在成为学术界研究大模型训练过程（尤其是推理能力涌现）的最佳底座。

    **模型规格与架构：**
    - 架构：基于标准的 `Decoder-only Transformer`，参数量为 `70B`（稠密模型），包含 80 层，隐藏层维度 8192。
    - 机制：采用 **分组查询注意力** (`GQA`) 和 `RoPE` 旋转位置编码，词表大小为 `32K`。
    - 训练：采用 **三阶段训练法**（Pre-training -> Mid-training -> Post-training），其中中间训练阶段专门用于注入领域知识并扩展上下文。

    **性能与实测表现：**
    - 长文本：通过 `TxT360-Midas` 数据集的中间训练，上下文窗口从预训练的 `8K` 成功扩展至 `500K`（`524,288 tokens`），在长文档理解上表现出色。
    - 推理能力：相比第一代 K2，V2 版本在 **数学** (`Math`) 和 **代码** (`Coding`) 任务上有显著提升，声称是同量级中最强的全透明开源模型。
    - 部署：官方支持 `vLLM` 推理加速，并提供了多种 `Chat Template` 配置以平衡推理效率与详细程度。

    **优势：**
    - **极度透明**：提供 `Apache 2.0` 协议，真正允许商业使用且完全可复现，是研究 Scaling Law 和训练动态的绝佳样本。
    - **长窗口**：原生支持超长上下文，适合长文档分析。

    **适用场景 / 备注：**
    - 适合学术研究、深度定制开发以及对数据隐私和模型透明度有极高要求的企业级应用。
  modelSize: "70B"
  modelType: "语言, 推理, 代码"
  openSource: true
  contextWindow: "524K (约 500K)"
  officialDoc: "https://arxiv.org/abs/2512.06201"

- date: "2025-12-08"
  title: LongCat-Image
  text: |-
    **摘要：** 美团 LongCat 团队开源的高性价比图像生成模型系列，包含文生图、微调开发版及图像编辑模型，主打 **中文文字渲染** 与 **指令遵循** 能力，旨在提供轻量化的本地部署方案。

    **模型规格与架构：**
    * **参数量**：`6B`，与近期开源的 `Z-Image` 处于同量级，适合消费级显卡部署。
    * **架构设计**：扩散模型部分沿用了 `FLUX.1-dev` 的 Transformer 架构（前几层双流注意力，后续单流注意力），但在文本编码器上进行了大胆创新，使用了多模态大模型 `Qwen2.5VL-7B`，显著增强了对提示词的理解能力。
    * **训练策略**：构建了 12 亿样本数据，涵盖合成数据以支持稀有概念和复杂的文本渲染（字体、排版）；包含 `LongCat-Image`（最终版）、`LongCat-Image-Dev`（微调版）和 `LongCat-Image-Edit`（编辑版）三个变体。

    **性能与实测表现：**
    * **文字渲染**：在中文汉字生成上表现惊艳，能够准确还原“狴犴”、“簋”等生僻字及复杂排版，优于许多同类开源模型。
    * **图像编辑**：`LongCat-Image-Edit` 模型展现了强大的多轮对话编辑能力，支持局部修改和物体替换。
    * **风格表现**：在肖像写真、宫崎骏风格漫画及复古海报等场景下，画面质感真实，光影处理细腻。

    **优势：**
    * **中文支持**：极强的中文语义理解和文字渲染能力。
    * **性价比**：`6B` 参数量兼顾了生成质量与推理成本，易于本地微调和部署。
    * **功能全面**：同时提供了专门的编辑模型，覆盖了从生成到修改的全流程。

    **适用场景 / 备注：**
    * 适用于电商海报生成、Logo 设计、需要精准文字的艺术创作以及资源受限的本地化 AI 应用开发。
  modelSize: 6B
  modelType: 图像生成、图像编辑
  openSource: true
  contextWindow: ""
  officialDoc: https://huggingface.co/meituan-longcat/LongCat-Image

- date: "2025-12-08"
  title: GLM-4.6V
  text: |-
    **摘要：** 智谱 AI 正式开源 `GLM-4.6V` 多模态大模型系列，包含旗舰版与轻量版，重点强化了 **原生工具调用** 与 **Agent** 能力，旨在解决复杂的视觉交互与长文档处理任务。

    **模型规格与架构：**
    - 版本：`GLM-4.6V` (106B, MoE架构, 激活 `12B`) 与 `GLM-4.6V-Flash` (9B, Dense架构)。
    - 上下文：支持 `128K` 超长视觉上下文，可直接处理长文档与视频。
    - 架构特点：引入 **原生多模态工具调用** (Native Multimodal Function Calling)，支持在推理链中直接处理视觉输入输出。

    **性能与实测表现：**
    - 工具能力：打通了视觉理解与外部工具（如搜索、绘图、代码执行），支持 **图文混排创作** 与 **视觉导购**。
    - 视觉任务：在 **前端复刻** (UI-to-Code) 与 **结构化OCR** (提取印章/表格为 `JSON`/`YAML`) 方面表现优异，部分场景优于 `Gemini 3 Pro`。
    - 视频理解：长视频分析速度快，能理解隐喻与细节。

    **优势：**
    - 强大的 **Agent化** 能力，能通过截图进行多轮交互修改代码。
    - 极高的 **性价比**，API 价格较前代大幅下降，且 `Flash` 版本适合端侧部署。

    **劣势：**
    - 基础视觉识别精度（如具体物种、数量统计、空间逻辑）相较于 `Qwen3-VL` 仍有提升空间。
    - 复杂光照下的 OCR 细节（如反光文字）处理尚不完美。

    **适用场景 / 备注：**
    - 非常适合作为后端引擎处理 **医疗单据OCR**、**自动化报表生成**、**网页代码复刻** 等生产力任务，可接入 `MCP` 生态。
  modelSize: "106B (激活 12B), 9B"
  modelType: 多模态, 语言, 代码
  openSource: true
  contextWindow: "128K"
  officialDoc: "https://github.com/zai-org/GLM-V"

- date: "2025-12-07"
  title: Doubao-Seedream-4.5
  text: |-
    **摘要：** 字节跳动（火山引擎）于 2025 年 12 月推出的旗舰级图像生成模型，专为**专业设计工作流**打造。该模型在主体一致性、多图融合及文字渲染能力上实现了重大突破，旨在解决 AI 绘图在商业落地中的痛点。

    **核心功能与特性：**
    - **极致一致性 (Subject Consistency)：** 解决了“换个角度脸就变”的难题，能最大化保留原图的人脸 ID、服装细节与光影色调，特别适合**连环画**、**故事绘本**及**游戏角色设计**。
    - **精准文字渲染：** 具备强大的**中英文**文字生成能力，即使是画面中的微小标签或手写体也能清晰呈现，大幅提升海报设计的可用性。
    - **多图融合与编辑：** 支持输入多张参考图（最多 8-14 张）进行复杂的组图生成，能精准提取不同素材的元素并自然融合；具备强大的`局部重绘`（如换装、背景替换）和`风格迁移`能力。
    - **电影级美学：** 优化了物理光影（体积光、边缘光）与材质纹理，原生支持 `2K` 至 `4K` 超高清分辨率输出。

    **性能与实测表现：**
    - **基准测试：** 在内部 `MagicBench` 评测中，其指令遵循、一致性和美学评分均大幅超越前代 `Seedream 4.0`。
    - **实测反馈：** 对长文本复杂指令的理解力极强；虽然在极端解剖结构（如手部细节）上仍偶有不稳定，但在构图灵活性（自动适配多种比例）和商业素材生成上表现优异。

    **适用场景：**
    - 电商营销图制作、专业平面设计（海报/传单）、IP 角色开发、分镜绘制。
  modelSize: ""
  modelType: 图像生成
  openSource: false
  contextWindow: ""
  officialDoc: "https://seed.bytedance.com/zh/seedream4_5"
  evaluation: |-
    跟🍌有差距，但在国产模型中比较好了

- date: "2025-12-06"
  title: NVIDIA Orchestrator-8B
  text: |-
    **摘要：** **NVIDIA** 与 **香港大学** 联合开源的 **8B** 参数模型，定位为“AI 代理系统的指挥官”。它不直接生成最终答案，而是作为 **智能调度中心**，将复杂任务拆解并分发给最合适的工具（如 `GPT-5`、`Qwen2.5-Math`、代码解释器等）协同完成。

    **模型规格与架构：**
    - 基础架构：基于 `Qwen3-8B` 微调，参数量仅 `8B`。
    - 训练方法：采用 **ToolOrchestra** 训练框架，结合强化学习（`GRPO` 算法）与 **ToolScale** 数据集。
    - 核心机制：引入多维度奖励机制（效果、效率、偏好），在保证任务成功率的同时优化成本与响应速度。

    **性能与实测表现：**
    - **HLE 基准测试：** 得分 `37.1%`，超越 `GPT-5` 的 `35.1%`。
    - **效率提升：** 相比单独使用 `GPT-5`，综合成本降低至 **40%**，运行速度提升 **2.5倍**。
    - **SOTA 表现：** 在 `FRAMES` 和 `τ²-Bench` 等测试中均刷新纪录。

    **优势：**
    - **极致性价比：** 用“小模型管理大模型”的策略，大幅降低昂贵 API 的调用成本。
    - **灵活部署：** 量化后可在消费级显卡（如 `RTX 3090`）上本地运行。
    - **隐私保护：** 可根据用户偏好优先路由至本地工具，而非云端大模型。

    **适用场景 / 备注：**
    - 适合作为 Agent 系统的 **Router** 或 **Controller**，用于构建复杂的企业级自动化工作流。
  modelSize: "8B"
  modelType: "语言, Agent, 辅助工具"
  openSource: true
  contextWindow: ""
  officialDoc: "https://research.nvidia.com/labs/lpr/ToolOrchestra/"
  evaluation: |-
    最近大厂开源的小参数模型比较少，一些独立机构、个人研究者者开源的小参数模型也可以多关注一下。

- date: "2025-12-01"
  title: ⭐DeepSeek-V3.2 Series
  text: |-
    **摘要：** DeepSeek 于 2025-12-01 推出的“推理优先”系列模型，包含平衡型 **Standard** 版与极致推理型 **Speciale** 版，以低成本和架构创新对标 `GPT-5` 与 `Gemini-3.0-Pro`。

    **模型规格与架构：**
    - 架构：基于 **MoE** 架构（总参数 `671B`，激活 `37B`），引入全新的 **DeepSeek Sparse Attention (DSA)** 稀疏注意力机制以降低长文计算复杂度。
    - 版本差异：
      - `DeepSeek-V3.2` (标准版)：支持 **Thinking in Tool-Use**，即在思考过程中调用工具，融合了强化学习（RL）训练。
      - `DeepSeek-V3.2-Speciale` (特化版)：纯推理模型，不支持工具调用，专注于数学证明与复杂逻辑。

    **性能与实测表现：**
    - 通用能力：标准版推理能力对标 `GPT-5`，Agent 工具调用能力在开源模型中处于领先地位。
    - 极限推理：特化版在 `IMO 2025`（国际数学奥赛）、`IOI 2025` 等竞赛中斩获金牌级成绩，数学能力媲美 `Gemini-3.0-Pro`。
    - 效率：平均输出长度较长（思考过程），但价格显著低于竞品 `Kimi K2 Thinking`。

    **优势：**
    - 极高的 **性价比**，API 价格低廉。
    - **泛化能力** 强，未针对特定工具刷榜但在 Agent 评测中表现优异。
    - `Speciale` 版本在数学与算法竞赛领域的“偏科”能力极强。

    **劣势：**
    - **指令遵循** 能力较弱（尤其是 Speciale 版），容易忽略格式要求。
    - 暂不支持多模态（如图片识别），上下文窗口限制在 `128K`。
    - 对非标准工具调用协议（如 `Cline`）兼容性不佳。

    **适用场景 / 备注：**
    - 适合需要 **复杂逻辑分析**、**数学证明** 或构建 **高性价比 Agent** 的场景；日常对话或简单指令需注意 Prompt 调优。
  modelSize: "671B (激活 37B)"
  modelType: "语言, 代码"
  openSource: true
  contextWindow: "128K"
  officialDoc: "https://modelscope.cn/models/deepseek-ai/DeepSeek-V3.2/resolve/master/assets/paper.pdf"


- date: "2025-11-26"
  title: Alibaba Z-Image (造相)
  text: |-
    **摘要：** 阿里通义实验室（Tongyi-MAI）推出的 **高效图像生成基础模型**，主打“以小博大”，仅用 `6B` 参数量即在生成质量和文本渲染上对标 `FLUX.2` (12B+) 等大模型。

    **模型规格与架构：**
    - 核心架构：采用 **S3-DiT**（可扩展单流扩散 Transformer），摒弃传统双流设计，将文本、视觉语义和图像 VAE token 统一流式处理。
    - 语言基座：内部集成 `Qwen-4B` 作为语言编码器，保障语义理解深度。
    - 模型版本：提供 `Turbo`（8步蒸馏）、`Base`（基础科研）和 `Edit`（指令编辑）三个版本。

    **性能与实测表现：**
    - 速度：`Z-Image-Turbo` 可实现 **亚秒级** 推理，大幅优于传统大模型。
    - 硬件兼容：对消费级显卡极度友好，支持在 `16GB VRAM`（如 `RTX 4060 Ti 16G` / `4080`）设备上流畅运行。
    - 能力特长：具备极强的 **中英文文本渲染** 能力，适合海报与 Logo 设计。

    **优势：**
    - **参数效率极高**，在保持照片级写实感的同时，显著降低了算力门槛。
    - 解决了大模型“生成慢、显存贵”的痛点。

    **适用场景 / 备注：**
    - 适合本地显存有限（12G-16G）的用户，以及需要进行海报设计、文字生成的商业场景。
  modelSize: "6B"
  modelType: "图像生成"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/Tongyi-MAI/Z-Image"

- date: "2025-11-11"
  title: Doubao-Seed-Code (豆包编程模型)
  text: |-
    **摘要：** 字节跳动火山引擎于2025年11月11日发布的**首款编程大模型**，专为**智能体编程**（`Agentic Coding`）任务深度优化。

    **价格：**
    **Coding Plan Lite：** 首月9.90，续费40。
    **Coding Plan Pro** 首月49.9，续费200。

    **模型规格与特性：**
    * **超长上下文：** 支持 `256K` 的原生超长上下文窗口，能处理大型复杂代码项目。
    * **视觉理解：** **国内首个支持视觉理解能力**的编程模型。
    * **生态兼容：** 兼容主流开发工具和 `Anthropic API`。
    * **工具集成：** 已接入字节跳动旗下的AI原生IDE `Trae` 的中国版。

    **性能表现：**
    * 在权威的编程基准测试 `SWE-Bench-Verified` 榜单上取得了 `78.8%` 的得分，达到了 `SOTA`（State-of-the-Art）水平。
    * 据报道，其性能优于 `DeepSeek-V3.1`、`Kimi-K2` 和 `GLM-4.6`，整体表现仅次于 `Claude Sonnet 4.5`。
  modelSize: ""
  modelType: 代码, 多模态
