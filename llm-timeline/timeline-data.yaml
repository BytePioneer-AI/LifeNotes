- date: "2025-08-05"
  title: Qwen-Image
  text: |-
    阿里千问团队发布的Qwen-Image是其首个图像生成基础模型，基于20B参数的MMDiT架构。该模型在文生图方面表现出色，尤其擅长中英文文本的精准渲染，能将文字与图像无缝融合。它支持通用图像编辑（如风格迁移、物体增删、姿态调整）、多种艺术风格生成，并能处理物体检测、语义分割等计算机视觉任务。Qwen-Image在多个公开基准测试中取得SOTA，是当前Artificial Analysis Image Arena上排名最高的开源模型。

    **MMDiT**，全称为**多模态扩散变换器（Multimodal Diffusion Transformer）**，是当前AI图像生成领域一项前沿的核心技术架构。它是一种专门设计用来处理和融合多种不同类型数据（即“模态”），如文本描述和图像信息的神经网络模型。

    这项技术是继“扩散模型（Diffusion Model）”和“视觉变换器（Vision Transformer, ViT）”之后的又一重要演进，通过其独特的结构，显著提升了AI模型根据复杂文字提示生成高质量、高相关性图像的能力。

    **核心思想：为不同信息类型设立“专属通道”**
    在传统的图像生成模型中，文本指令通常通过一个称为“交叉注意力（Cross-Attention）”的机制被注入到图像生成过程中。你可以把它想象成，在处理图像的同时，模型会时不时地“瞥一眼”文本指令来获取引导。

    MMDiT则采用了更为精妙的方法。它的核心创新在于：

    1. **分离处理**：MMDiT为文本信息和图像信息设立了两套独立的处理模块（或使用独立的权重）。这意味着文本和图像的特征（Tokens）在各自的“专属通道”中被分别处理，保留了各自模态的独特性和完整性。

    2. **联合注意力**：在经过初步的独立处理后，两条通道中的信息会被**拼接（concatenate）**在一起，送入一个统一的注意力模块中进行联合处理。这使得文本和图像信息能够在更深层次上进行交互和对齐，模型可以更精确地理解“宇航员”、“骑着猪”、“穿着芭蕾舞裙”等不同概念应该如何组合在同一画面中。

    简单来说，MMDiT架构就像一个拥有两个独立专业团队（一个文本专家团队，一个图像专家团队）的工作室。两个团队先分别消化自己的任务信息，然后在关键节点上进行高效的协同工作，共同完成最终的创作。
  modelSize: 20B (MMDiT)
  modelType: 图像生成、图像编辑
  openSource: true
  contextWindow: ""
  officialDoc: https://huggingface.co/Qwen/Qwen-Image
  evaluation: 左手“万相”拍视频，右手“千问”P图片，阿里这是要承包我的创意文件夹吗？
- date: "2025-08-04"
  title: 小米 MiDashengLM-7B
  text: |-
    **摘要：** 小米发布并开源的7B参数多模态声音理解大模型，在速度与精度上取得双重突破，刷新了22个公开评测集SOTA，旨在赋能其“人车家全生态”战略。

    **模型规格与架构：**
    - **参数量：** 7B
    - **架构/范式：** 采用双核设计，结合了小米自研的开源音频编码器`Xiaomi Dasheng`和`Qwen2.5-Omni-7B Thinker`作为自回归解码器。
    - **训练方法：** 采用创新的“通用音频描述”（general audio caption）训练策略，能够统一处理和理解语音、环境音、音乐等多种音频信号。

    **性能与实测表现：**
    - **基准：** 在22个公开评测集上刷新了多模态大模型的最佳成绩（SOTA）。
    - **效率：** 推理效率极高，单样本首Token延迟（TTFT）仅为同类先进模型的1/4，数据吞吐效率提升20倍以上。

    **适用场景 / 备注：**
    - 核心应用场景为小米的“人车家全生态”，如智能座舱、智能家居等。
  modelSize: 7B
  modelType: 多模态
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/xiaomi-research/dasheng-lm
- date: "2025-08-04"
  title: Hunyuan 腾讯混元小尺寸模型系列
  text: |-
    ### 核心发布：端侧开源小尺寸语言模型
    腾讯于2025年8月4日宣布，正式开源四款专为**端侧设备**设计的小尺寸语言模型，旨在推动AI在消费电子、智能汽车等领域的应用。
    同时​增强了Agent能力，在BFCL-v3、τ-Bench、C3-Bench等智能体基准测试中领先

    ### 模型规格
    该系列包含四个不同规模的模型，以满足不同场景的需求：
    * **0.5B (0.5B参数)**
    * **1.8B (1.8B参数)**
    * **4B (4B参数)**
    * **7B (7B参数)**

    ### 主要优势
    * **高效运行**: 能够在笔记本、手机、智能座舱等低功耗设备上高效部署。
    * **易于微调**: 支持在垂直领域进行低成本的定制化微调。

    ### 其他近期开源
    此次发布是腾讯近期密集开源动作的一部分，此前还开源了**混元3D世界模型1.0**（2025年7月）和**混元Hunyuan-A13B** MoE模型（2025年6月）。
