- date: "2026-03-16"
  title: "智谱 AI GLM-5-Turbo (龙虾模型)"
  text: |-
    **摘要：** 智谱 AI 推出的专为 `OpenClaw` 智能体场景深度优化的基座模型，代号 `Pony-Alpha-2`，被业界形象地称为“全球首个龙虾模型”。

    **核心能力专项优化：**
    - **Tool Calling：** 显著增强对外部工具与 `Skills` 的调用稳定性，解决长链路任务中途崩溃的痛点。
    - **Instruction Following：** 提升对复杂多层指令的拆解能力，支持更精准的步骤规划与多智能体协同。
    - **定时与持续性任务：** 深度优化时间维度理解，确保定时触发任务在后台能够持续、稳定执行。
    - **高吞吐执行：** 针对大数据量、长流程任务提升执行效率，适合处理复杂的办公及生产力场景。

    **性能与实测表现：**
    - **基准测试：** 在自研的龙虾场景端到端评测基准 `ZClawBench` 中取得国产模型第一。
    - **用户反馈：** 在 `AutoClaw` 盲测中，90% 的用户认为其表现优于其他国产模型；阿里、字节、美团等多家大厂测评团队在办公、编程及多 Agent 协同场景给予高度评价。

    **商业与安全方案：**
    - 推出“龙虾套餐”（个人版与 Team 版）以降低 `tokens` 成本。
    - 引入 `Claw for Enterprise Security` 企业级安全管理体系，支持权限编排、审计日志及敏感数据本地化处理。
  modelSize: ""
  modelType: "大语言模型 (LLM)、智能体 (AI Agent)、智能运维 (AI Ops)"
  openSource: false
  contextWindow: ""
  officialDoc: "https://bigmodel.cn/"

- date: "2026-03-11"
  title: "⭐ NVIDIA Nemotron 3 Super"
  text: |-
    **摘要：**
    英伟达于 2026-03-11 重磅发布的专为 **大规模 AI 智能体**（**Agent**）打造的开源巨兽，凭借其创新的 **混合架构** 与极高的吞吐量，直指多智能体协同场景中的性能与成本瓶颈。

    **模型规格与架构：**
    - 参数量：总参数 `120B`，推理时单次激活参数 `12B`。
    - **混合架构**：采用 `Mamba-2` 层与少量 `Transformer` 注意力层交替排列的 **Mamba-MoE** 设计，兼顾了线性时间复杂度与长距离高精度路由。
    - **隐式专家混合**：首次引入 `LatentMoE`，在较小的潜在维度中进行路由与计算。实现了用1个专家的算力成本激活4个专家，极致压榨了**参数利用率**。
    - **多 Token 预测**：内置 `MTP` 层，实现 **原生投机解码**，无需外挂草稿模型即可让推理速度狂飙 `3倍`，吞吐量暴涨 `5倍`。
    - 硬件适配：专为 `Blackwell` 架构设计，原生采用 `NVFP4` 精度进行预训练，显著降低显存带宽需求。

    **性能与实测表现：**
    - 训练数据：吃下 `25T` Token 的海量预训练数据，并在后训练阶段投入 `80B` Token 专注强化智能体能力（Agent 任务数据占比高达 `36%`）。
    - 综合基准：在专注评估 `OpenClaw` 智能体能力的 `Pinchbench` 测试中拿下 `85.6%` 的高分，性能直逼闭源顶流 `Claude 4.6 Opus` 和 `GPT-5.4`。
    - 核心能力：软件工程基准 `SWE-Bench` 得分高达 `60.47%`；在 `AIME25` 数学推理中跑出 `90.21%` 的顶尖成绩。

    **优势：**
    - 完美适配 `OpenClaw` 生态，凭借 `1M` 超长上下文能够将整个工作流（如庞大代码库或数千页研报）直接驻留内存，有效避免了长周期任务中的 **目标偏移** 问题。
    - 极大地降低了复杂智能体系统在每一步调用时产生的 **思考税**，使多 Agent 应用的商业化落地成为可能。

    **适用场景 / 备注：**
    - 适合深度的自动化代码生成、端到端漏洞修复、金融数据科学等重度多模态编排任务。
    - 官方同期规划了面向企业级市场的开源智能体平台 `NemoClaw`，提供开箱即用的安全与隐私编排组件。
  modelSize: "120B (总计 120B, 激活 12B)"
  modelType: "大语言模型 (LLM), 智能体 (AI Agent)"
  openSource: true
  contextWindow: "1M"
  officialDoc: "https://huggingface.co/collections/nvidia/nvidia-nemotron-v3"

- date: "2026-03-05"
  title: "⭐ OpenAI GPT-5.4"
  text: |-
    **摘要：** OpenAI 于 2026年3月5日 发布的最新旗舰推理模型，最大特点是将此前独立运营的 `Codex` 编程模型线与 `GPT` 通用推理线合并为单一系统，并首次原生支持 **电脑操控 (Computer Use)** 能力。

    **模型规格与架构：**
    * 架构融合：整合了 `GPT-5.2` 的通用推理能力与 `GPT-5.3-Codex` 的顶尖编程能力。
    * 部署场景：提供 `ChatGPT`（支持中途调整方向的 `Thinking` 形态）、`API`（支持原生桌面操控与 `1M` 上下文）以及 `Codex` 软件工程平台（新增最高1.5倍速的 `/fast` 模式）。

    **性能与实测表现：**
    * **电脑操控**：在 `OSWorld` 桌面操控测试中得分 `75.0%`，首次超越人类基准水平（`72.4%`）。
    * **逻辑与代码**：在 `SWE-Bench Pro` 中得分超越上代 Codex；在网页生成（UI/前端）领域表现断层领先。
    * **抽象推理**：`ARC-AGI-2` 从 52.9% 跃升至 `73.3%`，高难度任务下不退化，稳定性极强。
    * **Token 效率**：平均 Token 消耗压低至 `17K`；引入动态按需查询的 `Tool Search`，使工具调用 Token 消耗大幅下降。

    **优势：**
    * 具备强大的闭环工程能力，能结合 `MCP` 实现“计划->编写->测试->修正”的自动化应用构建。
    * 长程任务锚定极佳，是当前桌面级 **Agent** 的最强驱动力之一。

    **劣势：**
    * **成品意识薄弱**：生成网页、PDF 等最终交付物时，容易把内部的约束提示词或“内心OS”暴露在用户界面上。
    * **幻觉与短板**：长上下文（如 5K/10K）的信息抽取幻觉加剧；批判性思维不稳定，复杂场景的 OCR 与本土古典中文理解仍不及特定竞品。

    **适用场景 / 备注：**
    * 最适合复杂工程项目编排、代码与文档无缝配合、以及基于 GUI 的自动化任务替代场景。
  modelSize: ""
  modelType: 大语言模型 (LLM), 代码生成, 多模态, 智能体 (AI Agent)
  openSource: false
  contextWindow: 1M
  officialDoc: "https://openai.com/index/introducing-gpt-5-4/"
  evaluation: |-
    测试GPT-5.4 写代码能力比上一代 GPT-5.3-Codex有明显提升，且输出的文本更好理解好一点，但文本这方便和Claude、Gemini有较大差距。不适合做代码解释

- date: "2026-03-03"
  title: "Google Gemini 3.1 Flash-Lite"
  text: |-
    **摘要：** Google 于 2026 年 3 月发布的 **Gemini 3** 系列中最轻量、最高效的模型，旨在提供极致的响应速度与极低的推理成本，特别针对 **AI Agent** 规模化部署进行了优化。

    **模型规格与架构：**
    - **核心定位：** 极速多模态模型，支持文本、图像、音频、视频和 PDF 输入。
    - **推理模式：** 引入了 **思考等级（Thinking Levels）**，允许开发者在“极速响应”与“深度推理”之间通过滑块调节，其 **推理模式** 下 Token 消耗可达 `45K`。

    **性能与实测表现：**
    - **响应速度：** 非推理模式下平均速度超过 `200 tps`，首字响应时间（TTFT）低至 `5秒`，较前代提升显著。
    - **指令遵循：** 继承了 `Gemini 3` 系列强大的指令遵循基因，在简单、准确的任务中表现稳健，处于行业第一、二梯队水平。
    - **基准测试：** `GPQA Diamond` 达到 `86.9%`，`MMMU Pro` 达到 `76.8%`，整体表现略优于 `Gemini 2.5 Flash`。

    **优势 / 劣势：**
    - **优势：** 极具竞争力的价格（输入 `$0.25/1M`），在中等复杂度算法编写和初级计算（K12级别）上进步明显。
    - **劣势：** 存在一定的 **上下文幻觉**，处理超过 `10K` 的长文本信息提取时稳定性下降；**字符解析能力** 虽有形式但在实际逻辑上仍不成熟。

    **适用场景：**
    - 适合作为 **智能体（AI Agent）** 的路由引擎或初级处理器，处理高频、低延迟的搬运与清洗任务。
