- date: "2025-08-19"
  title: Alibaba Ovis 2.5
  text: |-
    **摘要：** 阿里巴巴发布的开源多模态大语言模型（MLLM），专为原生分辨率视觉感知和深度多模态推理而设计。其核心特点是采用了原生分辨率视觉变换器（NaViT）和可选的“思考模式”，在多个基准测试中达到了同规模模型的SOTA水平。

    **模型规格与架构：**
    - **参数量：** `9B`、`2B`
    - **架构/范式：** 沿用`Ovis`架构（视觉分词器VT、视觉嵌入表VET、LLM），但进行了两大升级：
      - **视觉编码器：** 升级为原生分辨率的`NaViT`（基于`siglip2-so400m-patch16-512`初始化），可处理任意分辨率和宽高比的图像，无需裁剪或切片。
      - **语言模型基座：** 升级为`Qwen3`，以增强深度推理能力。

    **性能与实测表现：**
    - **综合基准：** 在OpenCompass多模态排行榜上，`Ovis2.5-9B`平均分达78.3，在40B参数以下的开源MLLM中排名第一；`Ovis2.5-2B`得分为73.9，在同级别中表现优异。
    - **专项能力：** 在STEM推理（`MMMU`）、复杂图表分析（`ChartQA Pro`）、OCR（`OCRBench`）、视觉定位（`RefCOCO`）以及视频理解等多个领域均展示了顶尖或领先的性能。

    **优势：**
    - **原生分辨率感知：** 无需破坏性的图像切片，能最大限度保留图像的精细细节和全局结构，特别适合处理文档和图表。
    - **深度推理能力：** 可选的“思考模式”引入了反思和自我修正机制，允许模型在处理复杂问题时进行更深入的思考，以换取更高的准确性。
    - **高效训练：** 通过数据打包和混合并行框架等技术优化，实现了3至4倍的端到端训练速度提升。

    **适用场景/备注：**
    - 适用于对视觉细节要求高的场景，如复杂图表分析、科学文献理解、文档/表单OCR等。同时在需要严密逻辑推理的视觉问答任务中表现突出。

    **与Qwen-VL系列对比：**
    - **定位差异：** `Ovis 2.5`更像是“技术探索先锋”，专注于攻克原生分辨率处理、深度反思推理等前沿难题；`Qwen-VL`系列则定位为“通用多模态基石”，追求在广泛任务上的均衡与极致性能。
    - **视觉处理：** `Ovis 2.5`采用`NaViT`，可直接处理任意分辨率的原始图像，无损细节；`Qwen-VL`处理高清图则通常采用“切片（tiling）”策略。
    - **推理机制：** `Ovis 2.5`引入了独特的“思考模式”，进行显式的自我检查与修正；`Qwen-VL`具备强大的通用推理能力，但没有此种特定的反思机制。
    - **关系：** `Ovis`系列的技术探索成果未来可能会融入`Qwen`主系列，可以理解为“专才”与“全才”的关系。
  modelSize: 9B, 2B
  modelType: 多模态, 文档解析模型
  openSource: true
  contextWindow: ""
