- date: "2025-09-03"
  title: 快手 Keye-VL 1.5
  text: |-
    **摘要：** 快手（Kwai）开源的8B级多模态大模型，以其创新的`Slow-Fast`视频编码机制为核心，在短视频内容的深度理解方面表现尤为突出。

    **模型规格与架构：**
    - **参数量：** 8B
    - **视觉编码器：** 基于`SigLIP-400M-384-14`初始化，并采用2D-RoPE增强高分辨率图像理解。
    - **语言解码器：** 基于`Qwen3-8B`初始化。
    - **核心创新：** 采用了创新的`Slow-Fast`视频编码策略。该机制通过图像块相似度函数动态地区分处理视频帧：
      - **慢速路径 (Slow Path)：** 对快速变化的“关键帧”采用高分辨率、低帧率进行精细编码。
      - **快速路径 (Fast Path)：** 对相对静态的“背景帧”采用低分辨率、高帧率进行高效编码，从而在捕捉核心动态细节的同时显著优化了计算效率。

    **性能与实测表现：**
    - **基准表现：** 在多个主流多模态基准测试中取得了优异的性能。
    - **实测表现：** 根据社区评测，模型在视频理解方面表现强大，能精准定位事件发生的时间点，并能理解网络流行“梗”；在OCR、图表报告分析等任务中也表现良好。物体定位（Grounding）功能基本可用，但精度有时会稍有偏差。

    **优势：**
    - **短视频理解：** 核心优势领域，对动态细节和文化元素的捕捉能力强，被评价为“短视频老司机”。
    - **技术创新：** `Slow-Fast`编码机制为长视频或信息密集型视频的高效处理提供了新思路。

    **劣势：**
    - 受限于8B的参数规模，在通用世界知识、复杂空间逻辑推理和空间变换等方面的能力相对较弱。
  modelSize: 8B
  modelType: 多模态
  openSource: true
  contextWindow: 128K
  officialDoc: https://github.com/Kwai-Keye/Keye
- date: "2024-09-03"
  title: Microsoft VibeVoice
  text: |-
    **摘要：** 微软发布的开创性开源语音生成模型，能够生成长达90分钟、支持多达四位说话人的高质量、富有表现力的长篇对话音频，如播客和有声读物。

    **模型规格与架构：**
    - **参数量：** 提供 `1.5B` 和 `7B` (`VibeVoice-Large`) 两个版本。
    - **架构/范式：** 采用创新的 `LatentLM` 自回归扩散模型框架。其核心是一个文本大语言模型（如 `1.5B` 版本基于 `Qwen2.5-1.5B`），用于预测“声音代码”（Acoustic Tokens），而非直接生成波形。
    - **技术特点：**
      - 采用7.5Hz的超低帧率连续语音分词器，实现了高达3200倍的音频压缩率，使其能高效处理超长序列。
      - 能够捕捉呼吸、停顿等细节，并能根据文本提示词（如 `welcome`）触发背景音乐或生成清唱片段。

    **性能与实测表现：**
    - **基准评测：** 在人类偏好评估中，`7B` 版本在多个维度上优于 `Gemini 2.5 Preview` 和 `GPT-3` 等模型。
    - **主观评测：** 在真实感和丰富度（情感、音调变化）方面，得分显著高于 `Geny` 和 `11Labs` 等竞品。
    - **客观评测：** `1.5B` 版本在朗读准确性上表现优异，单词错误率（WER）低至1.11。
    - **实测反馈：** 英文语音克隆效果显著优于中文；模型的上下文感知和情感表达能力突出。

    **优势：**
    - 在超长音频（最长91分钟）生成方面取得技术突破。
    - 多角色对话合成能力强，能为每个角色保持高度一致的音色和说话风格。
    - 开源模型，便于社区研究与开发。

    **劣势：**
    - 目前仅支持英文和中文，中文效果有时不稳定。
    - 无法处理多人同时说话的重叠语音场景。
    - 背景音乐等氛围效果由关键词随机触发，无法精确控制。

    **适用场景 / 备注：**
    - 非常适用于自动化播客制作、有声读物创作、虚拟数字人对话系统等需要长篇、多角色、富有表现力语音的场景。
  modelSize: 7B, 1.5B
  modelType: 语音合成, 语言
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/microsoft/VibeVoice
- date: "2025-09-02"
  title: 腾讯混元 Hunyuan-MT-7B
  text: |-
    **摘要：** 腾讯开源的7B参数轻量级翻译大模型，在WMT25国际机器翻译比赛中斩获30个语言方向的第一名，实现了“小参数量，大能量”的技术突破，并配套开源了业界首个翻译集成模型 `Hunyuan-MT-Chimera-7B`。

    **模型规格与架构：**
    - **参数量：** 7B
    - **支持语言：** 支持33种语言互译，并对5种中国少数民族语言/方言（如藏语、维吾尔语等）进行了优化。
    - **训练范式：** 采用创新的“预训练 → 跨语言预训练(CPT) → 监督微调 → 翻译强化 → 集成强化”五阶段训练流程，通过跨语言对齐机制提升了低资源语言的翻译质量。
    - **配套模型：** 开源了业界首个翻译集成模型 `Hunyuan-MT-Chimera-7B`，可融合多个翻译模型（如 `Hunyuan-MT-7B`、`deepseek` 等）的结果，生成更优译文。

    **性能与实测表现：**
    - **竞赛基准：** 在WMT25国际机器翻译比赛中，获得了全部31个语种中的30个第一名，处于绝对领先地位。
    - **公开基准：** 在Flores200评测集上，BLEU评分平均达到42.3，表现优于同尺寸模型，且不逊于部分超大尺寸闭源模型。
    - **实测效果：** 在俚语、古诗词、网络缩写等复杂场景下表现出色，翻译结果兼顾“信达雅”。

    **优势：**
    - **轻量化高性能：** 以7B的较小参数量实现了与超大模型相媲美的性能，证明了精妙架构设计的有效性。
    - **计算效率高：** 推理速度快，通过腾讯自研的 `AngelSlim` 压缩工具进行FP8量化后，推理性能可进一步提升30%，能在消费级GPU上流畅运行。
    - **部署友好：** 对硬件要求低，部署、运行和维护成本相对更低，为中小企业降低了AI应用门槛。
    - **开源生态完善：** 模型、技术报告以及配套的压缩工具均已开源，方便社区开发者使用和二次创新。

    **适用场景 / 备注：**
    - 已在腾讯会议、企业微信、QQ浏览器等多个内部业务中落地。
    - `Hunyuan-MT-Chimera-7B` 集成模型特别适用于对准确性要求极高的专业领域，如法律、医疗文本翻译。
  modelSize: 7B
  modelType: 语言
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/Tencent-Hunyuan/Hunyuan-MT/
- date: "2025-08-31"
  title: 美团 LongCat-Flash-Chat
  text: |-
    **摘要：** 美团于2025年8月31日开源的混合专家（MoE）大语言模型，以其创新的动态计算架构为核心，实现了极高的推理速度（>100 tokens/s）和极具竞争力的成本（$0.7/百万输出token），标志着业界向更实用、高效模型发展的又一重要里程碑。

    **模型规格与架构：**
    - **参数量：** 总参数量为`560B`，根据上下文动态激活`18.6B`至`31.3B`（平均约`27B`）。
    - **架构/范式：** 采用创新的混合专家（MoE）架构，包含两大亮点：
      - **零计算专家 (Zero-computation Experts)：** 引入了256个不消耗算力的专家，让模型可以为简单的Token（如标点、连词）分配更少或零计算资源，实现按需计算。
      - **快捷连接MoE (Shortcut-connected MoE, ScMoE)：** 通过跨层快捷连接，将前一层的计算与当前MoE层的通信并行执行，极大地提升了训练和推理的系统吞吐量。
    - **上下文：** 训练时将上下文长度扩展至`128K`。

    **性能与实测表现：**
    - **基准：** 作为一个非思考型模型，其综合性能与 `DeepSeek-V3.1` 和 `Kimi-K2` 等领先模型相当，尤其在智能体（Agent）工具使用方面经过专门优化，表现出色。
    - **实测：**
      - **速度与成本：** 社区实测普遍证实其极快的响应速度和极低的首Token延迟，成本优势明显。
      - **强项：** 指令遵循效果良好，代码生成能力表现不俗。
      - **弱项：** 在需要深度背景知识的复杂推理任务上表现不佳（例如无法理解“但丁/丁真”的语言梗，或未能推理出“老鹰本身就会飞”），长数学题的解答过程可能被截断或末尾出错。

    **优势：**
    - **极致的性能效率：** 推理速度极快，延迟极低，运营成本极具竞争力。
    - **架构创新：** `零计算专家`和`ScMoE`为高效大模型的设计提供了有价值的新思路。
    - **强大的系统优化：** 从训练到推理都进行了深度的系统级协同优化，保证了高稳定性和高效率。

    **劣势：**
    - **复杂推理能力有限：** 与顶级的闭源模型相比，在知识深度和复杂逻辑推理链上仍有差距。
    - **长文本生成稳定性：** 在处理超长或需要多步精确计算的生成任务时，输出的完整性和准确性有时会下降。
  modelSize: 560B (总计 560B, 激活 18.6B~31.3B)
  modelType: 语言, 代码
  openSource: true
  contextWindow: 128K
  officialDoc: https://github.com/meituan-longcat/LongCat-Flash-Chat
- date: "2025-08-27"
  title: ⭐Google Gemini 2.5 Flash Image (nano-banana)
  text: |-
    **摘要：** Google发布的顶级图像生成与编辑模型，在LMArena盲测中以创纪录优势夺冠。该模型以其卓越的角色一致性、强大的提示编辑能力和极高的性价比著称，但在处理复杂任务时稳定性有待提高。

    **模型规格与架构：**
    - 官方名称：`Gemini 2.5 Flash Image`，社区昵称 `nano-banana`。
    - 知识截止：2025年6月。
    - 性能：生成速度快，API每分钟最多可调用500次。
    - 成本：定价极低，每张图片成本约0.039美元（人民币不到3毛钱），性价比极高。

    **性能与实测表现：**
    - **基准测试**：在LMArena盲测竞技场中获得历史最高Elo分数领先优势，被广泛认为是当前最强的图像编辑模型。
    - **角色一致性 **：核心优势。能够跨多张图片高度保持人物的面部、神态和穿着，效果自然，AI味少。偶有小瑕疵（如生成两副墨镜）。
    - **图像编辑**：表现顶尖。可通过简单的自然语言提示完成精确的局部修改（如修复“六指图”）、无缝添加元素（如纹身），无需手动框选。
    - **风格迁移**：对主流艺术风格（如油画、动漫）的迁移效果出色，但处理小众风格（如像素风）时表现较弱。
    - **多元素融合与复杂编辑**：最主要的短板。当提示包含多个指令（如同时换装、换背景、改动作）时，稳定性急剧下降，成功率低，需要用户多次尝试。

    **优势：**
    - SOTA级别的角色一致性与图像编辑能力，效果逼真自然。
    - 极具竞争力的价格和快速的生成速度，性价比极高。
    - 创意生成能力强，适合制作手办场景等复杂有趣的视觉内容。
    - 在社区评测中，综合表现被认为优于 `GPT-4o` 等竞争对手。

    **劣势：**
    - 稳定性不足，出图质量波动较大，完美结果需要多次生成（“roll图”）。
    - 难以胜任复杂、多元素的编辑任务，指令越复杂，失败率越高。

    **适用场景 / 备注：**
    - 适用于需要保持角色连贯性的故事叙述、营销内容创作和概念设计。
    - 作为高效、低成本的P图工具，可用于快速修复或创意修改图片。
    - 测评主要围绕其核心更新点“以图生图”和图片编辑展开。
  modelSize: ""
  modelType: 图像生成, 多模态
  openSource: false
  contextWindow: ""
  officialDoc: https://developers.googleblog.com/en/introducing-gemini-2-5-flash-image/
  evaluation: |-
    又不需要PS了？
    实测后，确实🐂，图片修改比图片生成好。
- date: "2025-08-26"
  title: ⭐面壁智能 MiniCPM-V 4.5
  text: |-
    **摘要：** 面壁智能开源的8B端侧多模态旗舰模型，是行业首个具备“高刷”视频理解能力的模型，在多项评测中性能越级超越`Qwen2.5-VL 72B`等更大规模模型。

    **模型规格与架构：**
    - **参数量：** `8B`
    - **架构/范式：** 基于`Qwen3-8B`和`SigLIP2-400M`构建，核心创新是`3D-Resampler`结构，可进行三维视频片段的高密度压缩。

    **性能与实测表现：**
    - **基准：** 在`OpenCompass`、`MotionBench`、`FavorBench`、`LVBench`、`OmniDocBench`等多个图文、视频理解榜单上取得同级SOTA，并超越部分更大模型。
    - **实测：** 视频处理可实现高达`10fps`的抽帧，在同等视觉Token开销下可接收6倍视频帧，视觉压缩率达96倍。在`Video-MME`评测上，推理时间开销仅为同级模型的1/10。

    **优势：**
    - **高刷视频理解：** 行业首创，能更精细地捕捉动态细节，将视频理解从“看PPT”提升到“看动态画面”。
    - **越级性能：** 以`8B`参数量在图片理解、视频理解、文档解析等核心任务上全面超越`72B`规模的模型，实现“以小博大”。
    - **端侧友好：** 推理效率极高，显存占用低、速度快，是端侧AI应用的优选方案。
    - **灵活推理：** 支持“常规模式”和“深度思考模式”，可根据任务复杂性平衡性能与响应速度。

    **适用场景：**
    - 需要精细动态捕捉的视频分析、移动端实时多模态交互、复杂文档自动化处理等。
  modelSize: 8B
  modelType: 多模态, 文档解析模型
  openSource: true
  contextWindow: ""
  officialDoc: https://huggingface.co/openbmb/MiniCPM-V-4_5
  evaluation: 发现一个好现象：国内的AI‘六小龙’不再只卷通用大模型了，很多开始深耕特定领域，通过聚焦资源在特定赛道上构建核心竞争力。在我们的近期测试中，对于检验单的识别效果比Qwen-VL 72B效果要好。
- date: "2025-08-26"
  title: 书生·InternVL 3.5
  text: |-
    **摘要：** InternVL 3.5 是由上海人工智能实验室发布的开源多模态大模型系列，通过级联强化学习（Cascade RL）、视觉分辨率路由器（ViR）和解耦部署（DvD）等创新，显著提升了模型的推理能力、效率和多功能性。其旗舰模型在多个基准上达到了开源社区的领先水平，并缩小了与顶尖商业模型的性能差距。

    **模型规格与架构：**
    - **模型系列：** 共发布9个模型，涵盖密集型（Dense）和专家混合（MoE）两种架构。
      - **Dense模型：** `1B`、`2B`、`4B`、`8B`、`14B`、`38B`
      - **MoE模型：** `InternVL3.5-20B-A4B`、`InternVL3.5-30B-A3B`、`InternVL3.5-241B-A28B`
    - **架构/范式：** 延续了 `ViT–MLP–LLM` 范式，视觉编码器采用 `InternViT-300M` 和 `InternViT-6B`，语言模型基于 `Qwen3` 和 `GPT-OSS` 系列初始化。
    - **高效变体：** 引入 `ViR` 机制的模型被称为 `InternVL3.5-Flash`，专为资源受限场景优化。

    **性能与实测表现：**
    - **推理能力：** 相较于前代 `InternVL 3`，推理性能平均提升超过10个百分点，在 `MMMU` 和 `MathVista` 等复杂推理基准上进步显著。
    - **综合性能：** 旗舰模型 `InternVL3.5-241B-A28B` 在通用多模态、推理、文本和代理任务的综合评测中，取得了开源模型的最佳结果，其通用多模态能力与 `GPT-5` 相当。
    - **效率提升：** `InternVL3.5-Flash` 能在维持近100%性能的同时，将视觉令牌数量减少50%。`DvD` 部署策略使推理速度提升4.05倍。
    - **新功能：** 扩展了对GUI交互、具身代理和SVG理解与生成等新能力的支持，并在 `OSWorld`、`WindowsAgentArena` 等基准上表现出色。

    **优势：**
    - **级联强化学习 (Cascade RL)：** 结合离线与在线RL，稳定高效地提升了模型的复杂推理能力。
    - **视觉分辨率路由器 (ViR)：** 动态调整图像压缩率，在不牺牲性能的前提下大幅降低了计算成本。
    - **解耦视觉语言部署 (DvD)：** 将视觉和语言模块部署在不同硬件上并异步处理，解决了计算瓶颈，显著加快了推理速度。
  modelSize: 1B, 2B, 4B, 8B, 14B, 38B, 20B (激活4B), 30B (激活3B), 241B (激活28B)
  modelType: 多模态
