- date: "2025-07-28"
  title: 通义万相2.2 (Tongyi Wanxiang 2.2)
  text: |-
    通义万相2.2是阿里巴巴于2025年7月28日发布的、主打**视频生成**的新一代AI模型，其目标是实现“电影级”的创作水准。

    ### 主要功能
    * **文生视频 (Text-to-Video)**：根据文本描述生成高清视频。
    * **图生视频 (Image-to-Video)**：将静态图片转化为内容和风格一致的动态视频。
    * **统一视频模型**：发布了一款5B参数的统一模型，同时支持文生视频和图生视频，降低了部署门槛。
    * **文生图**：系列中也包含了升级的文生图模型。

    ### 技术亮点
    * **首创MoE架构**: 业界首个在视频生成中采用混合专家（MoE）架构的模型，有效平衡了效果与计算效率。
    * **电影美学控制系统**: 内置超过60个美学参数，允许用户精细控制光影、色彩、镜头语言等视觉风格。
    * **强大的动态表现**: 在处理复杂运动、保持角色一致性和还原微表情等细节方面表现出色。
