- date: "2025-07-26"
  title: 书生 Intern-S1
  text: |-
    **摘要：** 上海人工智能实验室发布的全球领先开源科学多模态大模型，被誉为“全能高手+科学明星”，旨在通过深度融合通用与顶尖科学能力，重构科研生产力。

    **模型规格与架构：**
    - 参数量：28B激活参数（总计241B）。
    - 架构/范式：基于 `Qwen3-235B` 和 `InternViT-6B` 构建的混合专家（MoE）架构。
    - 核心创新：首创“跨模态科学解析引擎”，并采用动态Tokenizer和时序信号编码器，原生支持化学分子式、蛋白质序列、地震波等多种复杂科学模态数据的深度融合。

    **性能与实测表现：**
    - 多模态通用能力：综合能力在开源模型中排名第一，得分比肩国内外一流闭源模型。
    - 科学专业能力：在化学、材料、地球科学等多个专业任务基准上，性能超越了 `Grok-4` 等顶尖闭源模型，树立了行业新标杆。
    - 训练优化：通过系统与算法的联合优化，实现了大型多模态MoE模型在FP8精度下的高效强化学习，成本降低10倍。

    **优势：**
    - **顶尖科学能力**：专为前沿科学研究设计，在处理和理解高度专业化的科学数据方面具有显著优势。
    - **开源与生态**：模型及全链路工具链（微调、部署、评测）全面开源，支持免费商用，社区生态活跃。

    **适用场景 / 备注：**
    - 旨在成为“科研搭档”而非简单的“对话助手”，适用于化合物合成路径预测、化学反应可行性判断、生物信息学分析等前沿科研任务。
    - 其轻量级版本 `Intern-S1-mini` 于2025年8月21日发布。
  modelSize: 241B (激活 28B)
  modelType: 多模态, 语言, 科学计算
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/InternLM/Intern-S1

