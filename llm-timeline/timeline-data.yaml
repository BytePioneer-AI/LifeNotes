  evaluation: |-
    在时间点登场，本身就是一种态度👍。
- date: "2025-09-05"
  title: "月之暗面 Kimi K2-Instruct-0905"
  text: |-
    **摘要：** 月之暗面（Moonshot AI）发布的开源混合专家（MoE）大模型，拥有1T总参数和32B激活参数。该模型增强了编码和Claude Code兼容性，在多个编码基准测试中表现出色，并拥有256K的超长上下文窗口。

    **模型规格与架构：**
    - 架构/范式：`混合专家模型 (MoE)`
    - 参数量：总计 1T，激活 32B
    - 上下文：256K

    **性能与实测表现：**
    - **SWE-Bench verified：** 达到 `69.2`，性能与业界顶尖的闭源模型（如 `Claude-Opus-4` 的 `72.5`）非常接近。
    - **Terminal-Bench：** 得分 `44.5`，在此项基准上超越了 `Claude-Opus-4`（`43.2`）。
    - **对比前代：** 相较于 `K2-Instruct-0711` 版本，在各项代码基准上均有显著提升。
    - **工具调用：** 具备强大的原生工具调用（Tool Calling）能力。

    **优势：**
    - **编码能力优化：** 针对前后端开发、UI生成等场景有显著优化。
    - **超长上下文：** 256K上下文窗口在处理大型代码库时优势明显。

