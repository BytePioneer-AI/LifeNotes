    又不需要PS了😁

- date: "2025-09-22"
  title: "百度智能云 千帆-VL"
  text: |-
    **摘要：** 百度智能云千帆平台发布的企业级视觉语言大模型（VLM），全面开源`3B`、`8B`、`70B`三种尺寸。该模型在文档理解、OCR、图表分析和数学推理等领域经过深度优化，并全程基于百度自研的`昆仑芯`AI芯片完成训练，展示了全栈国产化的AI能力。

    **模型规格与架构：**
    - **基础模型：** 采用混合架构，`Qianfan-VL-3B` 基于 `Qwen2.5-3B`，而 `8B` 和 `70B` 版本基于 `Llama 3.1` 架构。
    - **视觉编码器：** 使用基于 `InternViT` 的视觉编码器，支持高达`4K`的高分辨率图像输入。
    - **技术创新：**
      - **四阶段渐进式训练管线：** 通过视觉特征预训练、视觉-文本对齐、通用指令跟随、以及OCR与文档能力增强四个阶段，系统性地提升模型能力。
      - **高精度数据合成：** 针对OCR、文档和图表等复杂场景，利用大模型生成高质量的合成数据，弥补真实数据的不足。
      - **昆仑芯训练优化：** 在大规模`昆仑芯`集群上进行了深度优化，实现了高效稳定的训练。

    **性能与实测表现：**
    - 在多个权威评测基准上表现出色，尤其是在文档理解和OCR相关任务中。
    - 在 `OCRBench`、`DocVQA`、`ChartQA`、`TextVQA` 等评测中，`Qianfan-VL-70B` 的性能领先于 `InternVL-Chat-V1.5`、`Qwen2.5-VL-Max` 等同类模型。
    - 在数学推理基准 `MathVista` 上也展现了强大的能力。

    **优势：**
    - **文档理解能力强：** 专为企业级文档处理场景优化，OCR和图表识别准确率高。
    - **全栈国产化：** 从训练芯片到模型框架的全栈国产化实践，具有战略意义。
    - **开源与灵活性：** 提供多尺度模型，覆盖从端到云的部署需求，社区可自由使用和微调。
    - **成本效益：** 依托千帆平台的低成本定价策略，具备较高的市场竞争力。
  modelSize: "70B, 8B, 3B"
  modelType: "多模态, 文档解析模型"
  openSource: true
  contextWindow: ""
  officialDoc: "https://baidubce.github.io/Qianfan-VL/#multi-scale-models"
  evaluation: |-
    百度的`昆仑芯`，我是没有想到的，期待发力吧
- date: "2025-09-22"
  title: "⭐美团 龙猫LongCat-Flash-Thinking"
  text: |-
    **摘要：** 美团于2025年9月22日开源的“思考”模型，是其`LongCat`系列的新成员。它定位为**高性能推理模型**，基于`MoE`架构，通过创新的**两阶段训练法**，在代码、数学、`Agent`工具使用和**形式化推理**等领域表现优异。

    **模型规格与架构：**
    - **参数量：** `560B (MoE)`
    - **架构/范式：** **混合专家模型**（`MoE`），与`LongCat-Flash-Chat`结构相似。
    - **训练方法：** 采用创新的**两阶段训练流程**：
      1. **长CoT冷启动训练：** 首先通过**课程学习**进行**增量预训练**，注入`STEM`和编程竞赛数据以建立高起点推理能力；然后进行`SFT`，使用高质量的通用推理、形式推理和`Agent`推理数据。`SFT`数据配比为：`STEM` (35%)、`Code` (20%)、`General QA` (20%)、`Agent` (14%)、`Proving` (8%)、`Logic` (3%)。
      2. **强化学习 (RL)：** 采用了自研的`DORA`异步弹性共卡系统，并首创地将不同领域（如代码、数学）并行进行`RL`训练后再融合，有效缓解了混合训练时的领域间干扰，提升了训练效率和模型性能。

    **性能与实测表现：**
    - **基准：** 在官方榜单上，其在编程、工具使用和形式化推理证明等任务上表现突出。
    - **实测（来自社区）：**
      - **速度：** 响应速度极快。
      - **指令遵循：** 表现出色，能很好地理解用户的隐含意图。
      - **推理能力：** 内置**代码解释器**，在处理大数计算、几何问题时会自动调用`Python`工具求解，表现取巧且有效。但在部分复杂的逻辑题上仍会出错。
      - **代码生成：** 能够生成符合风格要求的代码，但功能实现上较为基础。

    **优势：**
    - 推理能力强，尤其在垂直领域（代码、数学、`Agent`）。
    - 训练方法创新，`DORA`系统和**分领域RL融合策略**在工程上极具价值。
    - 响应速度快，指令遵循能力好。
    - 开源社区可以从中借鉴其高质量的数据构建和训练方法。

    **劣势：**
    - 模型规模大，部署门槛高，社区反馈至少需要8张`H100`级别的算力，对个人开发者和中小企业不友好。
    - 在某些开放式、反常识的逻辑推理问题上表现仍有不足。

  modelSize: "560B (MoE)"
  modelType: "语言、代码、Agent、推理"
  openSource: true
