- date: "2025-11-06"
  title: "⭐Kimi K2 Thinking"
  text: |-
    **摘要：** 月之暗面 (Moonshot AI) 发布的旗舰级**开源思考模型**。它被定义为“模型即智能体” (Model as Agent)，核心是“边思考，边使用工具”，代表了 Kimi 在**自主智能体 (Agent)** 能力上的重大突破。

    **模型规格与架构：**
    - **架构：** `MoE` (Mixture of Experts) 架构。
    - **参数量：** 总参数量 `1T` (1万亿)，激活参数 `32B` (320亿)。
    - **上下文：** `256K`。
    - **技术：** 采用了**量化感知训练 (QAT)**，原生支持 `INT4` 推理，据称可将生成速度提升约 2 倍。

    **性能与实测表现：**
    - **核心能力：** 强大的 **Agent (智能体)** 能力。无需人工干预即可执行多达 `200-300` 次连续工具调用（如搜索、浏览、编程），通过数百步连贯推理解决复杂问题。
    - **基准表现：** 在多项基准上实现了“开源超闭源”。
      - `HLE` (人类终极考试): 获 `44.9` 分 (Heavy版 `51%`)，超越 `GPT-5` 和 `Claude 4.5`。
      - `BrowseComp` (自主网络浏览): `60.2%`，刷新 SOTA 纪录。
      - `SWE-bench Verified` (代码): 超过 `70%`。

    **优势：**
    - **顶尖 Agent 与推理：** 擅长解决复杂学术问题、高难度网络浏览（如阅读200页技术博客）和财报分析。
    - **前端与可视化：** 实测中生成 `SVG`、交互式 UI（如“禅意打字”）、`p5.js` 动画和杂志风格数据图表（如《人类简史》）的能力“非常惊艳”，被认为已接近 `Claude Sonnet 4.5`。
    - **高性价比：** API 定价极低，比 `GPT-5` 低一个数量级，成本仅为 `Claude 4.5 Sonnet` 的六分之一。

    **备注：**
    - 采用修改后的 `MIT` 许可证，授权宽松，但增加了“月活过亿或月收入超2000万美元需显著标注 `Kimi K2`”的限制条款。
    - 发布后热度极高，一度导致服务器被“挤爆”。
  modelSize: "1T (总计 1T, 激活 32B)"
  modelType: "语言、代码、Agent"
  openSource: true
  contextWindow: "256K"
  officialDoc: ""
  evaluation: |-
    开源干翻闭源的又一“DeepSeek时刻”！

- date: "2025-11-03"
  title: "⭐通义千问 Qwen3-Max-Thinking"
  text: |-
    **摘要：** 阿里巴巴通义千问 `Qwen3-Max` 模型的“推理增强”版本，于2025年11月上旬作为“早期预览版” (early preview) 发布。它专为**复杂推理**而设计，牺牲了响应速度以换取深度思考能力。

    **技术与架构：**
    - **混合思维模式 (Hybrid Thinking Mode):** 这是 `Qwen3` 系列的核心特性。`Thinking` 模式专为数学计算、深度分析等复杂问题设计。
    - **技术集成：** 为了实现卓越的推理能力，`Qwen3-Max-Thinking` 集成了**代码解释器** (code interpreters) 和“并行测试时计算” (parallel test-time compute) 等技术，类似于 `GROK 4` 的 heavy 模式。

    **性能与实测表现：**
    - **官方基准 (强项)：** 尽管只是“半成品”，但在高难度数学推理上表现惊人。在 `AIME 25` 和 `HMMT 25`（哈佛-MIT数学竞赛）上均达到了 `100%` 的满分准确率，超越了 `GPT-5 Codex` (`98.7%`)。
    - **实测优势 (分析与文学)：**
      - **深度分析：** 在零售经营分析等任务中，被评测认为结论比 `GPT-5` 更准确全面。
      - **文学创作：** 在鲁迅风格短评中，其意象和深度被认为强于 `GPT-5`。
      - **数理能力：** 能够正确解答IMO竞赛难题（但速度很慢）。
    - **实测劣势 (前端与速度)：**
      - **前端编程：** 最大的短板。在生成3D太阳系、兵马俑街舞、元素周期表等可视化任务时，效果平庸、元素缺失或存在明显BUG（如无法公转）。
      - **响应速度：** 非常慢。评测中解决一道数学题耗时约5分钟，并被调侃“中英文各想一遍”。
      - **稳定性：** 在某些任务上（如DNA可视化）需要报错后才能修正，或在简单提示下表现不佳。

  modelSize: ""
  modelType: "语言, 代码"
  openSource: false
  contextWindow: ""
