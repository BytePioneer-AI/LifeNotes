- date: "2025-08-21"
  title: 书生 Intern-S1-mini
  text: |-
    **摘要：** Intern-S1的8B参数轻量化版本，旨在以极低的部署门槛提供强大的通用与专业科学能力，让更广泛的开发者和研究者能够轻松进行二次开发与应用。

    **模型规格与架构：**
    - **基础架构**：
      - **语言模型**：基于8B参数的密集语言模型（`Qwen3`），提供强大的语言理解和生成能力。
      - **视觉编码器**：结合0.3B参数的视觉编码器（`InternViT`），用在处理和理解图像数据。
    - **设计理念**：延续 `Intern-S1` 的设计理念，覆盖文本、图像、分子式、蛋白质等多模态、多任务数据领域，实现了轻量级模型下多种能力的极致平衡。

    **性能与实测表现：**
    - **通用能力**：在 `MMLU-Pro`、`AIME-2025`、`MMMU` 等多项权威基准上表现卓越，稳居同量级模型第一梯队。
    - **科学能力**：在化学 (`SmolInstruct`, `ChemBench`)、材料 (`MatBench`) 等任务中表现尤为突出，显著领先同级模型；在物理、地球、生物等学科中也保持领先水平。

    **优势：**
    - **轻量高效**：“减身材不减实力”，在参数规模与性能之间取得了良好平衡，大幅降低了对高端计算设备的依赖。
    - **易于开发**：上手门槛极低，仅需一张24GB显存的GPU即可完成LoRA微调，并已得到 `LLaMA-Factory` 等主流框架的支持。

    **适用场景 / 备注：**
    - 非常适合开展科学研究、在产品或应用中快速验证创意，以及在教学实践中让学生直观理解多模态大模型的原理与应用。
  modelSize: 8B
  modelType: 多模态, 语言
  openSource: true
  contextWindow: ""
  officialDoc: https://huggingface.co/internlm/Intern-S1-mini
- date: "2025-08-20"
  title: 字节跳动 Seed-OSS
  text: |-
    **摘要：** 字节跳动Seed团队发布的36B参数开源大语言模型，以原生的512K超长上下文窗口和创新的“思考预算”控制机制为主要看点，在多个英文基准测试上刷新了SOTA记录。

    **模型规格与架构：**
    - **参数量：** `36B`（稠密模型）
    - **架构：** Causal LM，采用`RoPE`位置编码、`GQA`注意力机制、`RMSNorm`归一化和`SwiGLU`激活函数。
    - **上下文：** 原生支持 `512K`。
    - **训练数据：** 12T Tokens，知识截止时间为2024年7月。
    - **版本：** 提供 `Seed-OSS-36B-Base`（含合成数据）、`Seed-OSS-36B-Base-woSyn`（不含合成数据）和 `Seed-OSS-36B-Instruct`（指令微调）三个版本。

    **性能与实测表现：**
    - **基准：** 在 `BBH` 推理基准上刷新了开源模型纪录。在 `MMLU-Pro`、`GSM8K`、`MATH`、`HumanEval` 等多个知识、数学、代码类基准上均表现出色，性能超越了Qwen2.5-32B等同级别模型。
    - **实测：** 指令微调版在 `AIME24` 数学竞赛题上表现优异。模型在工具调用（Agent）任务上经过特别优化，表现突出。

    **优势：**
    - **超长上下文：** 原生512K上下文长度，是发布时主流开源模型的4倍，无需插值扩展，适合处理海量信息场景。
    - **思考预算（Thinking Budget）：** 允许用户灵活设定token预算来控制模型的思考深度，以平衡性能与推理成本，实用性强。
    - **研究友好：** 提供了不含合成数据的“纯净”预训练版本，方便学术界进行后续研究。
    - **性能优异：** 以相对较少（12T）的训练数据量，在多个领域达到了SOTA性能。

    **劣势：**
    - **语言偏向性：** 模型主要针对英语进行了优化和评估，在中文等其他语言上的性能有限且未经严格测试，对于非英语场景应用价值受限。

    **适用场景 / 备注：**
    - 适用于法律文档审查、长篇报告分析、复杂代码库理解等需要处理海量信息的专业场景。
    - 使用 `vLLM` 框架进行推理时，需要安装指定版本。
