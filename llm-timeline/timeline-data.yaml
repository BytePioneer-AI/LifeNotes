- date: "2026-04-22"
  title: "⭐ 通义千问 Qwen3.6"
  text: |-
    **摘要：** 阿里巴巴通义千问团队在 2026年4月 发布 `Qwen3.6` 开放权重系列，先后开源 `Qwen3.6-35B-A3B` 与 `Qwen3.6-27B`。这一代主打 **Agentic Coding**、**多模态推理** 与 **超长上下文**，定位为面向开发者和智能体工作流的实用型升级。

    **模型规格与架构：**
    - `Qwen3.6-27B`：`27B` 稠密多模态语言模型，内置视觉编码器，支持文本、图像与视频理解；相比 `MoE` 路线部署更直接。
    - `Qwen3.6-35B-A3B`：**稀疏混合专家**（`MoE`）模型，总参数 `35B`、单次激活约 `3B`，采用 `256` 个专家，每步激活 `8` 个路由专家与 `1` 个共享专家。
    - 两个模型均支持 **thinking / non-thinking** 模式，并引入 **Thinking Preservation**，用于在多轮智能体任务中保留推理上下文。
    - 上下文长度：原生 `262K` tokens，可通过 `YaRN` 等配置扩展至约 `1.01M` tokens。

    **性能与实测表现：**
    - 官方称 `Qwen3.6-27B` 在主要代码智能体评测中全面超过前代开源旗舰 `Qwen3.5-397B-A17B`，在 `SWE-bench Verified`、`Terminal-Bench 2.0`、`SkillsBench`、`QwenWebBench` 等任务上表现突出。
    - `Qwen3.6-35B-A3B` 则以仅 `3B` 激活参数取得接近或超过更大稠密模型的编码与多模态推理表现，是更偏效率和低成本部署的版本。
    - 多模态方面，两者覆盖视觉问答、文档理解、空间理解与视频理解等场景，模型卡中给出了 `MMMU`、`RealWorldQA`、`OmniDocBench`、`VideoMME` 等基准结果。

  modelSize: "27B, 35B (总计 35B, 激活 3B)"
  modelType: "大语言模型 (LLM)、多模态、代码生成 (含 Vibe Coding 等)、智能体 (AI Agent)"
