- date: "2025-09-23"
  title: "⭐通义千问 Qwen3-Omni"
  text: |-
    **摘要：** 阿里巴巴通义千问团队发布的**原生端到端全模态（Omni-modal）**大模型，能统一处理和理解**文本、图像、音频、视频**四种模态，并能以文字和自然语音进行实时流式输出，真正实现了能听、会看、能说。

    **模型规格与架构：**
    - 核心架构是创新的 **`Thinker-Talker`** 稀疏混合专家（MoE）双体架构，实现了理解与生成的解耦，保证了低延迟。
      - `Thinker`（思考者）：负责多模态理解与推理，模型规格为 `30B`，单步激活约 `3B` 参数 (`30B-A3B`)。
      - `Talker`（说话者）：负责生成自然语音，模型规格为 `3B`，单步激活约 `0.3B` 参数 (`3B-A0.3B`)。
    - **多语言能力：** 支持 `119` 种文本语言、`19` 种语音输入和 `10` 种语音输出（含粤语等方言）。

    **性能与实测表现：**
    - **基准测试：** 在 `36` 项音视频基准中有 `32` 项达到开源SOTA，其中 `22` 项超越了 `Gemini-2.5-Pro` 等闭源模型。
    - **低延迟：** 端到端语音首包延迟低至 `211ms`（纯音频）和 `507ms`（音视频）级别。

    **开源版本：**
    - `Qwen3-Omni-30B-A3B-Instruct`: 全功能版，包含 `Thinker` 和 `Talker`，支持文字和语音输出。
    - `Qwen3-Omni-30B-A3B-Thinking`: 纯推理版，仅包含 `Thinker`，只支持文字输出，资源占用更低。
    - `Qwen3-Omni-30B-A3B-Captioner`: 音频字幕精调版，专用于生成详细且低幻觉的音频文字描述。

    **适用场景 / 备注：**
    - 适合智能客服、会议纪要、教育、内容创作、安防监控等多种复杂场景。
    - 本地部署对硬件要求较高，处理长视频需要大量显存（例如120秒视频约需 `145GB` 显存）。
  modelSize: "30B (Thinker: 激活3B), 3B (Talker: 激活0.3B)"
  modelType: "多模态"
  openSource: true
