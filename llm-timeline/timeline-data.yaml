- date: "2025-08-01"
  title: 阶跃Step-3
  text: |-
    #### 
    阶跃星辰最新开源的Step-3是一款SOTA级基础模型，其核心设计理念是 **“模型-Infra协同设计”** ，旨在实现极致的推理效率和性价比。它在MMMU等多个多模态榜单上取得了开源模型的新SOTA成绩。

    ### 模型规格
    * **架构**: MoE (混合专家) 架构，包含48个专家
    * **参数量**: 总参数量 321B (316B语言 + 5B视觉)，激活参数量 38B
    * **性能**: 在Hopper GPU上解码速度高达 **4039 token/秒**，是DeepSeek-V3的174%（4K上下文、FP8、无MTP）。
    * **成本**: 性价比极高，在特定硬件组合下，**百万Token解码成本不到4毛钱人民币**，在H20计算卡上解码成本仅为DeepSeek-V3的30%。

    ### 技术亮点
    * **模型-Infra协同设计**: 将模型架构、系统调度和硬件Infra作为一个整体进行优化。
    * **MFA注意力机制**: 采用自研的MFA（多矩阵因子分解）注意力机制，从根源上压缩KV缓存，降低计算消耗，尤其适合长上下文场景。
    * **AFD解耦系统**: 提出AFD（Attention-FFN Disaggregation）机制，将Attention和FFN计算任务拆分到各自最适合的GPU集群，通过自研的**StepMesh通信库**连接，实现整体吞吐效率最大化。
    * **开源开放**: 模型及核心的StepMesh通信库均已开源。

    ### 部署能力
    * 可在8块48GB的GPU上运行，并处理高达80万个Token的上下文。
  modelSize: 321B (激活 38B)
  modelType: 多模态大模型
  openSource: true
  contextWindow: 64K
  officialDoc: https://github.com/stepfun-ai/Step3
