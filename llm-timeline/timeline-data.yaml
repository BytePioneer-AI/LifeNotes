- date: "2025-08-22"
  title: Mirage 2
  text: |-
    **摘要：** 全球首款AI原生UGC游戏引擎`Mirage`的2.0版本，是一个可在线游玩的实时通用领域生成式世界引擎。它能将任何图像（照片、绘画、涂鸦等）或文本提示，转化为可实时互动的3D世界，被视为对标谷歌`Genie 3`的重要产品。

    **模型规格与性能指标：**
    - **生成时长：** 可达10分钟以上。

    **性能与实测表现：**
    - **实测体验：** 当前版本体验不佳，存在明显的操控延迟、视角切换卡顿、画面帧率低以及视觉稳定性不足（如快速场景转换引入意外细节）等问题。

    **优势：**
    - **实时互动性强：** 用户可通过对话式文本提示，即时改变和重塑游戏世界。
    - **输入源多样：** 支持从照片到儿童涂鸦等多种形式的图像输入，并转化为可玩世界。
    - **低门槛运行：** 理论上可在消费级GPU上实现低延迟运行，潜力巨大。

    **劣势：**
    - **体验待优化：** 实际操控的延迟感和画面流畅度与现代游戏标准有较大差距。

    **适用场景 / 备注：**
    - 该模型展示了AI实时共同创作游戏的未来方向，让“世界模型”成为可在线游玩的产品。官方承认在动作控制精度和视觉稳定性方面仍存在前沿问题有待解决。
