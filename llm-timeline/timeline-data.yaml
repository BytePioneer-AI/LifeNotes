- date: "2025-08-15"
  title: 腾讯 HunyuanWorld-1.0-lite
  text: |-
    **摘要：** 腾讯于8月15日正式发布 `HunyuanWorld-1.0` 的量化版本 `HunyuanWorld-1.0-lite`。该版本是继7月26日初始模型发布后的重大更新，通过量化技术显著降低了硬件门槛，首次实现了在 `4090` 等消费级GPU上运行，极大地提升了模型的可及性和实用性。

    ![](https://github.com/Tencent-Hunyuan/HunyuanWorld-1.0/raw/main/assets/teaser.png)

    **模型规格与架构：**
    - **核心架构：** 沿用 `HunyuanWorld 1.0` 的核心框架，即“全景代理生成 → 语义分层 → 层次化3D重建”。
    ![](https://github.com/Tencent-Hunyuan/HunyuanWorld-1.0/raw/main/assets/arch.jpg)
    - **Lite版关键优化：** 为突破显存瓶颈，Lite版本引入了关键的量化与缓存技术，用户可通过添加 `--fp8_gemm`、`--fp8_attention` 和 `--cache` 等参数来启用。

    **性能与实测表现：**
    - **硬件兼容性：** 成功将模型部署在消费级显卡上，解决了初始版本对高端计算资源（>26GB显存）的依赖。
    - **生成质量：** 在大幅降低资源消耗的同时，保持了与原版几乎无异的高质量3D世界生成效果。根据官方报告，模型在多项视觉质量和几何一致性指标上（如BRISQUE, NIQE, Q-Align, CLIP-T/I）均优于其他开源方法。
    - **视觉效果：**
    ![](https://github.com/Tencent-Hunyuan/HunyuanWorld-1.0/raw/main/assets/roaming_world.gif)

    **优势：**
    - **极高的可及性：** Lite版本的发布是该项目的里程碑，使广大个人开发者和小型团队也能轻松体验和使用前沿的3D世界生成技术。
    - **完整的开源生态：** 提供从推理代码、模型权重到技术报告的全套资源，并配套了模型浏览器等工具。
    - **强大的兼容性：** 生成的 `3D mesh` 格式可无缝接入游戏开发、物理仿真、VR/AR等现有计算机图形（CG）工作流。

    **适用场景：**
    ![](https://github.com/Tencent-Hunyuan/Hunyu_anWorld-1.0/raw/main/assets/application.png)
    - 游戏开发
    - 虚拟现实与增强现实
    - 影视制作与广告
    - 交互式内容创作
  modelSize: "PanoDiT-Text: 478MB, PanoDiT-Image: 478MB, PanoInpaint-Scene: 478MB, PanoInpaint-Sky: 120MB"
  modelType: 多模态, 3D世界生成
  openSource: true
  contextWindow: ""
  officialDoc: https://github.com/Tencent-Hunyuan/HunyuanWorld-1.0
  evaluation: Lite版本的发布是HunyuanWorld 1.0项目走向普及应用的关键一步。它不仅在技术上展示了SOTA的性能，更重要的是通过工程优化解决了实际部署中的核心痛点，使其成为目前对个人开发者最友好的开源3D世界生成模型之一。
- date: "2025-08-11"
  title: ⭐ 智谱 GLM-4.5V
  text: |-
    **摘要：** 智谱AI发布的旗舰级开源多模态模型，基于`GLM-4.5-Air`构建。它在42个公开基准中的41个上取得SOTA性能，并以其强大的原生视频理解、视觉定位（Grounding）和网页复刻能力在社区实测中获得高度评价。

    **模型规格与架构：**
    - **参数量**：106B总参数，12B激活参数。
    - **架构/范式**：采用`MoE`（专家混合）架构，延续`GLM-4.1V-Thinking`技术路线，文本基座为`GLM-4.5-Air-Base`。
    - **其他特性**：新增“思考模式”开关，允许用户在追求速度和深度推理之间进行灵活切换。

    **性能与实测表现：**
    - **基准**：官方宣称在42个公开多模态榜单中，41个达到SOTA，综合性能领先同级别开源模型。
    - **实测**：在社区测试中，于专业读数（如游标卡尺）、复杂场景推理、网页复刻、原生视频内容分析、视觉定位等高级任务上表现出色且快速。

    **优势：**
    - **原生视频理解**：具备真正的时空理解能力，能按时间戳分析视频画面内容，而非简单的音频转录。
    - **强大的文档与代码能力**：在OCR、表格识别（可还原为HTML）、网页复刻等任务上表现顶尖。
    - **精准的视觉定位（Grounding）**：能准确识别并框选图像中的指定元素，在特定任务中切换到Grounding模式可显著提升准确率。

    **劣势：**
    - **高阶空间逻辑推理**：与其他多模态模型类似，在复杂的空间变换和逻辑推理任务上存在明显短板。
    - **细粒度识别**：在区分度极低的场景（如高度相似的建筑内景）中可能出错。
    - **部署门槛**：模型体量较大（106B），对本地部署有较高硬件要求。


    ```json
    ## Role
    你是一位有多年经验的OCR表格识别专家。
    ## Goals
    需要通过给定的图片，识别表格里的内容，并以html表格结果格式输出结果。
    ## Constrains
    - 需要认识识别图片中的内容，将每个表格单元格中的内容完整的识别出来，并填入html表格结构中；
    - 图片中的表格单元格中可能存在一些占位符需要识别出来，例如"-"、"—"、"/"等；
    - 输出表格结构一定遵循图片中的结构，表格结构完全一致；
    - 特别注意图片中存在合并单元格的情况，结构不要出错；
    - 对于内容较多的图片，一定要输出完整的结果，不要断章取义，更不要随意编造；
    - 图片内容需要完整识别，不要遗漏，同时注意合并单元；
    - 最终输出结果需要是html格式的表格内容。
    ## Initialization
    请仔细思考后，输出html表格结果。
    ```
    测试双栏检验单，慢思考模型下真的很不错。

    **其他 - Grounding**
    **普通问法（可能得到文本回答）：**
    `"图片中奔跑的人在第几行第几列？"`
    `"图里有几串烤串？"`
    **Grounding问法（触发图片标记）：**
    `"请**框选出**图片中奔跑的人。"`
    `"请帮我**圈出**图里所有的烧烤签子。"`
    `"**标记出**图里的郭帆导演。`
