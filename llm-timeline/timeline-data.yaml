- date: "2025-09-19"
  title: "xAI Grok 4 Fast"
  text: |-
    **摘要：** 一款主打“智能密度”的成本效益型模型，其核心特点是以远低于竞品的成本，提供了与 `Grok 4` 等顶级模型几乎相当的性能，旨在提供高性能的同时降低成本。

    **核心能力与实测表现：**
    - **关键性能指标：**
      - **GPQA Diamond：** 得分85.7%，与旗舰 `Grok 4` (87.5%) 和 `Gemini 2.5 Pro` (86.4%) 表现相当。
      - **AIME 2025 (no tools)：** 得分92.0%，略高于 `Grok 4` 的91.7%。
      - **LMArena Search：** 以1163的Elo评分排名第一，展现了其在搜索和代理任务中的绝对优势。
    - **实测表现：**
      - **速度与效率：** 表现极为惊艳，API输出速度高达约274 tokens/秒（推理版）。有开发者反馈其在1.4秒内生成了250行Python代码。相比 `Grok 4`，它平均节省40%的“思考令牌”，实现了高达98%的性价比提升]。
      - **原生工具调用：** 经过端到端的工具使用强化学习训练，使其在执行需要实时网页和X平台搜索的复杂任务时，表现得像一个真正的人类研究员，能自主挖掘并整合信息。
      - **代码能力：** 表现出明显的二元性。在处理小型、独立的算法替换或代码生成任务时表现出色。然而，在需要跨多文件推理和视觉上下文的前端开发等复杂项目中，表现非常糟糕，不仅效率低下且成本高昂x。

    **主要特点与创新：**
    - **极致性价比：** 最大的特点。通过创新的架构和优化，它以接近商品级模型的定价（$0.20/$0.50 每百万输入/输出令牌），提供了旗舰级的性能，直接挑战了市场主流的高价模式。
    - **统一高效架构：** 将“推理”和“非推理”模式整合到单一模型权重中，通过系统提示引导，避免了模型切换带来的延迟和成本，是其实现低延迟和高吞吐量的关键。

    **定价**
    | 类型 | 小于128k | 大于等于128k |
    |------|-----------|--------------|
    | 输入令牌 | $0.20 / 1M | $0.40 / 1M |
    | 输出令牌 | $0.50 / 1M | $1.00 / 1M |
    | 缓存输入 | $0.05 / 1M | - |

    **已知局限或短板：**
    - 在需要深度上下文和跨文件推理的复杂任务（尤其是前端开发）中表现不佳，存在“基准测试优异，实际应用拉胯”的现象。
    - 官方模型卡承认，在非推理模式下存在“明显的欺骗率”，建议在对真实性要求高的场景中启用推理模式。
  modelSize: ""
  modelType: "多模态, 语言, 代码"
  openSource: false
  contextWindow: "2M"
  officialDoc: "https://x.ai/news/grok-4-fast"
  evaluation: |-  
    - 用老板马斯克的夸奖来说：“这就是进展！”
    - OpenRouter限时免费，真快、真香。



- date: "2025-09-19"
  title: "通义万相 Wan2.2-Animate"
  text: |-
    **摘要：** 阿里巴巴通义万相团队开源的高保真角色动画生成框架，基于 `Wan2.2` 架构全面升级。该模型以创新的**单模型架构**同时解决了**角色动画生成**与**角色替换**两大核心任务，仅需一张图片和一段参考视频，即可实现精准的动作与表情迁移，显著降低了视频创作门槛。

    **模型规格与架构：**
    - **架构升级：** 作为 `Animate Anyone` 模型的全面升级版，在人物一致性与生成质量上大幅提升。
    - **核心模式：**
      - **角色模仿 (Animation)：** 将参考视频的动作、表情精准迁移到静态图片角色上，使其“活动”起来。
      - **角色扮演 (Replacement)：** 在保留原视频动作与环境的基础上，将视频主角无缝替换为图片角色。
    - **技术亮点：**
      - 动作驱动：通过**骨骼信号**控制身体运动，利用**面部隐式特征**提取表情，实现精准复刻。
      - 环境融合：内置一个独立的光照融合模块 `Relighting LoRA`，确保替换后的角色能完美融入原场景光照。
      - 训练数据：基于一个涵盖说话、表情和身体动作的大规模人物视频数据集进行后训练。

    **性能与实测表现：**
    - **关键指标：** 在视频生成质量、主体一致性等方面超越了 `StableAnimator`、`LivePortrait` 等主流开源模型。
    - **唇形同步：** 在 `lip sync` 方面表现出色，能让静态图像跟随音视频自然地开口说话。
    - **主观评测：** 在人类主观评测中，其表现甚至优于以 `Runway Act-two` 为代表的部分闭源模型。

    **优势：**
    - **高保真与一致性：** 能够精确复制复杂的动作序列，同时有效保持角色原有特征，避免模糊失真。
    - **功能强大且统一：** 单一模型即可完成动画生成和视频换角两大任务，简化了创作流程。

    **适用场景 / 备注：**
    可广泛应用于短视频创作、舞蹈模板生成、动漫制作、虚拟主播（VTuber）内容生产、电商广告及企业培训视频等领域。
  modelSize: "14B"
  modelType: "视频生成"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/Wan-Video/Wan2.2"

- date: "2025-09-18"
  title: "蚂蚁集团 Ling-flash-2.0"
  text: |-
    **摘要：** `Ling-flash-2.0` 是 `Ling 2.0` 架构下的第三款开源MoE模型，定位为一款兼具强大性能与极致效率的百亿级语言模型。它以 **1000亿** 的总参数和仅 **61亿** 的激活参数，实现了对 **400亿** 级别以下密集模型的性能超越。

    **模型规格与架构：**
    * **架构范式：** 继承自 Ling 2.0 的 **稀疏混合专家** (`MoE`) 架构，激活率维持在 `1/32`。
    * **模型参数：** 总参数量 `100B`，推理时每 token 激活 `6.1B` 参数（非嵌入层为 `4.8B`）。
    * **训练数据：** 基于超过 `20T` tokens 的高质量数据进行训练，并经过了监督微调和多阶段强化学习。
    * **关键技术：** 采用 `aux-loss-free + sigmoid routing` 路由策略、`MTP` 层、`QK-Norm` 等优化设计。

    **性能与实测表现：**
    * **性能标杆：** 在仅激活 `~6B` 参数的情况下，综合性能达到 `40B` 级密集模型的 SOTA 水平，实现了约 **7倍** 的等效性能杠杆。
    * **核心优势：** 在 **复杂推理**、**代码生成** 和 **前端开发** 等领域表现尤为突出。
    * **推理速度：** 在 `H20` 硬件上，生成速度可达 `200+ token/s`，比 `36B` 级密集模型快 **3倍**；在长文本场景下，相对速度优势可达 **7倍** 以上。

    **优势：**
    * **极致能效：** 以极小的激活参数规模，实现了跨级别的性能挑战，大幅降低了高性能模型的推理成本和部署门槛。
    * **专长突出：** 针对高价值的复杂任务进行了深度优化，使其在专业领域的应用潜力巨大。
  modelSize: "100B (激活 6.1B)"
  modelType: "语言, 代码"
  openSource: true
  contextWindow: "32K (YaRN 可扩展至 128K)"
  officialDoc: "https://huggingface.co/inclusionAI/Ling-flash-2.0"

- date: "2025-09-18"
  title: "蚂蚁集团 Ling 2.0"
  text: |-
    **摘要：** 由蚂蚁集团开源的 **Ling 2.0** 是一个基于 **稀疏混合专家** (`MoE`) 架构的大语言模型系列，旨在以极低的计算成本实现卓越性能，主打“高效”与“强大”。首发模型 `Ling-mini-2.0` 以仅 `1.4B` 的激活参数，实现了与 `7-8B` 级密集模型相媲美的能力。

    **模型规格与架构：**
    * **首发模型：** `Ling-mini-2.0`
    * **架构范式：** **稀疏混合专家** (`MoE`)，采用 `1/32` 的超高稀疏激活率。
    * **模型参数：** 总参数量 `16.26B`，推理时每 token 仅激活 `1.43B` 参数。
    * **训练数据：** 使用超过 `20T` 高质量 tokens 进行训练。
    * **关键技术：** 全程采用 **FP8 混合精度** 进行训练，并通过 `YaRN` 技术将上下文窗口从 `32K` 扩展至 `128K`。

    **性能与实测表现：**
    * **性能杠杆：** 官方宣称实现了超过 **7倍** 的等效性能杠杆，即 `1.4B` 激活参数可达 `7-8B` 密集模型的性能。
    * **推理速度：** 在特定硬件上生成速度超过 `300+ token/s`，是同等性能密集模型的 **2倍** 以上，在长文本场景下加速比可达 **7倍**。
    * **基准表现：** 在编码、数学等复杂推理任务上表现突出，优于 `Qwen3-8B` 等同级密集模型。

    **优势：**
    * **极致效率：** 实现了极高的性价比，推理和训练成本远低于同等性能的密集模型。
    * **全面开源：** 不仅开源了模型权重，还开放了多个阶段的预训练检查点和 **FP8 高效训练方案**，极大地推动了社区研究。

  modelSize: "16.26B (激活 1.43B)"
  modelType: "语言, 代码"
  openSource: true
  contextWindow: "32K (YaRN 可扩展至 128K)"
  officialDoc: "https://github.com/inclusionAI/Ling-V2"

- date: "2025-09-16"
  title: "面壁智能 VoxCPM"
  text: |-
    **摘要：** 由清华大学与面壁智能联合开源的一款 `0.5B` 轻量级语音生成（TTS）模型。其采用创新的 **“无分词器”（Tokenizer-Free）** 架构，在零样本语音克隆和表现力合成方面达到业界顶尖水平，尤其擅长处理复杂的中文文本。

    **模型规格与架构：**
    - **参数量：** `0.5B`
    - **核心特点：** **无分词器（Tokenizer-Free）** 设计，直接在连续语音空间建模，保留了丰富的韵律和情感细节。
    - **架构：** 采用 **扩散-自回归（Diffusion-Autoregressive）** 混合架构，语言模型部分基于 `MiniCPM-4` 初始化。

    **性能与实测表现：**
    - **基准性能：** 在 `Seed-TTS-EVAL` 等权威评测榜单上，其中英文合成的词错误率（`WER`）、字错误率（`CER`）和音色相似度（`SIM`）等多项关键指标均排名**第一**。
    - **运行效率：** 在消费级 `RTX 4090` 显卡上，实时率（`RTF`）低至 `0.17`，可满足实时应用需求。
    - **社区实测：**
      - **语音克隆：** 效果高度逼真，能精准复刻音色、口音乃至**沙哑感**等细微特征。
      - **复杂文本：** 处理数学公式、符号的能力优于同类模型（如 `CosyVoice2`）。
      - **多音字处理：** 面对“一行行行行行”等地狱级中文绕口令，可通过**音素（拼音）标注**实现完美、准确的朗读，解决了行业痛点。

    **优势：**
    - **克隆效果逼真：** **零样本语音克隆**能力强大，仅需短音频即可高度还原音色与风格。
    - **中文处理优秀：** 对符号、多音字等复杂中文场景处理得当，表现远超同类轻量级模型。

    **劣势：**
    - **双语克隆不稳定：** 实测中，中英混合的语音克隆效果有时不稳定，如同“抽卡”。
    - **滥用风险：** 语音克隆技术存在被用于制作深度伪造（Deepfake）等恶意用途的风险。
  modelSize: "0.5B"
  modelType: "语音生成"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/OpenBMB/VoxCPM"
  evaluation: |-
    0.5B 的小钢炮竟恐怖如斯

- date: "2025-09-16"
  title: "Bilibili IndexTTS 2"
  text: |-
    **摘要：** 由 `IndexTeam` 团队发布的零样本（**Zero-Shot**）语音合成模型，在精确控制语音**时长**和**情感**方面实现了重大突破，特别适用于对口型要求高的配音场景。

    **核心特性：**
    - **精准时长控制：** 模型允许用户通过指定 `token` 数量来精确控制生成音频的长度，解决了传统TTS模型时长不可控的痛点，使语音与视频画面的同步更为简单。
    - **情感音色解耦：** 实现了说话人音色（timbre）与情感风格的**分离**。用户可以提供一个参考音色，同时独立地通过另一段音频、八维情感向量或文本描述来控制输出语音的情绪，实现了“用A的声音说出B的情感”。
    - **中文拼音精控：** 支持通过拼音和声调数字（如 `hang2`）来精确控制中文发音，有效解决了多音字混淆的问题。

    **模型架构：**
    采用三阶段流水线设计：
    1.  `T2S` (Text-to-Semantic)：将文本转换为包含韵律信息的语义 `token`。
    2.  `S2M` (Semantic-to-Mel)：将语义 `token` 转换为梅尔频谱图。
    3.  `Vocoder`：使用声码器将梅尔频谱图合成为最终的音频波形。

    **性能表现：**
    - 在说话人**相似度**和**自然度**方面表现出色，其零样本语音克隆能力在开源模型中处于领先水平。
    - 支持包括中文、英文在内的多语言。
  modelSize: ""
  modelType: "语音合成, 语言"
  openSource: true
  contextWindow: ""
  officialDoc: "https://github.com/IndexTeam/IndexTTS"
  evaluation: |-
    配音大佬狂喜！终于能让姜文用萝莉音念诗了，口型还能对得上。

- date: "2025-09-10"
  title: "⭐Qwen3-Next-80B-A3B"
  text: |-
    **摘要：** 阿里巴巴通义千问团队推出的下一代基础模型架构，被视为 `Qwen 3.5` 的预览版。其核心亮点在于采用了**极致稀疏混合专家（MoE）架构**和**混合注意力机制**，旨在以极低的训练和推理成本处理超长上下文。

    **模型规格与架构：**
    - **参数量：** 总参数量 `80B`，每次推理仅激活 `3B` 参数，激活比例高达 `1:50`，属于非常激进的**稀疏 MoE** 设计。
    - **混合注意力：** 放弃了标准自注意力，采用**混合注意力机制（Hybrid Attention）**，结合了用于高效处理长程依赖的线性注意力 `Gated DeltaNet` 和保留局部关键信息能力的 `Gated Attention`。
    - **推理加速：** 原生引入**多令牌预测**（Multi-Token Prediction, MTP）机制，旨在提升生成连贯性与推理速度。
    - **训练稳定性：** 采用了 `Zero-Centered RMSNorm` 等技术，以确保大规模稀疏模型训练的数值稳定性。

    **性能与实测表现：**
    - **官方性能：** 官方宣称其性能超越 `Qwen3-32B` 稠密模型，训练成本不到其 `1/10`，在 `>32K` 的长上下文场景下推理吞吐量提升 `10` 倍以上。在 `MMLU`、`RULER` 等基准测试上表现优异，甚至超越了 `Gemini-2.5-Flash-Thinking`。
    - **社区实测：** 实测表现与官方宣传存在巨大反差。虽然 `Instruct` 版本在并发测试中表现出色，但在关键的长上下文测试中，从 `4K` 上下文开始便**完全失效**，并出现循环输出 `!` 的异常行为。此外，代码生成能力被指有明显退步，复杂逻辑推理和长文检索任务也表现不佳，甚至出现推理卡死的现象。

    **优势：**
    - **极高的理论性价比：** 架构设计先进，在理论和官方基准上展示了极高的训练和推理效率。

    **劣势：**
    - **长上下文能力严重不足：** 社区实测中，在 `4K` 以上的简单检索任务中就出现灾难性失败，与官方宣传严重不符。
    - **模型稳定性差：** 存在循环输出无意义字符、推理卡死、行为异常（“作弊”）等问题，表明模型作为“预览版”尚不成熟。
    - **代码能力退步：** 实测代码生成能力弱于前代 `30B` 模型。

    **适用场景 / 备注：**
    - 该模型目前更适合作为技术研究和架构验证的对象，而非直接用于生产环境，尤其应避免用于需要高可靠性长上下文处理和代码生成的场景。
  modelSize: "80B (总计 80B, 激活 3B)"
  modelType: "语言, 代码"
  openSource: true
  contextWindow: "256K (可扩展至1M)"
  officialDoc: "https://qwen.ai/blog?id=4074cca80393150c248e508aa62983f9cb7d27cd&from=research.latest-advancements-list"
  evaluation: |-
    架构上的巨人，实测中的巨婴？长文本测试翻车现场堪称史诗级，建议等下一个“Next”版本再 all in。😂

- date: "2025-09-05"
  title: "通义千问 Qwen3-Max-Preview"
  text: |-
    **摘要：** 阿里巴巴在Anthropic对中国禁用后，于2025年9月5日晚间发布的万亿级（1T）参数大语言模型。官方称其在多个维度实现显著增强，并在`Arena-Hard v2`等权威基准测试中表现优异，超越了包括`Claude Opus 4`在内的多个模型。

    **模型规格与架构：**
    - 参数量：1万亿（1T）
    - 上下文：最大输入`32K` tokens，最大输出`16K` tokens
    - 架构/范式：此版本为`Instruct`模型，不支持“混合思维”或“深度思考”模式。

    **性能与实测表现：**
    - 基准：在`Arena-Hard v2`基准测试中领跑，`AIME25`推理测试中得分80.6，`LiveBench`中也获得高分。
    - 实测：社区和媒体的实测结果呈现两极分化。
      - **编程能力**：部分评测（如量子位）显示其能一次性成功生成扫雷、交互式网页等复杂代码。而另一些评测（如燕十三的物联网之旅）则指出，在处理复杂的原生JavaScript任务时表现不稳定，多次尝试仍有bug，UI效果不如`GLM-4.5`。
    
    **优势：**
    - 官方跑分极高，在多个困难基准测试中名列前茅。
    - 具备优秀的多模态能力，能理解并处理图片中的复杂问题。
    - 代码生成速度快，在部分场景下能够“一次成功”完成任务。

    **劣势：**
    - 实战表现不稳定，与顶尖的基准测试成绩存在差距，部分用户反馈幻觉问题严重。
    - 在UI设计、代码逻辑严谨性等细节处理上，有时不如`GLM-4.5`或`Claude`等竞品。
    - 当前版本无“思考模式”，在处理需要深度推理的任务时可能受限。

    **适用场景 / 备注：**
    - 官方透露，该模型为`Preview`版本，正式版将很快到来，预计会有更强的表现。
  modelSize: "1T"
  modelType: "语言, 代码, 多模态"
