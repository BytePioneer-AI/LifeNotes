  officialDoc: "https://qwen.ai/blog?id=fdfbaf2907a36b7659a470c77fb135e381302028"

- date: "2025-09-23"
  title: "Qwen-Image-Edit-2509"
  text: |-
    **摘要：**
    `Qwen-Image-Edit-2509` 是通义万相团队于2025年9月发布的图像编辑模型月度更新。本次更新的核心是**新增多图编辑**能力和**增强单图编辑的一致性**，并原生支持 `ControlNet`，显著提升了图像编辑的灵活性和可控性。

    **核心功能与看点：**
    - **多图融合编辑：** 首次支持多达三张图像作为输入，可以实现“人物+人物”、“人物+商品”、“人物+场景”等多种玩法，通过图像拼接训练的方式实现多目标融合。
    ![多图融合](https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen-Image/edit2509/%E5%B9%BB%E7%81%AF%E7%89%8720.JPG#center)

    - **原生 ControlNet 支持：** 集成了 `ControlNet` 功能，允许用户通过关键点、深度图、边缘图等方式进行更精细的控制，例如轻松改变人物姿态。
    ![ControlNet 姿态控制](https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen-Image/edit2509/%E5%B9%BB%E7%81%AF%E7%89%8722.JPG#center)

    - **增强的编辑一致性：**
        - **人物一致性：** 在改变风格或姿态时，能更好地保持人物的面部ID特征。
        - **商品一致性：** 更好地保留商品的关键特征和Logo，便于生成营销海报。
        - **文本编辑：** 升级了文本编辑能力，支持修改内容、字体、颜色和材质，实现图文的完美融合。
    ![文本编辑](https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen-Image/edit2509/%E5%B9%BB%E7%81%AF%E7%89%8711.JPG#center)

    **适用场景：**
    适用于创意海报生成、旧照片修复、商品营销图制作、表情包创作等多种需要精细化控制和多元素融合的图像编辑任务。
